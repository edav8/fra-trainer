document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n Home }}\" style=\"{{ homeStyle }}\">Course overview<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ openPractice }}\" style=\"{{ practiceStyle }}\">Practice exercises<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ openGloss }}\" style=\"{{ glossStyle }}\">Glossary &amp; formulas<\u002Fbutton>\n    <div id=\"mobilecrumb\" style=\"display:none; flex:1 1 100%; padding:10px 16px; border-top:1px solid var(--color-divider); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent-700)\">{{ crumb }}<\u002Fdiv>\n    <button type=\"button\" id=\"navtoggle\" sc-camel-on-click=\"{{ toggleNav }}\" style=\"{{ navToggleStyle }}\">{{ navToggleLabel }}<\u002Fbutton>\n    <div id=\"seslabel\" style=\"padding:16px 20px 8px; font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:color-mix(in srgb, var(--color-text) 55%, transparent)\">Sessions<\u002Fdiv>\n    <div id=\"sesslist\" data-open=\"{{ navOpen }}\" style=\"display:flex; flex-direction:column\">\n      <sc-for list=\"{{ sessionList }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\">\n          <span style=\"display:flex; gap:10px; align-items:baseline\">\n            <span style=\"font-variant-numeric:tabular-nums; opacity:0.55; font-size:12px\">{{ s.num }}<\u002Fspan>\n            <span style=\"flex:1\">{{ s.title }}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"display:block; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; margin-top:4px; padding-left:26px; color:{{ s.metaColor }}\">{{ s.meta }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div id=\"sidenote\" style=\"margin-top:auto; padding:16px 20px 8px; font-size:12px; color:color-mix(in srgb, var(--color-text) 60%, transparent)\">\n      Built from the Session 1–3 handouts. Answers are graded against the class solutions.\n    <\u002Fdiv>\n    <div id=\"calcdock\" style=\"display:flex; flex-direction:column; align-items:stretch; gap:8px; padding:16px 20px; border-top:2px solid var(--color-divider); position:sticky; bottom:0; background:var(--color-bg); z-index:5\">\n      <sc-if value=\"{{ calcOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:var(--color-bg); border:2px solid var(--color-text)\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:2px solid var(--color-divider)\">\n            <span style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase\">Calculator · type to use it<\u002Fspan>\n            <span style=\"font-size:13px; color:var(--color-accent-700); font-variant-numeric:tabular-nums\">{{ calcPending }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:14px 12px; text-align:right; font-family:var(--font-heading); font-size:28px; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis\">{{ calcDisplay }}<\u002Fdiv>\n        <sc-if value=\"{{ canTransfer }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:0 12px 12px\">\n            <button type=\"button\" class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ transferCalc }}\" style=\"margin-top:0\">Put this in the answer box<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n          <div style=\"display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; padding:1px; background:var(--color-divider)\">\n            <sc-for list=\"{{ calcKeys }}\" as=\"k\" hint-placeholder-count=\"20\">\n              <button type=\"button\" sc-camel-on-click=\"{{ k.onClick }}\" style=\"{{ k.style }}\">{{ k.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ toggleCalc }}\">Calculator<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main id=\"main\" style=\"flex:1; min-width:0; padding:36px 44px 80px; max-width:960px\">\n\n    <sc-if value=\"{{ showHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">{{ courseName }} · {{ courseSub }}<\u002Fdiv>\n        <h1 style=\"font-size:46px; max-width:20ch; margin:8px 0 16px\">Learn to read a company from its numbers.<\u002Fh1>\n        <p style=\"max-width:62ch; font-size:17px\">Every lesson comes in two versions — <strong>Beginner<\u002Fstrong>, which explains the idea from scratch with small worked numbers, and <strong>Standard<\u002Fstrong>, which covers the full session material. Switch between them at the top of any lesson. Both open with an <strong>In plain words<\u002Fstrong> panel — the idea explained with no jargon, plus everyday definitions of the terms that follow. Then the detail, a worked example on real filings, and a drill that tells you why an answer was wrong. No business background needed; nothing here assumes you have seen a balance sheet before.<\u002Fp>\n        <sc-if value=\"{{ hasLast }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:24px; border-left:3px solid var(--color-accent); padding:10px 0 10px 14px; display:flex; gap:16px; align-items:center; flex-wrap:wrap\">\n            <span style=\"font-size:14px\">Last time you were on <strong>{{ lastLabel }}<\u002Fstrong>.<\u002Fspan>\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ resume }}\">Continue<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <hr class=\"hr\">\n        <div style=\"display:grid; grid-template-columns:repeat(3, 1fr); gap:0; border-top:2px solid var(--color-divider); border-bottom:2px solid var(--color-divider)\">\n          <div style=\"padding:20px 20px 20px 0; border-right:1px solid var(--color-divider)\">\n            <div style=\"font-family:var(--font-heading); font-size:34px; font-weight:700\">{{ statSessions }}<\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:4px\">Sessions ready<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px; border-right:1px solid var(--color-divider)\">\n            <div style=\"font-family:var(--font-heading); font-size:34px; font-weight:700\">{{ statQuestions }}<\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:4px\">Drill questions<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px\">\n            <div style=\"font-family:var(--font-heading); font-size:34px; font-weight:700\">{{ statScore }}<\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:4px\">Your best average<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:12px; margin-top:24px\">\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ startFirst }}\">{{ startLabel }}<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ startMix }}\">Mixed drill<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ startAll }}\">All {{ allCount }} questions<\u002Fbutton>\n          <sc-if value=\"{{ hasMissed }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ startMissed }}\">My mistakes ({{ missedCount }})<\u002Fbutton>\n          <\u002Fsc-if>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ openPractice }}\">Practice exercises<\u002Fbutton>\n        <\u002Fdiv>\n\n        <h2 style=\"margin-top:44px; font-size:26px\">Where you are<\u002Fh2>\n        <sc-raw-table class=\"table\" style=\"margin-top:12px\">\n          <sc-raw-thead>\n            <sc-raw-tr><sc-raw-th style=\"width:88px\">#<\u002Fsc-raw-th><sc-raw-th>Module<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Best drill<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ progressRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums; opacity:0.6\">{{ r.num }}<\u002Fsc-raw-td>\n                <sc-raw-td><a href=\"#\" sc-camel-on-click=\"{{ r.onClick }}\">{{ r.title }}<\u002Fa><\u002Fsc-raw-td>\n                <sc-raw-td><span class=\"tag {{ r.tagClass }}\">{{ r.status }}<\u002Fspan><\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums\">{{ r.best }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n\n        <h2 style=\"margin-top:44px; font-size:26px\">The three statements, in one breath<\u002Fh2>\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:12px\">\n          <div class=\"card\"><div class=\"card-kicker\">Point in time<\u002Fdiv><div class=\"card-title\">Balance sheet<\u002Fdiv><div class=\"card-body\">What the company controls and who has a claim on it. Assets = Liabilities + Equity, always.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\"><div class=\"card-kicker\">Over a period<\u002Fdiv><div class=\"card-title\">Income statement<\u002Fdiv><div class=\"card-body\">How much better off the owners are from operating — revenues earned minus expenses matched to them.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card\"><div class=\"card-kicker\">Over a period<\u002Fdiv><div class=\"card-title\">Cash flow statement<\u002Fdiv><div class=\"card-body\">Where cash actually moved. Profit and cash are not the same number, and the gap is where the interesting questions live.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin-top:16px; max-width:70ch\">They are linked: net income lands in retained earnings on the balance sheet and at the top of the cash flow statement; beginning cash plus the net change in cash equals ending cash on the balance sheet.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showLesson }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-end; gap:24px; border-bottom:2px solid var(--color-divider); padding-bottom:16px\">\n          <div>\n            <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">{{ curKicker }}<\u002Fdiv>\n            <h1 style=\"font-size:38px; margin:6px 0 0\">{{ curTitle }}<\u002Fh1>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:flex-start; gap:10px\">\n            <div style=\"display:flex\">\n              <button type=\"button\" sc-camel-on-click=\"{{ pickBeg }}\" style=\"{{ begTabStyle }}\">Beginner<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ pickStd }}\" style=\"{{ stdTabStyle }}\">Standard<\u002Fbutton>\n            <\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ startQuiz }}\">Drill this session<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isS1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">Imagine a friend asks you to put money into their food truck. Before you hand it over you want a regular update: what the truck owns, what it owes, whether it made money last month, and where the cash went. Financial statements are that update, written in a format everyone has agreed on so you can compare one business with another.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Financial statements<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The company's official update about its money.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Asset<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Something the company has that should help it earn later — cash, stock, a machine.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Liability<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Something the company owes to someone else.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Equity<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The owners' leftover share: assets minus liabilities.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Audit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>An outside expert's opinion on whether the report is fair.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>IFRS / US GAAP<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The two rulebooks companies follow when writing the report.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>A company is a machine for turning money into more money. Three short reports tell you how that machine is doing. Learn what each one answers and you can read almost any company.<\u002Fp>\n            <ol style=\"padding-left:20px\">\n              <li><strong>Balance sheet<\u002Fstrong> — what does it have, and who paid for it? A photo of one day.<\u002Fli>\n              <li><strong>Income statement<\u002Fstrong> — did it make money over the last stretch of time?<\u002Fli>\n              <li><strong>Cash flow statement<\u002Fstrong> — did money actually come in and go out?<\u002Fli>\n            <\u002Fol>\n            <p>They fit together. Say a shop starts the year with 100 in the bank, makes 40 of profit and keeps it all. Its bank balance moves by whatever cash actually came and went, and the 40 of profit gets added to the owners’ slice on the balance sheet. Two different reports, same event.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Question you have<\u002Fsc-raw-th><sc-raw-th>Report to open<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Can it pay its bills?<\u002Fsc-raw-td><sc-raw-td>Balance sheet and cash flow<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Is it profitable?<\u002Fsc-raw-td><sc-raw-td>Income statement<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Where did the money go?<\u002Fsc-raw-td><sc-raw-td>Cash flow statement<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>One more thing to know: the company writes these reports itself. That is why shareholders elect a board to watch management, and why an outside auditor gives an opinion on whether the report is fair. Neither guarantees the business is a good one.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">The numbers involve judgment — how long a machine lasts, how many customers will not pay. Always ask what management assumed.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Why anyone bothers<\u002Fh2>\n            <p>A company is a machine that takes money from owners and lenders, spends it, and hopes to hand back more than it took. Everyone outside the machine — a bank deciding on a loan, an investor deciding on a price, a supplier deciding on credit terms — needs a periodic report on how that is going. Financial accounting is the agreed format for that report.<\u002Fp>\n            <p>Buffett calls accounting the language of business. The practical version: if you cannot read a set of statements, someone else decides for you what the numbers mean.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Who produces the numbers, and who checks them<\u002Fh2>\n            <p>Management runs the firm and prepares the statements. That is a conflict of interest — they are grading their own homework — so two mechanisms sit on top. Shareholders elect a board of directors, which selects, advises and monitors management. An external auditor examines the statements and gives an opinion on whether they fairly present the firm's position.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">Worth remembering<\u002Fdiv><div class=\"card-body\">The auditor does not prepare the accounts and does not certify that the business is healthy. The opinion is about whether the statements are fairly presented under the rules. Wirecard is the cautionary version: €1.9bn of reported cash did not exist, while the auditor signed off and the regulator investigated the journalists.<\u002Fdiv><\u002Fdiv>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Accounting is not a science<\u002Fh2>\n            <p>The rules are rigorous and flexible at the same time. Two honest companies in identical situations can report different numbers, because the rules require estimates: how long will this machine last, how many customers will not pay, how big is this lawsuit. Managers have incentives about how those estimates land.<\u002Fp>\n            <p>So the working question for the rest of this course is never only \"what is the number?\" It is <em>what choices did management make to get this number, and why<\u002Fem>.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Which rulebook<\u002Fh2>\n            <p>Two dominate. IFRS is used in the EU, Australia, most of the G20 and India. US GAAP is used in the United States, the largest capital market in the world. Both are built on accrual accounting, which is the core idea of this course. The technical differences run to hundreds of pages and are not worth memorising.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">When the information arrives<\u002Fh2>\n            <p>Three dates, in order. The fiscal period ends — the statements describe the world as of that date. Weeks later comes the earnings announcement: a press release with headline numbers and a conference call, and this is when the share price moves. Days after that, the full financial report is published, with the detail and the footnotes.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">The statements are summaries<\u002Fh2>\n            <p>All three are heavily aggregated: enormous amounts of activity compressed into a few dozen lines. Without that compression they would be unreadable; because of it, the detail you want is often only in the notes.<\u002Fp>\n            <hr class=\"hr\">\n            <h3 style=\"font-size:18px\">Take away<\u002Fh3>\n            <ul style=\"padding-left:20px; margin:0 0 8px\">\n              <li>Balance sheet = a snapshot; income statement and cash flow statement = a period.<\u002Fli>\n              <li>Net income shows up in retained earnings and at the top of the cash flow statement.<\u002Fli>\n              <li>Beginning cash + net change in cash = ending cash.<\u002Fli>\n              <li>Every number carries a judgment. Ask whose.<\u002Fli>\n            <\u002Ful>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isS2 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">A balance sheet is a photograph of a company on one single day. Down the left, everything it has. Down the right, where the money for all that came from — lenders or owners. It always balances, because every euro of stuff was paid for by somebody.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Capitalise<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Put a cost on the list of things owned, instead of subtracting it from this year's profit.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Expense<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Subtract a cost from this year's profit straight away.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Depreciation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Spreading the cost of something long-lasting across the years you use it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Provision<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Money set aside now for a bill you are fairly sure is coming.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Historical cost<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What the company paid for it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Fair value<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What it could sell for today.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Operating vs financial<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Things used to run the business, versus money-related things like loans and investments.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>One equation runs the whole thing: <strong>what you have = what you owe + what is yours<\u002Fstrong>. It cannot fail to balance, because every euro of stuff was paid for by somebody.<\u002Fp>\n            <p>Open a bike shop. You put in 500 of your own money and borrow 300. You spend 600 on a van and keep 200 in the bank.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>What the shop has<\u002Fsc-raw-th><sc-raw-th>Amount<\u002Fsc-raw-th><sc-raw-th>Where it came from<\u002Fsc-raw-th><sc-raw-th>Amount<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Van<\u002Fsc-raw-td><sc-raw-td>600<\u002Fsc-raw-td><sc-raw-td>Bank loan<\u002Fsc-raw-td><sc-raw-td>300<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Cash<\u002Fsc-raw-td><sc-raw-td>200<\u002Fsc-raw-td><sc-raw-td>Your money (equity)<\u002Fsc-raw-td><sc-raw-td>500<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Total<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>800<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Total<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>800<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>Now the only two tests you need:<\u002Fp>\n            <ol style=\"padding-left:20px\">\n              <li><strong>Is it an asset?<\u002Fstrong> It counts only if the benefit is likely, you control it, and you can put a number on it. The van: yes. Money spent on advertising: no — the benefit is real but nobody can control or measure it, so it is simply a cost.<\u002Fli>\n              <li><strong>Is it a liability?<\u002Fstrong> It counts only if you probably owe something, from something that already happened, and you can put a number on it. Signing a contract to hire someone next year is not a liability — nothing has happened yet.<\u002Fli>\n            <\u002Fol>\n            <p>Two more ideas and you have the chapter. First, <em>capitalising<\u002Fem>: a van used for ten years goes on the list of things owned, and about a tenth of its cost is charged as a cost each year. Charging all of it now would make this year look terrible for no good reason. Second, most things you use are recorded at what you paid, not what they are worth today — and they get written down if they turn out to be worth less, never up.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">If someone shows you a number for total assets, ask what is missing. Brands the company built itself are not on the list.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">One equation, two sides<\u002Fh2>\n            <p>Assets = Liabilities + Equity. The left side is the result of investing decisions: the resources the firm controls. The right side is the result of financing decisions: who provided the money. Equity is the residual — whatever is left for owners after creditors' claims.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">What counts as an asset<\u002Fh2>\n            <p>An asset is a future economic benefit that is <strong>probable<\u002Fstrong>, <strong>owned or controlled<\u002Fstrong>, and <strong>measurable<\u002Fstrong>. All three, or it is not on the balance sheet. Every asset provides future benefits, but not every future benefit is an asset.<\u002Fp>\n            <p>This is why advertising spend is an expense (the benefit is real but not controllable or reliably measurable) and why research on a new product is an expense (the benefit is too uncertain), while a year of insurance paid in advance is an asset called prepaid insurance.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">The brand question<\u002Fdiv><div class=\"card-body\">The most valuable brands in the world are largely absent from their owners' balance sheets. Internally generated intangibles cannot be recognised — with narrow exceptions for software development, and, under IFRS, development costs once technical feasibility is established. Buy the same brand from someone else and it appears, because a purchase price is objective evidence.<\u002Fdiv><\u002Fdiv>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Capitalise or expense<\u002Fh2>\n            <p>You spend 100 in cash on a machine you will use for ten years. Two possible treatments:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Treatment<\u002Fsc-raw-th><sc-raw-th>Year 1 profit<\u002Fsc-raw-th><sc-raw-th>Assets<\u002Fsc-raw-th><sc-raw-th>Later years<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Expense it<\u002Fsc-raw-td><sc-raw-td>−100<\u002Fsc-raw-td><sc-raw-td>Cash −100, nothing added<\u002Fsc-raw-td><sc-raw-td>Untouched<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Capitalise it<\u002Fsc-raw-td><sc-raw-td>−10 (depreciation)<\u002Fsc-raw-td><sc-raw-td>Cash −100, machine +100<\u002Fsc-raw-td><sc-raw-td>−10 per year for ten years<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Same cash, same total expense over ten years, very different-looking year 1. Capitalising does not create value; it changes when the cost hits income. This is one of the most common places to flatter earnings.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">What counts as a liability<\u002Fh2>\n            <p>A liability is a future sacrifice of economic benefits that is <strong>probable<\u002Fstrong>, <strong>measurable<\u002Fstrong>, and arises from a <strong>present obligation<\u002Fstrong> from a past event. Cash paid in advance by a subscriber is a liability — the obligation is to deliver magazines, not money. A three-year employment contract with nothing performed yet is not a liability: it is executory, both sides still owe each other.<\u002Fp>\n            <p>Lawsuits split on probability. Probable and estimable: recognise a provision. Possible but not probable: disclose it in the notes and record nothing. Without merit: nothing at all.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">Boeing 737 MAX<\u002Fdiv><div class=\"card-body\">At the March 2019 grounding, Boeing clearly owed its airline customers something — but nobody could estimate how much, so it booked nothing and disclosed. The first reliable estimate, $6.1bn, was expensed in full in Q2 2019, then revised up to $8.8bn as the grounding dragged on and $9.3bn in 2020. The obligation existed from day one; the accounting followed the estimate.<\u002Fdiv><\u002Fdiv>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Historical cost or fair value<\u002Fh2>\n            <p>Historical cost asks what the firm paid. Fair value asks what it could sell for today. Cost is more reliable and more stable; fair value is more relevant and much more volatile. Operating assets are generally carried at cost less depreciation, written down when impaired but never written up — losses arrive faster than gains, which is what accountants mean by conservatism. Financial assets increasingly sit at fair value.<\u002Fp>\n            <p>In late 2008 fair value ran the other way: frozen markets meant the only observable prices were fire-sale prices, write-downs ate regulatory capital, and forced selling pushed prices lower again. Under political pressure the IASB let banks reclassify trading assets to amortised cost within days, and the FASB followed weeks later. The losses were real either way; the rule change bought time.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Operating versus financial — and why it matters<\u002Fh2>\n            <p>Value is created in operations. Financing is how the operations get funded. So before analysing anything, split both sides of the balance sheet: operating assets and liabilities relate to the core business, financial ones carry interest.<\u002Fp>\n            <p>Two summary numbers follow, and they are equal by construction:<\u002Fp>\n            <ul style=\"padding-left:20px\">\n              <li><strong>Net operating assets (NOA)<\u002Fstrong> = operating assets − operating liabilities. The net resources tied up in running the business, after the free credit operations generate themselves (unpaid suppliers, wages and taxes owed).<\u002Fli>\n              <li><strong>Invested capital (IC)<\u002Fstrong> = equity + financial liabilities − financial assets. The same money seen from the funding side.<\u002Fli>\n            <\u002Ful>\n            <p>TSMC, 2016, in NT$ millions:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Step<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">2016<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">2015<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Total assets<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">1,886,455<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">1,657,519<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Less financial assets<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(121,366)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(38,681)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Total operating assets<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>1,765,089<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>1,618,838<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Less operating liabilities<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(238,478)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(172,374)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Net operating assets<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>1,526,611<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>1,446,464<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Invested capital (from the funding side)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">1,526,611<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">1,446,465<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Some calls are subjective: how much cash is operating rather than excess, and whether a pension obligation is operating or financing. Make the call, say what you did, stay consistent.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isS3 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">Two different questions: did the business do well this month, and did cash come in this month? They are not the same. If you eat a pizza today and pay next week, the meal happened today. The income statement records things when they happen; cash follows later.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Revenue<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Sales the company has actually earned.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Expense<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A cost that has been used up in earning those sales.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Net income<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Revenue minus expenses. Profit.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Accrual<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The rule that says record it when it happens, not when the money moves.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Dividend<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cash handed to the owners. Not a cost of running the business.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>EBITDA<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Profit measured before several real costs are taken off. Treat it with suspicion.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>The income statement answers one question: over a stretch of time, did the business earn more than it used up? Two ingredients — revenue (sales you earned) and expenses (costs you used up). Subtract, and you have profit.<\u002Fp>\n            <p>The one rule that trips everyone up is <strong>timing<\u002Fstrong>. If you eat a pizza today and pay next week, the meal happened today. Accounting records events when they happen, not when the money moves.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Event<\u002Fsc-raw-th><sc-raw-th>When it counts as revenue or expense<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>You deliver goods today, customer pays in 30 days<\u002Fsc-raw-td><sc-raw-td>Today — revenue now, cash later<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Customer pays today for delivery next month<\u002Fsc-raw-td><sc-raw-td>Next month — cash now, revenue later<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>You use a month of insurance you paid for last year<\u002Fsc-raw-td><sc-raw-td>This month<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>You buy a van you will use for five years<\u002Fsc-raw-td><sc-raw-td>A slice each year, not all now<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>A tiny month: you sell 100 of drinks that cost you 40, and pay 20 of wages. Profit is 40. If you then hand 10 to the owners, that is a <strong>dividend<\u002Fstrong> — it is not a cost of running the business, so profit stays 40. Dividends never appear on the income statement.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Over a company’s whole life, profit and cash add up to the same total. Accrual accounting only changes which period each amount lands in.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">The statement that connects two balance sheets<\u002Fh2>\n            <p>A balance sheet cannot tell you how a year went — it is a snapshot. Put two snapshots side by side and something has to explain the change in equity. That is the income statement.<\u002Fp>\n            <p>Expand equity: Assets = Liabilities + Contributed capital + Retained earnings. Retained earnings moves for exactly two reasons — net income adds to it, dividends take out of it. And net income is revenues minus expenses. So:<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-body\" style=\"font-family:var(--font-heading); font-size:16px\">Assets = Liabilities + Contributed capital + Retained earnings<sub>opening<\u002Fsub> + Revenues − Expenses − Dividends<\u002Fdiv><\u002Fdiv>\n            <p><strong>Dividends are not an expense.<\u002Fstrong> They are a distribution of profit to owners, not a cost of earning it. They never appear on the income statement.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Four ingredients<\u002Fh2>\n            <ul style=\"padding-left:20px\">\n              <li><strong>Revenues<\u002Fstrong> — assets up or liabilities down, from delivering goods and services in normal operations.<\u002Fli>\n              <li><strong>Expenses<\u002Fstrong> — assets down or liabilities up, from those same normal operations.<\u002Fli>\n              <li><strong>Gains and losses<\u002Fstrong> — net changes in assets and liabilities <em>outside<\u002Fem> normal operations. Buy coffee equipment for 10,000 and sell it weeks later for 9,500: that 500 is a loss, not an expense, and the 9,500 is not revenue.<\u002Fli>\n              <li><strong>Net income<\u002Fstrong> — what is left.<\u002Fli>\n            <\u002Ful>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Cash basis versus accrual basis<\u002Fh2>\n            <p>Cash basis records revenue when cash arrives and expense when cash leaves. It is simple and hard to manipulate, and it is a bad measure of a period, because it lumps a ten-year machine into the month you paid for it and ignores a sale made on credit.<\u002Fp>\n            <p>Accrual basis records revenue when it is earned — the goods or services are delivered, collection is reasonably assured, and the amount is measurable — and matches expenses to the revenue they helped produce. Over the whole life of a firm the two give the same total. Accrual accounting only shifts <em>when<\u002Fem> cash flows are reported, into the periods that better reflect economic performance.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">Worked example — Ailawadi Corporation, January<\u002Fdiv><div class=\"card-body\">Cash in: 75,000 owner investment, 40,000 six-month bank loan at 6%, 1,200 customer advance for February delivery, 60,000 cash sales. Cash out: 6,000 for two months' rent at 3,000, 36,000 for display equipment (three-year life, no salvage), 1,200 for twelve months' insurance, 750 utilities, 3,500 salaries, 44,800 merchandise. Also: customers owe 9,500, suppliers are owed 3,900, unpaid utilities 260 and salaries 1,260, inventory on hand 5,500.<\u002Fdiv><\u002Fdiv>\n            <sc-raw-table class=\"table\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>January<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Cash basis<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Accrual basis<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Revenue<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">61,200<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">69,500<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Merchandise / COGS<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(44,800)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(43,200)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Salaries<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(3,500)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(4,760)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Rent<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(6,000)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(3,000)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Insurance<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(1,200)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(100)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Utilities<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(750)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(1,010)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Equipment / depreciation<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(36,000)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(1,000)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Interest<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">—<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(200)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Net income<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>(31,050)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>16,230<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Same month, same bank account, a 47,000 swing. Note what moved: the 1,200 advance is a liability, not revenue, because nothing has been delivered; only one of the two rent months belongs to January; insurance and equipment are spread over the periods that use them; the loan itself is neither revenue nor expense, only its 200 of accrued interest.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Product costs and period costs<\u002Fh2>\n            <p>Matching asks when the firm consumes the benefit. Product costs attach to a specific unit sold — raw materials, factory labour, the lights on the factory floor — and wait in inventory until the sale. Period costs cannot be attached to any unit, so they hit the period they occur in: the CEO's salary, R&amp;D, advertising. Matching is genuinely violated for period costs, which is exactly why R&amp;D-heavy firms look unprofitable while they are building something.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Profit has several definitions<\u002Fh2>\n            <p>Operating profit, or EBIT, is before interest and taxes. EBITDA adds back depreciation and amortisation. \"Earnings before special items\" is before whatever management considers unusual — and there is no standard definition of that, nor an obligation to report it. The 2019 vintage gave us \"community-adjusted EBITDA\" and 2020 gave us \"EBITDAC\", earnings before the pandemic.<\u002Fp>\n            <p>Buffett's objection to EBITDA is that interest and taxes are real costs, and that capital expenditure is not paid for by the tooth fairy.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">NOPAT<\u002Fh2>\n            <p>Net income mixes operating results with financing results, so two identical businesses with different debt report different profits. NOPAT is the after-tax profit from operations as if the firm were entirely equity-financed — after tax and financing-neutral, which no other earnings measure is. It is the numerator of return on invested capital and the starting point for free cash flow.<\u002Fp>\n            <sc-raw-table class=\"table\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Approach<\u002Fsc-raw-th><sc-raw-th>Calculation<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Net income − non-operating income × (1 − tax rate)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Operating profit − operating tax expense + associate/JV income × (1 − tax rate)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>EBIT × (1 − tax rate) — quick and dirty<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <hr class=\"hr\">\n            <h3 style=\"font-size:18px\">Take away<\u002Fh3>\n            <ul style=\"padding-left:20px; margin:0\">\n              <li>Anything that hits the income statement hits equity on the balance sheet.<\u002Fli>\n              <li>Accruals move the timing of recognition, never the lifetime total.<\u002Fli>\n              <li>Dividends reduce retained earnings and are not an expense.<\u002Fli>\n              <li>When someone quotes an adjusted profit measure, ask what was adjusted out.<\u002Fli>\n            <\u002Ful>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">A business takes money from owners and lenders, buys things with it, and tries to sell something for more than it cost. Everyone outside — a bank, an investor, a supplier — needs a periodic report on how that is going. This chapter is the tour of that report and who reads it.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Shareholder<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>An owner. Gets whatever is left after everyone else is paid.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Creditor<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A lender. Gets a fixed amount back, first.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Disclosure<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Telling outsiders about your finances.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Fiscal year<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The company's own twelve-month reporting period. Need not end in December.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Current<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Due, or expected to be used up, within a year.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Noncurrent<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Longer than a year.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>ROE<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Profit compared with what the owners put in.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>Everything in this course sits on one idea: a business raises money, spends it on things, uses those things to sell something, and reports the result to the people outside who care.<\u002Fp>\n            <ol style=\"padding-left:20px\">\n              <li><strong>Planning<\u002Fstrong> — deciding what to sell and to whom.<\u002Fli>\n              <li><strong>Financing<\u002Fstrong> — getting the money. From lenders, who must be repaid, or from owners, who must not.<\u002Fli>\n
