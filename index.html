rhead, and borrowing costs during construction.' },\n      { t: 'num', k: 'Straight line', p: 'A truck costs 80,000, has a five-year useful life and a residual value of 8,000. What is annual straight-line depreciation?', a: 14400, tol: 1, e: 'Depreciable base 80,000 − 8,000 = 72,000, over 5 years = 14,400 a year. Book value after year 1 is 65,600.' },\n      { t: 'num', k: 'Double declining', p: 'Same truck. What is depreciation in year 1 under double-declining-balance?', a: 32000, tol: 1, e: 'Rate = 2 × straight-line 20% = 40%, applied to the full book value (residual is ignored in the calculation): 80,000 × 40% = 32,000. Year 2 is 48,000 × 40% = 19,200.' },\n      { t: 'num', k: 'Units of production', p: 'Same truck, expected to run 80,000 miles. It runs 18,000 miles in year 1. What is depreciation?', a: 16200, tol: 1, e: 'Rate = 72,000 / 80,000 = 0.90 per mile, so 18,000 × 0.90 = 16,200. Activity, not time, drives the charge.' },\n      { t: 'mcq', k: 'Methods', p: 'Over the full useful life, total depreciation under straight-line versus double-declining-balance is:', o: ['Higher under double-declining-balance', 'Identical — only the pattern differs', 'Higher under straight-line', 'Dependent on the tax rate'], a: 1, e: 'Both end at the same residual value. Accelerated methods simply front-load the expense.' },\n      { t: 'num', k: 'Estimate changes', p: 'After four years of straight-line depreciation at 14,400, the truck\\u2019s life is extended from five to seven years. Residual value stays 8,000. What is year 5 depreciation?', c: 'Cost 80,000; accumulated depreciation 4 × 14,400 = 57,600.', a: 4800, tol: 1, e: 'Book value 22,400, remaining life 5 − 4 + 2 = 3 years, so (22,400 − 8,000) / 3 = 4,800. Estimate changes are applied prospectively — prior years are never restated.' },\n      { t: 'num', k: 'Disposals', p: 'The truck is sold for 25,000 after four years of straight-line depreciation. What is the gain or loss? (Use a minus sign for a loss.)', a: 2600, tol: 1, e: 'Book value = 80,000 − 57,600 = 22,400. Proceeds of 25,000 exceed that by 2,600, so a gain — reported within income from continuing operations, but non-recurring.' },\n      { t: 'mcq', k: 'Impairment', p: 'An asset\\u2019s recoverable amount falls well below its book value. Under IFRS:', o: ['Nothing happens until disposal', 'Recognise an impairment loss now, writing the asset down', 'Depreciate faster instead', 'Revalue upward to market'], a: 1, e: 'Impairments hit income immediately and reduce future depreciation, which flatters subsequent margins — one reason big write-downs cluster in bad years already.' }\n    ],\n    f6: [\n      { t: 'mcq', k: 'Concept', p: 'Liabilities and equity on the balance sheet tell you:', o: ['What management has invested in', 'How the assets were financed', 'The market value of the firm', 'Future profitability'], a: 1, e: 'Assets are uses of funds; liabilities and equity are sources. Financial leverage rises as assets are funded with liabilities.' },\n      { t: 'mcq', k: 'Payables', p: 'Why do companies try to maximise accounts payable?', o: ['Payables reduce reported liabilities', 'Trade payables are typically non-interest-bearing — free financing that improves operating cash flow', 'Payables increase net working capital', 'They lower cost of goods sold'], a: 1, e: 'Inventory arrives now and is paid for later, so operating cash flow improves without any interest charge. Net working capital falls because current liabilities rise.' },\n      { t: 'num', k: 'Cash discounts', p: 'A purchase of 160 carries terms of 2/10, n/30. Under the net-of-discount method, at what amount is the inventory recorded?', a: 156.8, tol: 0.05, e: '160 − (160 × 2%) = 156.80. Paying after the discount window records the extra 3.20 as interest expense — discounts lost, not more inventory.' },\n      { t: 'mcq', k: 'Accruals', p: 'A company deliberately underestimates its accrued liabilities. The effect is:', o: ['Understated liabilities and expenses, overstated income and retained earnings', 'Overstated liabilities, understated income', 'No effect on income', 'Overstated cash'], a: 0, e: 'Accruals are estimates, so they are a lever: under-accrue now to boost income, and the shortfall lands in a later period.' },\n      { t: 'mcq', k: 'Provisions', p: 'A provision is recognised when:', o: ['Any lawsuit is filed', 'An outflow is probable (at least around 50% likely) and the amount is reasonably estimable', 'The amount is certain', 'Management chooses to'], a: 1, e: 'Recognise at the most likely amount: liability up, expense up. Fail either test and it stays a contingent liability.' },\n      { t: 'mcq', k: 'Contingencies', p: 'A contingent liability that is material but not probable is:', o: ['Recognised at fair value', 'Disclosed in the notes, not recognised on the balance sheet', 'Deducted from equity', 'Ignored entirely'], a: 1, e: 'Off balance sheet, in the notes. This is why reading the contingencies note matters for any litigation-heavy business.' },\n      { t: 'num', k: 'Warranties', p: 'A company estimates warranty costs of 2,000 on this period\\u2019s sales, then spends 400 in cash on repairs. What is the closing warranty liability?', a: 1600, tol: 1, e: 'The expense of 2,000 is recognised in the period of sale (matching). Repairs draw the liability down: 2,000 − 400 = 1,600. The repair itself is not an expense.' },\n      { t: 'num', k: 'Interest', p: 'A company borrows 3,000 on 1 January at a 6% annual rate, with interest payable quarterly. How much interest is accrued at 31 March?', a: 45, tol: 0.5, e: '3,000 × 6% × 3/12 = 45. The borrowing itself never touches income; interest accrues as time passes.' },\n      { t: 'mcq', k: 'Strategy', p: 'The usual matching strategy for financing is:', o: ['Finance long-term assets with current liabilities', 'Finance current assets with current liabilities and long-term assets with long-term liabilities', 'Finance everything with equity', 'Finance everything with short-term debt to minimise interest'], a: 1, e: 'Match the life of the funding to the life of the asset, so repayments line up with the cash the asset generates.' }\n    ],\n    f7: [\n      { t: 'mcq', k: 'Structure', p: 'Shareholders\\u2019 equity splits into:', o: ['Common and preferred stock only', 'Contributed capital and earned capital', 'Assets and liabilities', 'Cash and retained earnings'], a: 1, e: 'Contributed capital is what shareholders paid in; earned capital is retained earnings plus accumulated other comprehensive income.' },\n      { t: 'mcq', k: 'Shares', p: 'Authorised, issued and outstanding shares differ how?', o: ['They are synonyms', 'Authorised is the legal maximum, issued is what has been sold, outstanding is issued less treasury shares', 'Outstanding exceeds issued', 'Issued exceeds authorised'], a: 1, e: 'Outstanding shares are the ones that vote and receive dividends — and the denominator in earnings per share.' },\n      { t: 'mcq', k: 'Par value', p: 'Par value is:', o: ['The market price at issue', 'An arbitrary legal value per share, unrelated to market value', 'The book value per share', 'The dividend per share'], a: 1, e: 'Cash received above par is recorded as additional paid-in capital. Par has almost no economic meaning today.' },\n      { t: 'num', k: 'Share issue', p: '500 shares of 1 par value common stock are issued at 15 per share. What amount is credited to additional paid-in capital?', a: 7000, tol: 1, e: 'Cash 7,500; common stock at par 500; the remaining 7,000 is additional paid-in capital. Issuing shares never creates revenue.' },\n      { t: 'mcq', k: 'Treasury stock', p: 'A company repurchases its own shares above the original issue price. The difference is:', o: ['A loss on the income statement', 'Recorded within equity — treasury transactions never produce a gain or loss in income', 'A gain in other income', 'An expense'], a: 1, e: 'A company cannot profit from trading in its own shares. Buybacks reduce equity, assets and share count.' },\n      { t: 'mcq', k: 'Dividends', p: 'A cash dividend of 780 is paid. The effect is:', o: ['Expense 780, cash down 780', 'Retained earnings down 780, cash down 780; no income effect', 'Liability up 780', 'Contributed capital down 780'], a: 1, e: 'A distribution of profit, not a cost of earning it. On the declaration date a dividend payable liability arises; payment settles it.' },\n      { t: 'mcq', k: 'Preferred stock', p: 'Cumulative preferred stock means:', o: ['Dividends accumulate as an interest-bearing liability', 'Unpaid preferred dividends must be paid before any common dividend', 'Preferred holders always vote', 'Dividends increase each year'], a: 1, e: 'Arrears are not a recognised liability until declared, but they are disclosed — and they sit ahead of the common holders in the queue.' },\n      { t: 'mcq', k: 'Splits', p: 'A two-for-one stock split:', o: ['Increases equity and assets', 'Doubles the share count and halves par value, leaving total equity unchanged', 'Reduces retained earnings by market value', 'Is recorded as revenue'], a: 1, e: 'Nothing of value changes hands. A stock dividend, by contrast, moves an amount out of retained earnings into contributed capital.' }\n    ],\n    f8: [\n      { t: 'mcq', k: 'Classification', p: 'The accounting treatment of a share investment depends mainly on:', o: ['The purchase price', 'The level of influence or control the investor has over the investee', 'Whether it is listed', 'The holding period'], a: 1, e: 'Three levels: passive (generally under 20%), significant influence (roughly 20–50%, an associate), and control (over 50%, a subsidiary).' },\n      { t: 'mcq', k: 'Passive', p: 'A passive equity stake of 5% is generally carried at:', o: ['Cost, never remeasured', 'Fair value, with changes flowing through income (or OCI where that election applies)', 'Equity method', 'Consolidated'], a: 1, e: 'No influence, so the reported value follows the market rather than the investor\\u2019s share of the investee\\u2019s results.' },\n      { t: 'mcq', k: 'Equity method', p: 'A 30% stake accounted for using the equity method is adjusted for:', o: ['Market price movements', 'The investor\\u2019s share of the investee\\u2019s profit, less dividends received', 'Nothing after acquisition', 'The full revenue of the investee'], a: 1, e: 'Profit share increases the carrying amount and income; dividends received reduce the carrying amount because they are a return of that value, not new income.' },\n      { t: 'num', k: 'Equity method', p: 'An investor holds 30% of an associate carried at 1,000. The associate earns 200 and pays total dividends of 50. What is the closing carrying amount?', a: 1045, tol: 1, e: '1,000 + 30% × 200 − 30% × 50 = 1,000 + 60 − 15 = 1,045.' },\n      { t: 'mcq', k: 'Control', p: 'A 70% stake requires:', o: ['Fair value accounting', 'Equity method', 'Consolidation — 100% of the subsidiary\\u2019s assets, liabilities and results, with a non-controlling interest', 'Cost method'], a: 2, e: 'Consolidation brings in everything the parent controls, then shows the 30% it does not own as non-controlling interest within equity.' },\n      { t: 'mcq', k: 'Analysis', p: 'Why can consolidation change a group\\u2019s reported margins even with no change in the business?', o: ['Because consolidation excludes revenue', 'Because a fully consolidated subsidiary brings in all its revenue and costs, while an equity-method stake shows only a single profit line', 'Because goodwill is revenue', 'It cannot'], a: 1, e: 'Same economics, very different-looking statements — which is why comparing a group with an associate-heavy peer needs care.' },\n      { t: 'mcq', k: 'Fair value', p: 'A Level 1 fair value input is:', o: ['A management model', 'A quoted price in an active market for an identical asset', 'A broker estimate for a similar asset', 'Historical cost'], a: 1, e: 'Level 2 uses observable inputs for similar assets; Level 3 uses unobservable model inputs, which is where valuation becomes a judgment call.' },\n      { t: 'mcq', k: 'Earnings management', p: 'Where is the earnings-management risk in financial investments?', o: ['In the choice of ticker', 'In whether fair value changes run through income or OCI, and in timing which gains are realised', 'Fair value removes all discretion', 'In the dividend date only'], a: 1, e: 'Classification is largely locked in at purchase, but the classification decision itself, and the timing of disposals, both shape reported profit.' }\n    ],\n    f9: [\n      { t: 'mcq', k: 'Purpose', p: 'The statement of cash flows exists because:', o: ['Net income is not audited', 'Accrual profit and cash generation differ, and users need to see liquidity and solvency directly', 'IFRS requires four statements', 'It replaces the income statement'], a: 1, e: 'Cash pays wages, interest and dividends. A profitable company can still run out of it.' },\n      { t: 'mcq', k: 'Classification', p: 'Cash paid to purchase equipment is classified as:', o: ['Operating', 'Investing', 'Financing', 'Non-cash'], a: 1, e: 'Investing covers acquiring and disposing of long-lived assets. Interest and taxes paid generally sit in operating.' },\n      { t: 'mcq', k: 'Classification', p: 'A dividend paid to shareholders is:', o: ['An operating outflow', 'A financing outflow', 'An investing outflow', 'An expense'], a: 1, e: 'Returning capital to owners is financing. Dividends received from investments generally sit in operating or investing, depending on the framework and policy.' },\n      { t: 'num', k: 'Indirect method', p: 'Net income 500; depreciation 120; receivables increased by 60; inventory fell by 30; payables increased by 40. What is cash from operations?', a: 630, tol: 1, e: '500 + 120 − 60 + 30 + 40 = 630. Add back non-cash charges; an asset increase consumes cash, a liability increase provides it.' },\n      { t: 'mcq', k: 'Indirect method', p: 'Depreciation is added back to net income because:', o: ['It is not a real expense', 'It reduced profit without any cash leaving in this period', 'It is an investing activity', 'It is an estimate'], a: 1, e: 'The cash left when the asset was bought, and that appeared as an investing outflow in that earlier period.' },\n      { t: 'mcq', k: 'Gains', p: 'A gain on the sale of equipment is deducted in the operating section because:', o: ['Gains are not taxable', 'The whole cash proceeds belong in investing, so the gain must be removed from operating to avoid double counting', 'Gains are non-cash by definition', 'It reduces net income'], a: 1, e: 'The proceeds appear once, in investing. The gain is only the accounting difference against book value.' },\n      { t: 'mcq', k: 'Method choice', p: 'The direct and indirect methods differ in:', o: ['Total cash from operations', 'Only the presentation of the operating section', 'The classification of dividends', 'The definition of cash'], a: 1, e: 'Same total, different format. Most companies use the indirect method because it starts from a number they already have.' },\n      { t: 'mcq', k: 'Non-cash items', p: 'A building is acquired by issuing shares directly to the seller. On the statement of cash flows this is:', o: ['An investing outflow and a financing inflow', 'Disclosed as a significant non-cash investing and financing activity, with no cash flow reported', 'Operating', 'Not disclosed'], a: 1, e: 'No cash moved, so nothing goes in the body of the statement — but it is disclosed, because the firm\\u2019s asset and financing structure changed materially.' },\n      { t: 'mcq', k: 'Analysis', p: 'Three competitors each generated 100,000 of total cash. Why does the classification still matter?', o: ['It does not', 'Cash from operations is repeatable; cash from selling assets or issuing debt is not', 'Only the total is audited', 'Investing cash is always better'], a: 1, e: 'A firm funding itself by selling assets and borrowing looks identical on the bottom line and is in a very different position.' }\n    ],\n    f10: [\n      { t: 'mcq', k: 'Common-size', p: 'Vertical (common-size) analysis restates:', o: ['Each year as a percentage of the prior year', 'Income statement items as a percentage of sales and balance sheet items as a percentage of total assets', 'Everything in local currency', 'Ratios as indices'], a: 1, e: 'Vertical analysis makes companies of different sizes comparable. Horizontal analysis tracks change across time.' },\n      { t: 'num', k: 'ROE', p: 'Net income is 500 and average shareholders\\u2019 equity is 2,500. What is ROE?', a: 20, tol: 0.2, e: 'ROE = 500 / 2,500 = 20%. It measures the return on the owners\\u2019 investment, leverage included. Answer in per cent.' },\n      { t: 'num', k: 'ROA', p: 'Net income 500, average total assets 5,000. What is ROA, in per cent?', a: 10, tol: 0.2, e: 'ROA = 500 / 5,000 = 10% — the return on every unit invested in assets, regardless of how they were funded.' },\n      { t: 'num', k: 'Leverage', p: 'With ROE of 20% and ROA of 10%, what is the return on financial leverage (ROFL), in percentage points?', a: 10, tol: 0.2, e: 'ROFL = ROE − ROA = 10 points. Borrowing at a cost below ROA lifts shareholder returns; it magnifies losses just as effectively.' },\n      { t: 'num', k: 'Disaggregation', p: 'Sales are 10,000, net income 500, average assets 5,000. What is asset turnover?', a: 2, tol: 0.05, e: 'AT = 10,000 / 5,000 = 2.0. With profit margin of 5%, ROA = 5% × 2.0 = 10% — the two levers behind every ROA.' },\n      { t: 'mcq', k: 'Disaggregation', p: 'A luxury goods maker and a grocery chain report similar ROA. The likely reason is:', o: ['Identical business models', 'High margin and low turnover for one; low margin and high turnover for the other', 'Both have the same leverage', 'Accounting differences only'], a: 1, e: 'ROA = profit margin × asset turnover. Strategy usually decides which lever a firm pulls, and the trade-off between them is real.' },\n      { t: 'num', k: 'Turnover', p: 'COGS is 6,000 and average inventory is 1,000. What is inventory turnover, in times per year?', a: 6, tol: 0.1, e: 'Six times a year, roughly 61 days of inventory (365 / 6). Compare it with the payables period to see who is financing the working capital.' },\n      { t: 'mcq', k: 'Turnover', p: 'Receivables turnover falls from 8 to 5 while sales are flat. That suggests:', o: ['Faster collection', 'Slower collection — customers are taking longer to pay, consuming cash and raising bad-debt risk', 'Lower credit sales', 'Higher inventory'], a: 1, e: 'Days sales outstanding rose from about 46 to 73 days. Watch it alongside the allowance for doubtful accounts.' },\n      { t: 'mcq', k: 'Limits', p: 'The main limitation of ratio analysis is:', o: ['Ratios are hard to compute', 'Ratios describe symptoms, not causes — they need the business context and consistent accounting policies to interpret', 'Ratios are not disclosed', 'Ratios apply only to listed companies'], a: 1, e: 'A ratio comparison across firms with different inventory methods, lease structures or revenue timing can mislead before it informs.' }\n    ]\n  };\n\n  exercises = {\n    fa: [\n      {\n        key: 'ex-accrual', title: 'Cash basis versus accrual basis', sub: 'One month, built one line at a time', ses: 'Session 03 · Income Statement',\n        brief: 'Ailawadi Corporation opened on 1 January. Money IN during January: 75,000 from the owner for all the shares; 40,000 borrowed from the bank on 1 January, repayable 30 June, interest 6% a year; 1,200 from a customer for goods to be delivered in February; 60,000 of cash sales. Money OUT during January: 6,000 for rent (two months at 3,000 each); 36,000 for display equipment expected to last three years with no resale value; 1,200 for insurance covering 1 January to 31 December; 750 for utility bills; 3,500 of salaries; 44,800 for merchandise to sell. At 31 January: customers still owe 9,500 for January sales; the firm still owes suppliers 3,900 for January merchandise; unpaid utility bills are 260 and unpaid salaries 1,260; merchandise costing 5,500 is still on the shelves.',\n        steps: [\n          { t: 'fill', p: 'Step 1. The cash basis counts money in as revenue, whenever it arrives and whatever it is for. Of the four amounts that came in, how much counts as revenue?', rows: [\n            { l: 'Cash sales', a: 60000, w: 'Cash arrived from customers, so on the cash basis it is revenue.' },\n            { l: 'Customer advance for February goods', a: 1200, w: 'Nothing has been delivered, but the cash basis does not care about that. Cash in, revenue now.' },\n            { l: 'Owner investment', a: 0, w: 'Zero. The owner buying shares is not a sale to a customer, it is funding. It never appears on any income statement.' },\n            { l: 'Bank loan received', a: 0, w: 'Zero. Borrowing is not income — you have to pay it back. Only the interest is ever a cost.' },\n            { l: 'Total cash basis revenue', a: 61200, w: '60,000 + 1,200. The other two amounts are financing, not trading.' }\n          ], e: 'The lesson of this step: cash coming in is not the same as revenue. Two of the four amounts here are money from the owner and from a lender, and neither is a sale.' },\n          { t: 'fill', p: 'Step 2. The cash basis counts money out as expense, in full, on the day it leaves. Enter each amount paid in January.', rows: [\n            { l: 'Merchandise paid for', a: 44800, w: 'The full amount paid, even though 5,500 of it is still unsold on the shelf.' },\n            { l: 'Rent paid', a: 6000, w: 'Both months paid in January, so both months are charged in January.' },\n            { l: 'Equipment paid for', a: 36000, w: 'The whole three-year machine, charged to a single month, because that is when the cash left.' },\n            { l: 'Insurance paid', a: 1200, w: 'A full year of cover, charged to January.' },\n            { l: 'Utilities paid', a: 750, w: 'Only what was actually paid. The 260 still owed is ignored — no cash, no entry.' },\n            { l: 'Salaries paid', a: 3500, w: 'Again only what was paid. The 1,260 owed to staff is ignored.' },\n            { l: 'Total cash basis expenses', a: 92250, w: '44,800 + 6,000 + 36,000 + 1,200 + 750 + 3,500.' }\n          ], e: 'Notice what the cash basis does badly: it charges a three-year machine and a twelve-month insurance policy entirely to one month, and it ignores bills that have been incurred but not yet paid.' },\n          { t: 'fill', p: 'Step 3. Subtract. Cash basis revenue was 61,200 (step 1) and cash basis expenses were 92,250 (step 2). What is January net income on the cash basis? Use a minus sign for a loss.', rows: [\n            { l: 'Cash basis net income', a: -31050, w: '61,200 of revenue − 92,250 of expenses = −31,050. A shop that sold 60,000 of goods reports a 31,000 loss, purely because of when the cash happened to move.' }\n          ], e: 'This is the problem accrual accounting exists to solve. Nothing here is wrong arithmetically; it is simply a bad description of how the month went.' },\n          { t: 'fill', p: 'Step 4. Now the accrual basis. Revenue counts when goods are delivered, not when cash arrives. Work out revenue for January.', rows: [\n            { l: 'Cash sales delivered in January', a: 60000, w: 'Delivered and paid for. Revenue either way.' },\n            { l: 'Sales delivered in January but not yet paid for', a: 9500, w: 'Goods have gone out; the customer owes you. Earned, so it is revenue now, and the 9,500 sits on the balance sheet as a receivable.' },\n            { l: 'Customer advance for February goods', a: 0, w: 'Zero. Cash in hand, but nothing delivered yet, so nothing is earned. The 1,200 is a liability until the goods ship in February.' },\n            { l: 'Total accrual revenue', a: 69500, w: '60,000 + 9,500. This is what the shop actually did in January.' }\n          ], e: 'Two changes from the cash basis, in opposite directions: add the 9,500 you earned but have not collected, remove the 1,200 you collected but have not earned.' },\n          { t: 'fill', p: 'Step 5. Cost of goods sold. You only charge the cost of the goods that actually left the shelves, so work out what was bought and take off what is left.', rows: [\n            { l: 'Merchandise paid for in cash', a: 44800, w: 'What was paid for during the month.' },\n            { l: 'Merchandise bought but still unpaid', a: 3900, w: 'Bought in January on credit, so it belongs to January\\u2019s purchases even though the cash has not gone.' },\n            { l: 'Total merchandise purchased', a: 48700, w: '44,800 + 3,900.' },\n            { l: 'Less merchandise still on the shelves', a: 5500, w: 'Unsold goods are still an asset. Their cost has not been used up, so it is not an expense yet.' },\n            { l: 'Cost of goods sold', a: 43200, w: '48,700 purchased − 5,500 still held = 43,200 actually sold. This is matching: only the cost of what you sold is set against the revenue from selling it.' }\n          ], e: 'Purchases are not the same as cost of goods sold. The difference between them is the change in inventory.' },\n          { t: 'fill', p: 'Step 6. The remaining expenses. For each one, charge only the part that belongs to January.', rows: [\n            { l: 'Salary expense', a: 4760, w: '3,500 paid + 1,260 earned by staff but unpaid. The work was done in January, so the cost is January\\u2019s.' },\n            { l: 'Rent expense', a: 3000, w: 'One month of the two paid for. The other 3,000 is prepaid rent, an asset, until February.' },\n            { l: 'Insurance expense', a: 100, w: '1,200 for twelve months of cover, so 100 a month. The other 1,100 stays on the balance sheet as prepaid insurance.' },\n            { l: 'Utilities expense', a: 1010, w: '750 paid + 260 owed. The electricity was consumed in January whether the bill has arrived or not.' },\n            { l: 'Depreciation expense', a: 1000, w: '36,000 over three years is 12,000 a year, so 1,000 for one month. The machine will earn revenue for 36 months, so its cost is spread over 36 months.' },\n            { l: 'Interest expense', a: 200, w: '40,000 × 6% × 1/12. Interest builds up with time even though nothing is paid until the loan matures in June.' },\n            { l: 'Total other expenses', a: 10070, w: '4,760 + 3,000 + 100 + 1,010 + 1,000 + 200.' }\n          ], e: 'Every line follows the same question: how much of this cost was used up in January? Not how much was paid.' },\n          { t: 'fill', p: 'Step 7. Finish the accrual income statement. You worked out revenue of 69,500 (step 4), cost of goods sold of 43,200 (step 5) and other expenses of 10,070 (step 6). The cash basis gave a loss of 31,050.', rows: [\n            { l: 'Accrual net income', a: 16230, w: '69,500 revenue − 43,200 cost of goods sold − 10,070 other expenses = 16,230 profit.' },\n            { l: 'Difference from the cash basis figure', a: 47280, w: '16,230 − (−31,050) = 47,280. Same bank account, same month, same transactions.' },\n            { l: 'Of that difference, the part caused by the equipment alone', a: 35000, w: '36,000 charged under the cash basis against 1,000 of depreciation. One decision about timing explains three quarters of the gap.' }\n          ], e: 'Neither statement is dishonest. The cash basis answers \"what happened to the money\"; the accrual basis answers \"how did the business perform\". Over the whole life of the firm they add up to exactly the same total.' }\n        ]\n      },\n      {\n        key: 'ex-noa', title: 'Operating assets, NOA and invested capital', sub: 'Split a real balance sheet in two', ses: 'Session 02 · Balance Sheet',\n        brief: 'TSMC, 2016, NT$ millions. Total assets 1,886,455. Financial assets: fair value through profit and loss 6,451; held to maturity 67,789; available for sale 16,610; hedging derivatives 6; other financial assets 4,100; held to maturity (noncurrent) 22,308; carried at cost (noncurrent) 4,102. Operating liabilities total 238,478. Total equity 1,390,051. Financial liabilities: short-term loans 57,958; financial liabilities at fair value 191; long-term liabilities current portion 38,110; bonds payable 153,094; long-term bank loans 22; net defined benefit liability 8,551.',\n        steps: [\n          { t: 'fill', p: 'Step 1. Separate the money-related assets from the ones used to run the business.', rows: [\n            { l: 'Total financial assets', a: 121366, w: 'The seven financial lines added together. They earn interest or track markets; they are not what the factories run on.' },\n            { l: 'Total operating assets', a: 1765089, w: '1,886,455 − 121,366. Subtracting is quicker than adding up the operating lines, because financial assets are usually the shorter list.' }\n          ], e: 'Value is created in operations; financing is how the operations get funded. Everything else in this exercise depends on this split.' },\n          { t: 'fill', p: 'Step 2. Operations also generate their own credit — unpaid suppliers, wages and taxes owed. Operating assets were 1,765,089 (step 1) and operating liabilities are 238,478.', rows: [\n            { l: 'Net operating assets (NOA)', a: 1526611, w: '1,765,089 operating assets − 238,478 operating liabilities. What is left is the net amount capital providers actually have to fund.' }\n          ], e: 'In words: everything operations use, minus the free credit operations create by themselves.' },\n          { t: 'fill', p: 'Step 3. Build the same number from the other side of the balance sheet. Equity is 1,390,051 and the financial assets you totalled in step 1 were 121,366.', rows: [\n            { l: 'Total financial liabilities', a: 257926, w: 'The six interest-bearing lines, including the pension liability — a judgment call, but a defensible one.' },\n            { l: 'Invested capital', a: 1526611, w: '1,390,051 equity + 257,926 financial liabilities − 121,366 financial assets. Identical to NOA, because both count the same money.' }\n          ], e: 'NOA reads the resources off the left-hand side; invested capital reads the funding off the right-hand side. If they do not agree, something has been classified inconsistently.' }\n        ]\n      },\n      {\n        key: 'ex-nopat', title: 'From net income to NOPAT', sub: 'Strip financing out of profit', ses: 'Session 03 · Income Statement',\n        brief: 'A company reports: revenue 12,000; operating profit (EBIT) 1,800; interest expense 300; interest income 100; profit before tax 1,600; tax expense 320; net income 1,280. The statutory tax rate is 20%. Average invested capital is 9,000.',\n        steps: [\n          { t: 'fill', p: 'Step 1. The quick approach: tax the operating profit as if there were no debt.', rows: [\n            { l: 'NOPAT (EBIT × (1 − tax rate))', a: 1440, w: '1,800 × 0.8 = 1,440. EBIT is already before interest, so taxing it directly gives an after-tax, debt-free operating profit.' }\n          ], e: 'It is called quick and dirty because it assumes the operating profit was taxed at exactly the statutory rate.' },\n          { t: 'fill', p: 'Step 2. The same figure from the top down: start at net income of 1,280 and take out the financing. Interest income is 100, interest expense 300, tax rate 20%.', rows: [\n            { l: 'Net non-operating income before tax', a: -200, w: '100 of interest income − 300 of interest expense. Negative, because the company pays more interest than it earns.' },\n            { l: 'The same amount after tax', a: -160, w: '−200 × (1 − 20%). Interest is tax-deductible, so removing it must be done after tax.' },\n            { l: 'NOPAT', a: 1440, w: '1,280 net income − (−160) = 1,440. Adding back the after-tax cost of borrowing gets you to profit as if the company were all-equity funded.' }\n          ], e: 'Two routes, one number. That is the check that you have removed the financing consistently.' },\n          { t: 'fill', p: 'Step 3. Why bother — put NOPAT of 1,440 over the average invested capital of 9,000.', rows: [\n            { l: 'ROIC (%)', a: 16, tol: 0.2, w: '1,440 / 9,000 = 16%. NOPAT is the only earnings measure that is both after tax and financing-neutral, so it is the right numerator to sit above invested capital.' }\n          ], e: 'Two identical businesses with different debt report different net income but the same ROIC. That is the whole point.' }\n        ]\n      }\n    ],\n    fra: [\n      {\n        key: 'ex-journal', title: 'Bookkeeping: a month of journal entries', sub: 'Pick the accounts and the amounts yourself', ses: 'Chapters 2–3 · Accruals, Journal Entries & the Cycle',\n        brief: 'A juice startup, May. Record each transaction. Choose the side (Dr for debit, Cr for credit), the account, and the amount for every line. Remember: debits increase assets and expenses; credits increase liabilities, equity and revenue.',\n        accounts: ['Cash', 'Accounts receivable', 'Inventory', 'Prepaid insurance', 'Security deposit', 'Accounts payable', 'Notes payable', 'Unearned revenue', 'Common stock', 'Retained earnings', 'Sales revenue', 'Cost of goods sold', 'Wage expense', 'Rent expense', 'Advertising expense', 'Interest expense'],\n        steps: [\n          { t: 'entry', p: 'Investors contribute 10,000 cash for 500 shares.', rows: [{ s: 'Dr', a: 'Cash', v: 10000 }, { s: 'Cr', a: 'Common stock', v: 10000 }], e: 'Cash comes in, so debit it — debits increase assets. The owners now have a claim, and equity increases with a credit. A share issue is never revenue, because nothing was sold to a customer.' },\n          { t: 'entry', p: 'The company pays a 1,800 security deposit on its store lease.', rows: [{ s: 'Dr', a: 'Security deposit', v: 1800 }, { s: 'Cr', a: 'Cash', v: 1800 }], e: 'The deposit is refundable, so the company still controls a future benefit: that is an asset, debited. Cash falls, so it is credited. Nothing has been consumed, so no expense.' },\n          { t: 'entry', p: 'It buys 2,000 of inventory on account.', rows: [{ s: 'Dr', a: 'Inventory', v: 2000 }, { s: 'Cr', a: 'Accounts payable', v: 2000 }], e: 'Goods arrive: asset up, debit. The supplier is owed: liability up, credit. No cash moves, which is exactly why bookkeeping cannot be done from a bank statement.' },\n          { t: 'entry', p: 'It sells drinks costing 600 to cash customers for 2,400. Record all four lines.', rows: [{ s: 'Dr', a: 'Cash', v: 2400 }, { s: 'Cr', a: 'Sales revenue', v: 2400 }, { s: 'Dr', a: 'Cost of goods sold', v: 600 }, { s: 'Cr', a: 'Inventory', v: 600 }], e: 'Two separate facts, so two entries. Money in and revenue earned: debit cash, credit sales. Goods gone: debit the expense, credit inventory. Gross profit of 1,800 is the result of the two, never an entry of its own.' },\n          { t: 'entry', p: 'It sells drinks costing 700 for 2,900 on account.', rows: [{ s: 'Dr', a: 'Accounts receivable', v: 2900 }, { s: 'Cr', a: 'Sales revenue', v: 2900 }, { s: 'Dr', a: 'Cost of goods sold', v: 700 }, { s: 'Cr', a: 'Inventory', v: 700 }], e: 'Identical to the cash sale except for the debit: the customer\\u2019s promise to pay is the asset instead of cash. Revenue is recognised on delivery, not on collection.' },\n          { t: 'entry', p: 'It collects 1,200 from credit customers.', rows: [{ s: 'Dr', a: 'Cash', v: 1200 }, { s: 'Cr', a: 'Accounts receivable', v: 1200 }], e: 'One asset turns into another: cash up, the IOU down. No revenue — that was already recognised when the goods were delivered. Recording it again would double-count the sale.' },\n          { t: 'entry', p: 'It sells 300 of gift cards.', rows: [{ s: 'Dr', a: 'Cash', v: 300 }, { s: 'Cr', a: 'Unearned revenue', v: 300 }], e: 'Cash with a string attached. The company owes drinks, so the credit goes to a liability. Revenue waits until the cards are redeemed or expire.' },\n          { t: 'entry', p: 'It repays the 4,000 note together with 40 of interest.', rows: [{ s: 'Dr', a: 'Notes payable', v: 4000 }, { s: 'Dr', a: 'Interest expense', v: 40 }, { s: 'Cr', a: 'Cash', v: 4040 }], e: 'Three lines. Repaying principal removes a liability, so it is debited. The 40 is the price of having used the money, so it is an expense. Cash falls by the total, and debits still equal credits.' },\n          { t: 'entry', p: 'It pays 400 of dividends to shareholders.', rows: [{ s: 'Dr', a: 'Retained earnings', v: 400 }, { s: 'Cr', a: 'Cash', v: 400 }], e: 'A distribution of profit already earned, so it comes straight out of retained earnings. There is no such account as dividend expense, and profit is unaffected.' }\n        ]\n      },\n      {\n        key: 'ex-statements', title: 'From ledger balances to three statements', sub: 'Close the month and make it balance', ses: 'Chapters 2–3 · Accruals, Journal Entries & the Cycle',\n        brief: 'Same juice startup, after the May entries. Ledger balances: cash 6,460; accounts receivable 1,700; inventory 700; prepaid insurance 800; security deposit 1,800; accounts payable 500; unearned revenue 300; common stock 10,000. Income accounts: sales revenue 5,300; cost of goods sold 1,300; wage expense 1,300; rent expense 700; advertising expense 900; interest expense 40. Dividends paid 400. Retained earnings opened at zero.',\n        steps: [\n          { t: 'fill', p: 'Step 1. The income statement. Work down from sales.', rows: [\n            { l: 'Gross profit', a: 4000, w: '5,300 of sales − 1,300 of cost of goods sold. Gross profit is what is left to cover everything else.' },\n            { l: 'Total operating expenses', a: 2900, w: '1,300 wages + 700 rent + 900 advertising. Costs of running the shop, none of them tied to a specific drink.' },\n            { l: 'Operating income', a: 1100, w: '4,000 − 2,900. This is the figure that says how the business itself performed.' },\n            { l: 'Net income', a: 1060, w: '1,100 − 40 of interest. Interest sits below operating income because borrowing is a financing choice, not part of selling juice.' }\n          ], e: 'The order matters: gross profit, then operating income, then net income. Each line answers a different question about the same month.' },\n          { t: 'fill', p: 'Step 2. The statement of stockholders\\u2019 equity. Net income was 1,060 (step 1), dividends paid 400, common stock 10,000, opening retained earnings zero.', rows: [\n            { l: 'Contributed capital at 31 May', a: 10000, w: 'What the owners paid in. Unchanged during the month.' },\n            { l: 'Retained earnings at 31 May', a: 660, w: '0 opening + 1,060 net income − 400 dividends. Profit adds, distributions subtract.' },\n            { l: 'Total equity at 31 May', a: 10660, w: '10,000 + 660. Money put in, plus money earned and kept.' }\n          ], e: 'This statement is the bridge: net income leaves the income statement here and arrives on the balance sheet as retained earnings.' },\n          { t: 'fill', p: 'Step 3. The balance sheet — and the check that everything was recorded consistently. Total equity is 10,660 (step 2).', rows: [\n            { l: 'Total assets', a: 11460, w: '6,460 cash + 1,700 receivables + 700 inventory + 800 prepaid insurance + 1,800 deposit.' },\n            { l: 'Total liabilities', a: 800, w: '500 owed to suppliers + 300 of gift cards not yet redeemed.' },\n            { l: 'Total liabilities and equity', a: 11460, w: '800 + 10,660 = 11,460, equal to total assets. If this did not match, an entry somewhere was one-sided.' }\n          ], e: 'That equality is not a coincidence to be admired — it is the test. Every transaction was recorded twice, so the two sides must land on the same number.' }\n        ]\n      },\n      {\n        key: 'ex-depreciation', title: 'Build a depreciation schedule', sub: 'Three methods on one asset', ses: 'Chapter 6 · Long-Term Assets',\n        brief: 'A delivery truck costs 80,000. Estimated useful life five years, residual value 8,000. Under units of production it is expected to run 80,000 miles, and it runs 18,000 miles in year 1.',\n        steps: [\n          { t: 'fill', p: 'Step 1. Straight line — the same charge every year.', rows: [\n            { l: 'Depreciable base', a: 72000, w: '80,000 cost − 8,000 residual value. You only spread the part of the cost you expect to use up.' },\n            { l: 'Annual depreciation', a: 14400, w: '72,000 / 5 years. Equal slices, because the truck is assumed to deliver equal benefit each year.' },\n            { l: 'Book value at end of year 1', a: 65600, w: '80,000 − 14,400. Book value is always cost less depreciation charged so far, never a market price.' },\n            { l: 'Book value at end of year 4', a: 22400, w: '80,000 − (4 × 14,400).' }\n          ], e: 'Note what is never touched: the 80,000 cost stays on the books, with accumulated depreciation growing beside it as a contra asset.' },\n          { t: 'fill', p: 'Step 2. Double-declining balance — an accelerated method.', rows: [\n            { l: 'Rate (%)', a: 40, tol: 0.2, w: 'Twice the straight-line rate. Straight line is 1/5 = 20% a year, so the accelerated rate is 40%.' },\n            { l: 'Year 1 depreciation', a: 32000, w: '80,000 × 40%. Applied to full book value — residual value is ignored in the calculation and only acts as a floor.' },\n            { l: 'Year 2 depreciation', a: 19200, w: 'Opening book value is now 48,000, and 48,000 × 40% = 19,200. The charge shrinks because the base shrinks.' },\n            { l: 'Year 3 depreciation', a: 11520, w: '28,800 × 40%. By year 5 the rate would push book value below 8,000, so the final year is plugged to land exactly on the residual value.' }\n          ], e: 'Total depreciation over the life is still 72,000. Accelerated methods only move expense earlier, which lowers early profit and lifts later profit.' },\n          { t: 'fill', p: 'Step 3. Units of production — charge by use instead of by time.', rows: [\n            { l: 'Rate per mile', a: 0.9, tol: 0.02, w: '72,000 depreciable base / 80,000 expected miles.' },\n            { l: 'Year 1 depreciation', a: 16200, w: '18,000 miles actually driven × 0.90. A quiet year would produce a smaller charge, which is the appeal of this method.' }\n          ], e: 'Three methods, three very different year 1 figures — 14,400, 32,000 and 16,200 — for one identical truck.' },\n          { t: 'fill', p: 'Step 4. Estimates change, and assets get sold. After four years, accumulated depreciation is 57,600 and book value is 22,400.', rows: [\n            { l: 'Revised year 5 depreciation after the life is extended to seven years', a: 4800, w: 'Book value is 22,400 and the remaining life is 5 − 4 + 2 = 3 years, so (22,400 − 8,000) / 3 = 4,800. Changes are prospective: the four years already reported are never restated.' },\n            { l: 'Gain if it is instead sold for 25,000 at the end of year 4', a: 2600, w: '25,000 proceeds − 22,400 book value. A gain, because the truck was worth more than the books said — not because the business created value.' }\n          ], e: 'Gains and losses on disposal are a verdict on the original estimates, which is why analysts treat them as non-recurring.' }\n        ]\n      },\n      {\n        key: 'ex-inventory', title: 'Inventory: three cost flow assumptions', sub: 'Same purchases, three answers', ses: 'Chapter 5 · Inventory & Cost of Goods Sold',\n        brief: 'Opening inventory 100 units at 4.00 each. One purchase of 100 units at 4.80 each. During the period 160 units are sold for 9.00 each, leaving 40 units on hand.',\n        steps: [\n          { t: 'fill', p: 'Step 1. Work out the pool of cost that has to be divided up.', rows: [\n            { l: 'Cost of opening inventory', a: 400, w: '100 units × 4.00.' },\n            { l: 'Cost of purchases', a: 480, w: '100 units × 4.80.' },\n            { l: 'Total cost available for sale', a: 880, w: '400 + 480. Every method splits this same 880 between cost of goods sold and closing inventory — nothing else.' }\n          ], e: 'This is why profit and inventory always move in opposite directions: whatever one takes from the 880, the other gives up.' },\n          { t: 'fill', p: 'Step 2. FIFO and LIFO.', rows: [\n            { l: 'FIFO: cost of goods sold', a: 688, w: 'Oldest first: all 100 old units at 4.00 = 400, then 60 new units at 4.80 = 288.' },\n            { l: 'FIFO: ending inventory', a: 192, w: 'The 40 units left are the newest: 40 × 4.80. Or simply 880 − 688.' },\n            { l: 'LIFO: cost of goods sold', a: 720, w: 'Newest first: 100 units at 4.80 = 480, then 60 old units at 4.00 = 240.' },\n            { l: 'LIFO: ending inventory', a: 160, w: 'The 40 left are the oldest: 40 × 4.00. LIFO is not permitted under IFRS.' }\n          ], e: 'No unit physically moved differently. The only difference is which cost each method assumes went out of the door.' },\n          { t: 'fill', p: 'Step 3. Weighted average, and the effect on profit. Total cost available was 880 for 200 units; revenue is 160 units × 9.00 = 1,440; FIFO cost of goods sold was 688 and LIFO 720.', rows: [\n            { l: 'Average cost per unit', a: 4.4, tol: 0.02, w: '880 total cost / 200 total units. Every unit is treated as identical.' },\n            { l: 'Average: cost of goods sold', a: 704, w: '160 units × 4.40. Closing inventory is 176 — always between the FIFO and LIFO answers.' },\n            { l: 'FIFO gross profit', a: 752, w: 'Revenue is 160 × 9.00 = 1,440, less 688 of cost.' },\n            { l: 'LIFO gross profit', a: 720, w: '1,440 − 720. With costs rising, FIFO reports more profit and more inventory; LIFO reports less of both.' }\n          ], e: 'Same shop, same sales, same cash. A 32 difference in reported profit created entirely by a choice of assumption.' },\n          { t: 'fill', p: 'Step 4. The 40 remaining units can now only be sold for 3.50 each, net of selling costs. FIFO carried them at 192.', rows: [\n            { l: 'Net realisable value of the stock on hand', a: 140, w: '40 units × 3.50 — what you could actually get, after the costs of getting it.' },\n            { l: 'Write-down required under FIFO', a: 52, w: 'FIFO carried the stock at 192 against an NRV of 140. Inventory is held at the lower of cost and NRV, so 52 is written off.' }\n          ], e: 'The loss is taken now, not when the goods finally sell. Note that a LIFO shop carrying the same stock at 160 would write off only 20 — the earlier choice changes the later loss.' }\n        ]\n      },\n      {\n        key: 'ex-receivables', title: 'Receivables and the allowance', sub: 'Estimate, report, write off', ses: 'Chapter 4 · Revenues, Receivables & Operating Income',\n        brief: 'At the start of the year gross receivables are 10,000 with an allowance for uncollectible accounts of 600. Credit sales for the year are 48,000; cash collected from customers is 44,500. During the year one customer balance of 500 was written off. The company estimates that 3% of closing gross receivables will never be collected.',\n        steps: [\n          { t: 'fill', p: 'Step 1. Roll the gross receivables balance forward.', rows: [\n            { l: 'Closing gross receivables', a: 13000, w: '10,000 opening + 48,000 credit sales − 44,500 collected − 500 written off. Sales add to the balance, collections and write-offs remove from it.' }\n          ], e: 'The write-off removes the gross balance and the allowance together, so it never touches profit — the cost was recognised when the allowance was first estimated.' },\n          { t: 'fill', p: 'Step 2. Work out the allowance, then the expense that gets you there. Closing gross receivables were 13,000 (step 1); the opening allowance was 600 and 500 of it was used on the write-off.', rows: [\n            { l: 'Required closing allowance', a: 390, w: '3% × 13,000. This is the company\\u2019s estimate of what will never arrive.' },\n            { l: 'Allowance before adjustment', a: 100, w: '600 opening − 500 used up on the write-off.' },\n            { l: 'Bad debt expense for the year', a: 290, w: '390 required − 100 already there. You charge only the top-up, because the rest was charged in earlier years.' }\n          ], e: 'Bad debt expense is the plug that brings the allowance to where management thinks it should be. Which is exactly why it is a soft number.' },\n          { t: 'fill', p: 'Step 3. What the balance sheet shows, and how fast customers pay. Gross receivables 13,000, allowance 390, credit sales 48,000.', rows: [\n            { l: 'Net accounts receivable', a: 12610, w: '13,000 gross − 390 allowance. Receivables are always reported at this net realisable value.' },\n            { l: 'Receivables turnover (times)', a: 3.8, tol: 0.1, w: '48,000 credit sales / 12,610 net receivables — how many times the balance was collected over the year.' },\n            { l: 'Days sales outstanding', a: 96, tol: 2, w: '365 / 3.8. Over three months to collect, which ties up a great deal of cash.' }\n          ], e: 'Read the two together: slow collection alongside a shrinking allowance percentage is one of the more reliable warning signs in a set of accounts.' }\n        ]\n      },\n      {\n        key: 'ex-cashflow', title: 'Build a cash flow statement', sub: 'Indirect method, start to finish', ses: 'Chapter 11 · Statement of Cash Flows',\n        brief: 'Net income 500. Depreciation 120. Gain on sale of equipment 30. Changes in working capital: receivables up 60, inventory down 30, payables up 40. Equipment with a book value of 90 was sold for 120. New equipment was bought for 260. Long-term debt of 100 was issued and dividends of 80 were paid. Opening cash 210.',\n        steps: [\n          { t: 'fill', p: 'Step 1. Cash from operating activities, starting at net income.', rows: [\n            { l: 'Add back depreciation', a: 120, w: 'It reduced profit but no cash left this period — the cash went when the asset was bought.' },\n            { l: 'Adjustment for the gain on sale (minus sign)', a: -30, w: 'Deducted, because the full 120 of proceeds is reported under investing. Leaving the gain here would count part of it twice.' },\n            { l: 'Net working capital effect', a: 10, w: '−60 receivables + 30 inventory + 40 payables. An asset going up consumes cash; a liability going up provides it.' },\n            { l: 'Cash from operations', a: 600, w: '500 + 120 − 30 + 10.' }\n          ], e: 'Every adjustment answers one question: did this item change profit without changing cash, or change cash without changing profit?' },\n          { t: 'fill', p: 'Step 2. Investing and financing.', rows: [\n            { l: 'Proceeds from selling equipment', a: 120, w: 'The whole amount received, not the 30 gain and not the 90 book value.' },\n            { l: 'Cash used in investing (minus sign)', a: -140, w: '120 in − 260 out. Negative investing cash in a growing company is normal: it is spending on its future.' },\n            { l: 'Cash from financing', a: 20, w: '100 of debt raised − 80 of dividends paid. Both are dealings with the providers of capital.' }\n          ], e: 'The classification is the information. The same total cash can come from trading, from selling the furniture, or from borrowing.' },\n          { t: 'fill', p: 'Step 3. Tie the statement back to the balance sheet. Operating cash was 600, investing used 140, financing provided 20, and opening cash was 210.', rows: [\n            { l: 'Net change in cash', a: 480, w: '600 operating − 140 investing + 20 financing.' },\n            { l: 'Closing cash', a: 690, w: '210 opening + 480. This must equal the cash line on the closing balance sheet — the statement\\u2019s own proof.' }\n          ], e: 'If it does not tie, something has been classified in two places or missed entirely.' }\n        ]\n      },\n      {\n        key: 'ex-ratios', title: 'Ratio analysis, disaggregated', sub: 'Take ROE apart', ses: 'Chapter 12 · Ratio Analysis',\n        brief: 'Sales 10,000; cost of goods sold 6,000; net income 500. Average total assets 5,000; average shareholders\\u2019 equity 2,500; average inventory 1,000; average receivables 1,250.',\n        steps: [\n          { t: 'fill', p: 'Step 1. The headline returns.', rows: [\n            { l: 'ROE (%)', a: 20, tol: 0.2, w: '500 / 2,500. What the owners earned on what they have invested — leverage included.' },\n            { l: 'ROA (%)', a: 10, tol: 0.2, w: '500 / 5,000. The return on everything the business uses, regardless of who funded it.' },\n            { l: 'Return on financial leverage (percentage points)', a: 10, tol: 0.2, w: '20 − 10. The part of the owners\\u2019 return that came from using other people\\u2019s money.' }\n          ], e: 'Half of this company\\u2019s ROE comes from borrowing. That is not free: it works in reverse just as efficiently when returns fall below the cost of debt.' },\n          { t: 'fill', p: 'Step 2. Break ROA into the two things management can actually pull. Sales 10,000, cost of goods sold 6,000, net income 500, average assets 5,000.', rows: [\n            { l: 'Profit margin (%)', a: 5, tol: 0.1, w: '500 / 10,000. Profit kept out of every unit of sales.' },\n            { l: 'Asset turnover (times)', a: 2, tol: 0.05, w: '10,000 / 5,000. Sales generated by every unit of assets.' },\n            { l: 'Gross profit margin (%)', a: 40, tol: 0.5, w: '(10,000 − 6,000) / 10,000. The pricing-and-product-cost story, before any operating costs.' }\n          ], e: '5% × 2.0 = 10% = ROA. That identity is why a luxury brand and a supermarket can earn the same return by opposite routes.' },\n          { t: 'fill', p: 'Step 3. The turnover ratios sitting underneath asset turnover. Cost of goods sold 6,000, average inventory 1,000, sales 10,000, average receivables 1,250.', rows: [\n            { l: 'Inventory turnover (times)', a: 6, tol: 0.1, w: '6,000 cost of goods sold / 1,000 average inventory. Cost against cost — never sales against inventory.' },\n            { l: 'Days inventory held', a: 61, tol: 2, w: '365 / 6. Roughly two months of stock on the shelf.' },\n            { l: 'Receivables turnover (times)', a: 8, tol: 0.1, w: '10,000 sales / 1,250 average receivables. Sales against receivables, because both are at selling prices.' },\n            { l: 'Days sales outstanding', a: 46, tol: 2, w: '365 / 8.' }\n          ], e: 'Add the two day counts and you have roughly how long cash is tied up between paying for stock and being paid for it — the working capital cycle.' }\n        ]\n      }\n    ]\n  };\n\n  terms = {\n    'period cost': 'A cost that cannot be tied to a particular sale, so it hits the period it occurs in — advertising, R&D, admin.',\n    'product cost': 'A cost that attaches to a unit of inventory and becomes an expense only when that unit sells.',\n    'matching': 'Recognise an expense in the same period as the revenue it helped produce.',\n    'matching principle': 'Recognise an expense in the same period as the revenue it helped produce.',\n    'R&D': 'Research and development. Research is always expensed; under IFRS development costs may be capitalised once technical feasibility is established.',\n    'capitalise': 'Record a cost as an asset instead of charging it against this period\\u2019s profit.',\n    'capitalised': 'Recorded as an asset rather than charged against this period\\u2019s profit.',\n    'expense': 'A cost that has been used up in earning this period\\u2019s revenue.',\n    'expensed': 'Charged against this period\\u2019s profit in full.',\n    'asset': 'A resource the company controls, from a past event, with probable and measurable future benefit.',\n    'liability': 'A probable, measurable obligation from a past event.',\n    'equity': 'The owners\\u2019 residual claim: assets minus liabilities.',\n    'accounting equation': 'Assets = liabilities + equity. It cannot fail to balance.',\n    'double-entry': 'Every transaction is recorded twice, debit and credit, for equal amounts.',\n    'trial balance': 'A list of every account balance, used to check that debits equal credits.',\n    'closing': 'Resetting revenue, expense and dividend accounts to zero into retained earnings at period end.',\n    'adjusting entry': 'A period-end entry for something that happened without any cash moving.',\n    'T-account': 'An account drawn as a T: debits on the left, credits on the right.',\n    'provision': 'An estimated obligation recognised when payment is probable and the amount can be estimated.',\n    'contingent liability': 'A possible obligation, or one that cannot be measured. Disclosed in the notes, not recognised.',\n    'executory': 'A contract where neither side has performed yet, so no liability exists.',\n    'accrued liability': 'A cost incurred but not yet paid, such as unpaid wages or interest.',\n    'prepaid expense': 'Something paid for in advance. An asset until it is used up.',\n    'deferred revenue': 'Cash received before delivery. A liability until the goods or services are provided.',\n    'warranty': 'A promise to repair or replace. The estimated cost is expensed in the period of sale.',\n    'cash discount': 'A reduction for paying early, quoted like 2/10, n/30.',\n    '2/10, n/30': '2% off if paid within 10 days, otherwise the full amount within 30.',\n    'note payable': 'A written promise to repay borrowed money, usually with interest.',\n    'principal': 'The amount borrowed, separate from the interest paid for using it.',\n    'interest': 'The cost of using borrowed money. It accrues with time, whether or not it is paid.',\n    'EBITDA': 'Earnings before interest, taxes, depreciation and amortisation. Not defined by IFRS, and it ignores real costs.',\n    'operating profit': 'Profit from the core business, before interest and taxes. Same as EBIT.',\n    'historical cost': 'What the company originally paid. Reliable, often far below current value.',\n    'fair value': 'What the asset could be sold for today in an arm\\u2019s-length transaction.',\n    'conservatism': 'Losses are recognised faster than gains — assets are written down but not up.',\n    'liquidity': 'The ability to meet obligations falling due soon.',\n    'solvency': 'The ability to keep trading long term and avoid financial distress.',\n    'leverage': 'Using borrowed money. It magnifies returns to owners in both directions.',\n    'debt-to-equity': 'Total liabilities ÷ total equity. A measure of credit risk.',\n    'articulation': 'The way the four statements explain each other — net income into retained earnings, cash flows into the cash balance.',\n    'fiscal year': 'A company\\u2019s own twelve-month reporting period. It need not end in December.',\n    'IFRS': 'International Financial Reporting Standards, used in the EU, most of the G20, India and Australia.',\n    'US GAAP': 'The US rulebook. Built on the same accrual principles as IFRS, with technical differences.',\n    'audit': 'An outside examination giving an opinion on whether the statements are fairly presented.',\n    'disclosure': 'Providing financial information to outsiders — in the statements or the notes.',\n    'current': 'Due, or expected to be used up, within one year.',\n    'noncurrent': 'Longer than one year.',\n    'par value': 'An arbitrary legal amount printed on a share, with no economic meaning.',\n    'treasury stock': 'Shares the company has bought back from investors. A deduction from equity.',\n    'stock split': 'More shares, each worth proportionally less. Total equity unchanged.',\n    'associate': 'A company you influence but do not control, roughly 20–50%. Equity method.',\n    'subsidiary': 'A company you control, usually over 50%. Consolidated.',\n    'equity method': 'Carry the stake at cost plus your share of the investee\\u2019s profit, less dividends received.',\n    'consolidation': 'Report 100% of a subsidiary\\u2019s figures, showing the part you do not own as non-controlling interest.',\n    'non-controlling interest': 'The share of a consolidated subsidiary that the parent does not own.',\n    'goodwill': 'The excess of a purchase price over the fair value of the identifiable net assets bought.',\n    'intangible asset': 'An asset with no physical substance — patents, trademarks, software, goodwill.',\n    'revenue recognition': 'Deciding when a sale counts as revenue: contract, obligations, price, allocation, delivery.',\n    'performance obligation': 'A distinct promise to the customer. Revenue is recognised as each one is satisfied.',\n    'percentage-of-completion': 'Recognise revenue on a long contract as work is done: costs incurred ÷ total estimated costs.',\n    'operating cycle': 'The time from paying for inventory to collecting cash from selling it.',\n    'accrual basis': 'Revenue when earned, expenses when incurred and matched to it — whatever the cash does.',\n    'cash basis': 'Record revenue when cash arrives and expenses when cash leaves.',\n    'accrual': 'The rule that records an event when it happens, not when the money moves.',\n    'net income': 'Revenue − expenses for the period. Profit.',\n    'revenue': 'Sales the company has actually earned by delivering something.',\n    'cost of goods sold': 'What the goods you sold cost you. COGS = opening inventory + purchases − closing inventory.',\n    'depreciation': 'Spreading the cost of a long-lived asset across the periods that use it.',\n    'depreciable base': 'Cost − residual value. The amount spread over the useful life.',\n    'residual value': 'What the asset is expected to be worth at the end of its useful life. Also called salvage value.',\n    'useful life': 'How long the company expects to get economic benefit from the asset.',\n    'book value': 'Cost − accumulated depreciation.',\n    'straight line': '(Cost − residual value) ÷ useful life, charged equally every year.',\n    'double-declining balance': '2 × straight-line rate × opening book value. Residual value acts only as a floor.',\n    'units of production': '(Cost − residual) ÷ total expected units, × units used this period.',\n    'impairment': 'Book value − recoverable amount, written off when an asset is worth much less than its books say.',\n    'inventory': 'Goods bought or made and not yet sold.',\n    'FIFO': 'First in, first out: assume the oldest units were sold first.',\n    'LIFO': 'Last in, first out: assume the newest units were sold first. Not permitted under IFRS.',\n    'weighted average': 'Total cost available ÷ total units available, applied to every unit.',\n    'net realisable value': 'NRV = expected selling price − costs to sell.',\n    'write-down': 'Cutting the recorded value of an asset, with the loss taken now.',\n    'gross profit': 'Sales − cost of goods sold.',\n    'receivables': 'Money customers owe you for goods or services already delivered.',\n    'allowance for uncollectible accounts': 'Your estimate of the receivables that will never be collected. It is deducted from the gross amount.',\n    'bad debt expense': 'The top-up: required closing allowance − allowance already in place.',\n    'write-off': 'Removing a specific customer balance and the matching allowance. It does not touch profit.',\n    'days sales outstanding': 'DSO = 365 ÷ receivables turnover. How many days customers take to pay.',\n    'receivables turnover': 'Sales ÷ average receivables. How many times a year the balance is collected.',\n    'inventory turnover': 'COGS ÷ average inventory. Days held = 365 ÷ turnover.',\n    'operating liabilities': 'Amounts owed that arise from running the business, such as payables, wages and taxes owed.',\n    'operating assets': 'Assets used in the core business, as opposed to money-related holdings.',\n    'financial assets': 'Money-related holdings — deposits, bonds, derivatives — rather than assets used in operations.',\n    'financial liabilities': 'Interest-bearing obligations: loans, bonds, leases.',\n    'net operating assets': 'NOA = operating assets − operating liabilities. The net resources tied up in operations.',\n    'invested capital': 'IC = equity + financial liabilities − financial assets. Equals NOA, seen from the funding side.',\n    'NOPAT': 'After-tax profit from operations, as if the company had no debt. NOPAT = EBIT × (1 − tax rate), or net income − after-tax non-operating income.',\n    'EBIT': 'Operating profit: revenue less operating costs, before interest and taxes.',\n    'ROIC': 'Return on invested capital = NOPAT ÷ average invested capital.',\n    'retained earnings': 'Opening retained earnings + net income − dividends. Profit kept in the business.',\n    'contributed capital': 'Money shareholders paid into the company for its shares.',\n    'dividends': 'Cash paid out to owners. A distribution of profit, never an expense.',\n    'unearned revenue': 'Cash received for something not yet delivered. A liability until it is.',\n    'accounts payable': 'Money owed to suppliers for goods and services bought on credit.',\n    'prepaid insurance': 'Insurance paid for in advance — an asset until the coverage is used up.',\n    'security deposit': 'A refundable amount lodged with a landlord. An asset, not rent.',\n    'debit': 'An entry in the left column. It increases assets and expenses.',\n    'credit': 'An entry in the right column. It increases liabilities, equity and revenue.',\n    'journal entry': 'The record of one transaction, with equal debits and credits.',\n    'ledger': 'The set of accounts, where journal entries are collected by account.',\n    'working capital': 'Receivables + inventory − payables. An increase consumes cash.',\n    'indirect method': 'Net income + depreciation and other non-cash charges − asset increases + liability increases.',\n    'cash from operations': 'Net income + non-cash charges ± working capital changes.',\n    'gain on sale': 'Proceeds − book value. A loss if negative.',\n    'profit margin': 'Net income ÷ sales. Profit kept out of each unit of revenue.',\n    'asset turnover': 'Sales ÷ average total assets. Revenue generated per unit of assets.',\n    'ROE': 'Return on equity = net income ÷ average shareholders\\u2019 equity.',\n    'ROA': 'Return on assets = net income ÷ average total assets = profit margin × asset turnover.',\n    'return on financial leverage': 'ROFL = ROE − ROA. The part of the owners\\u2019 return that came from borrowing.',\n    'gross profit margin': '(Sales − cost of goods sold) ÷ sales.'\n  };\n\n  segment(text) {\n    const base = Object.keys(this.terms);\n    const keys = [];\n    base.forEach(k => {\n      keys.push(k);\n      if (!/s$|IFO$|AT$|BIT$|OE$|OA$|OIC$/.test(k)) keys.push(k + 's');\n      if (/y$/.test(k)) keys.push(k.slice(0, -1) + 'ies');\n    });\n    keys.sort((a, b) => b.length - a.length);\n    const out = [];\n    let rest = text || '';\n    let guard = 0;\n    while (rest.length && guard++ < 400) {\n      let bestAt = -1, bestKey = null;\n      keys.forEach(k => {\n        const at = rest.toLowerCase().indexOf(k.toLowerCase());\n        if (at < 0) return;\n        const before = at === 0 ? ' ' : rest.charAt(at - 1);\n        const after = at + k.length >= rest.length ? ' ' : rest.charAt(at + k.length);\n        if (/[a-zA-Z]/.test(before) || /[a-zA-Z]/.test(after)) return;\n        if (bestAt < 0 || at < bestAt || (at === bestAt && k.length > bestKey.length)) { bestAt = at; bestKey = k; }\n      });\n      if (bestAt < 0) { out.push({ t: rest, def: '' }); break; }\n      if (bestAt > 0) out.push({ t: rest.slice(0, bestAt), def: '' });\n      const def = this.terms[bestKey] || this.terms[bestKey.replace(/ies$/, 'y').replace(/s$/, '')] || '';\n      out.push({ t: rest.substr(bestAt, bestKey.length), def: def });\n      rest = rest.slice(bestAt + bestKey.length);\n    }\n    return out;\n  }\n\n  hintList(text) {\n    const seen = {};\n    const out = [];\n    this.segment(text || '').forEach(s => {\n      if (!s.def) return;\n      const key = s.t.toLowerCase();\n      if (seen[key]) return;\n      seen[key] = true;\n      out
