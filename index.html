u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Fair value sounds objective, but it ranges from a real market price to a number out of a management model. The notes tell you which.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Buying other companies' securities<\u002Fh2>\n            <p>Firms hold financial investments to park surplus cash, to earn a return, or to build a strategic position. Debt investments — government and corporate bonds — are recorded at acquisition, accrue interest income, and are remeasured or held at amortised cost depending on classification.<\u002Fp>\n            <p>For share investments, the accounting follows one question: how much influence does the investor have?<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Level<\u002Fsc-raw-th><sc-raw-th>Typical holding<\u002Fsc-raw-th><sc-raw-th>Treatment<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Passive<\u002Fsc-raw-td><sc-raw-td>Under 20%<\u002Fsc-raw-td><sc-raw-td>Fair value, changes through profit or loss (or OCI where elected)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Significant influence — an associate<\u002Fsc-raw-td><sc-raw-td>Roughly 20–50%<\u002Fsc-raw-td><sc-raw-td>Equity method<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Control — a subsidiary<\u002Fsc-raw-td><sc-raw-td>Over 50%, or ability to elect the board majority<\u002Fsc-raw-td><sc-raw-td>Consolidation, with non-controlling interest<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">The percentages are indicators, not the test. Contractual rights, board seats and shareholder structure can give control below 50% or deny it above 20%.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">The equity method in one calculation<\u002Fh2>\n            <p>An associate carried at 1,000, a 30% holding. The associate earns 200 and pays 50 of dividends. Carrying amount becomes 1,000 + 60 − 15 = 1,045, and 60 flows into the investor's income. Dividends reduce the carrying amount rather than creating income, because they return value already recognised.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Consolidation changes how a group looks<\u002Fh2>\n            <p>Consolidation brings in 100% of a subsidiary's revenues, costs, assets and liabilities, then shows the share not owned as non-controlling interest within equity. An equity-method stake in the same business would appear as a single line on each statement. Identical economics, very different revenue, margins and asset base — worth remembering before comparing two groups with different structures.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Fair value, and where judgment enters<\u002Fh2>\n            <p>Fair value is what an independent buyer would pay. The hierarchy grades the evidence: Level 1 is a quoted price in an active market for an identical asset; Level 2 uses observable inputs for similar assets; Level 3 uses unobservable model inputs. Level 3 values are management's estimates, described as prices.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">Earnings management<\u002Fdiv><div class=\"card-body\">Whether fair value changes run through profit or through OCI is largely fixed at purchase, and that makes the classification decision itself consequential. Combined with discretion over when to realise gains, it gives management a quiet lever on reported income.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF9 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">Profit is partly a matter of judgment; cash is a fact you can check with a bank. This statement takes the year's bank movements and sorts them into three piles: money from running the business, money spent on or raised from long-term things, and money from lenders and owners.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Operating<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cash from actually running the business.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Investing<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cash spent on or received from long-term assets.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Financing<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cash from lenders and owners, and back to them.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Cash equivalents<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Places cash is parked that are as good as cash.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Indirect method<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Starting from profit and undoing the non-cash bits to get to cash.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Add back<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Removing a cost that reduced profit without any cash leaving.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>Profit is partly an opinion. Cash is a fact you can check against a bank statement. This report exists because the two are different, and companies run out of cash, not profit.<\u002Fp>\n            <p>Sell 100 of goods on credit and you have 100 of profit and zero cash. That gap is the whole reason for the third statement.<\u002Fp>\n            <p>It sorts every movement of money into three piles:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Pile<\u002Fsc-raw-th><sc-raw-th>What is in it<\u002Fsc-raw-th><sc-raw-th>Good sign?<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Operating<\u002Fsc-raw-td><sc-raw-td>Money from actually running the business<\u002Fsc-raw-td><sc-raw-td>This is the one you want to be big and steady<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Investing<\u002Fsc-raw-td><sc-raw-td>Buying and selling long-term things<\u002Fsc-raw-td><sc-raw-td>Usually negative in a growing company — it is spending on its future<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Financing<\u002Fsc-raw-td><sc-raw-td>Borrowing, repaying, share issues, dividends<\u002Fsc-raw-td><sc-raw-td>Tells you who is funding the gap<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>The usual way to build the operating pile starts from profit and undoes anything that was not cash:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Step<\u002Fsc-raw-th><sc-raw-th>Amount<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Profit<\u002Fsc-raw-td><sc-raw-td>500<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Add back depreciation — a cost with no cash leaving<\u002Fsc-raw-td><sc-raw-td>120<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Customers owe more than before — cash not collected<\u002Fsc-raw-td><sc-raw-td>(60)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Inventory fell — sold without restocking<\u002Fsc-raw-td><sc-raw-td>30<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>You owe suppliers more than before — not yet paid<\u002Fsc-raw-td><sc-raw-td>40<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Cash from operations<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>630<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Three companies can each show the same total cash. One earned it, one sold its factories, one borrowed it. The three piles are how you tell them apart.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Why a third statement<\u002Fh2>\n            <p>Accrual profit and cash generation differ, sometimes for years. Cash pays wages, interest and dividends, so users need to see it directly: liquidity, meaning the ability to meet near-term obligations, and solvency, the ability to survive long term.<\u002Fp>\n            <p>Cash equivalents — short-term, highly liquid investments readily convertible to a known amount of cash with little risk of change in value — are added to cash and treated as one figure, because moving money between a current account and a treasury bill is not an economic event.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Three sections<\u002Fh2>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Section<\u002Fsc-raw-th><sc-raw-th>Contains<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Operating<\u002Fsc-raw-td><sc-raw-td>Cash from selling goods and services; payments to suppliers and employees; interest and taxes paid<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Investing<\u002Fsc-raw-td><sc-raw-td>Buying and selling PPE, intangibles and investments<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Financing<\u002Fsc-raw-td><sc-raw-td>Issuing and repaying debt, issuing and repurchasing shares, dividends paid<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Three competitors can each generate 100,000 of cash: one from operations, one from selling its factories, one from new borrowing. The total is identical and the situations are not remotely comparable. That is the whole argument for the classification.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">The indirect method<\u002Fh2>\n            <p>Start from net income and undo the accruals. Direct and indirect methods differ only in the presentation of the operating section, and report the same total.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Step<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Amount<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Net income<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">500<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Add back depreciation (no cash left this period)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">120<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Receivables increased — cash not yet collected<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(60)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Inventory fell — sold without replacing<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">30<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Payables increased — not yet paid<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">40<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Cash from operations<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>630<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">The rule underneath: an increase in an operating asset consumes cash, an increase in an operating liability provides it. Gains on asset sales are deducted here, because the full proceeds belong in investing and would otherwise be counted twice.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Non-cash activities<\u002Fh2>\n            <p>Acquiring a building by issuing shares changes the firm's assets and financing without any cash movement, so it appears nowhere in the body of the statement — and is disclosed separately, because ignoring it would hide something material.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF10 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">You cannot compare a corner shop with a supermarket using raw numbers — one is a thousand times bigger. Turn everything into percentages and ratios and they become comparable. This chapter is the small set of ratios that does most of the work, and how to break them apart to see what drives them.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Ratio<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>One number divided by another to make sizes comparable.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Common-size<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Every line shown as a percentage of sales, or of total assets.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>ROE<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Profit divided by what the owners have invested.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>ROA<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Profit divided by all the assets used.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Profit margin<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Profit per unit of sales.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Asset turnover<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Sales generated per unit of assets.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Leverage<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Using borrowed money, which magnifies both gains and losses.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Days outstanding<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>How many days customers take to pay.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>You cannot compare a corner shop with a supermarket using raw numbers. Turn the numbers into ratios and you can. Start with just three.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Ratio<\u002Fsc-raw-th><sc-raw-th>How to get it<\u002Fsc-raw-th><sc-raw-th>What it tells you<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Return on equity (ROE)<\u002Fsc-raw-td><sc-raw-td>Profit ÷ owners’ money<\u002Fsc-raw-td><sc-raw-td>What the owners earned on what they put in<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Return on assets (ROA)<\u002Fsc-raw-td><sc-raw-td>Profit ÷ all assets used<\u002Fsc-raw-td><sc-raw-td>How well the business uses what it has, ignoring who paid for it<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Debt-to-equity<\u002Fsc-raw-td><sc-raw-td>What you owe ÷ owners’ money<\u002Fsc-raw-td><sc-raw-td>How much of the business is borrowed<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>A worked set: profit 500, owners’ money 2,500, assets 5,000. ROE is 20%, ROA is 10%. The gap between them — 10 points — comes from borrowing. Debt lifts the owners’ return when things go well and deepens the hole when they do not.<\u002Fp>\n            <p>Then one idea that explains most of what you will see. ROA breaks into two pieces you can multiply:<\u002Fp>\n            <p><strong>profit per sale × sales per unit of assets = return on assets<\u002Fstrong><\u002Fp>\n            <p>On sales of 10,000: profit margin is 5% and asset turnover is 2.0, and 5% × 2.0 = 10%. This is why a luxury brand and a supermarket can earn the same return by opposite routes — thick margins and slow turnover, or thin margins and fast turnover. Very few businesses get both.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Ratios show symptoms, not causes. Two companies using different inventory or lease methods are not really comparable until you adjust for it.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Two ways to normalise<\u002Fh2>\n            <p>Raw figures cannot be compared across firms of different sizes or across years of different scale. Vertical, or common-size, analysis restates income statement items as a percentage of net sales and balance sheet items as a percentage of total assets. Horizontal analysis examines change across time. Neither requires a single ratio; both make patterns visible.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Start at the top: ROE<\u002Fh2>\n            <p>Return on equity is net income over average shareholders' equity — the return to the owners, leverage included. Net income of 500 on average equity of 2,500 is 20%.<\u002Fp>\n            <p>Return on assets is net income over average total assets: the return on every unit invested, regardless of funding. 500 over 5,000 is 10%.<\u002Fp>\n            <p>The difference between the two is the contribution of leverage, sometimes called return on financial leverage: 20% − 10% = 10 points. Debt raised at a cost below ROA lifts shareholder returns and magnifies losses with equal efficiency.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Break ROA into its two levers<\u002Fh2>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-body\" style=\"font-family:var(--font-heading); font-size:16px\">ROA = Profit margin × Asset turnover = (Net income / Sales) × (Sales / Average assets)<\u002Fdiv><\u002Fdiv>\n            <p>On sales of 10,000: profit margin is 5%, asset turnover is 2.0, and 5% × 2.0 = 10% ROA. That identity explains why a luxury brand and a grocery chain can earn the same ROA by opposite routes — high margin and low turnover against thin margin and high turnover. Strategy usually decides which lever a firm pulls, and pulling both at once is rare.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Go one level deeper<\u002Fh2>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Ratio<\u002Fsc-raw-th><sc-raw-th>Calculation<\u002Fsc-raw-th><sc-raw-th>What it exposes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Gross profit margin<\u002Fsc-raw-td><sc-raw-td>(Sales − COGS) / Sales<\u002Fsc-raw-td><sc-raw-td>Pricing power and product cost<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Expense-to-sales<\u002Fsc-raw-td><sc-raw-td>Operating expense / Sales<\u002Fsc-raw-td><sc-raw-td>Where each unit of revenue goes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Receivables turnover<\u002Fsc-raw-td><sc-raw-td>Sales / Average receivables<\u002Fsc-raw-td><sc-raw-td>Collection speed; 365 / turnover gives days outstanding<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Inventory turnover<\u002Fsc-raw-td><sc-raw-td>COGS / Average inventory<\u002Fsc-raw-td><sc-raw-td>How fast goods sell — 6× is about 61 days<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>PP&amp;E turnover<\u002Fsc-raw-td><sc-raw-td>Sales / Average PP&amp;E<\u002Fsc-raw-td><sc-raw-td>Productivity of the asset base<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Receivables turnover falling from 8 to 5 on flat sales means days outstanding went from about 46 to 73: customers are paying slower, cash is tied up, and bad-debt risk is rising. Read it next to the allowance for doubtful accounts.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">What ratios cannot do<\u002Fh2>\n            <p>They describe symptoms. Interpretation needs the business environment and consistent accounting policies — comparing firms with different inventory methods, lease structures or revenue timing will mislead you before it informs you.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isUpcoming }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:66ch\">\n            <p style=\"margin-top:32px; font-size:17px\">Not covered yet. This session's material goes in once we have the handout — the map is here so you can see where it fits.<\u002Fp>\n            <div class=\"card\"><div class=\"card-kicker\">What it will cover<\u002Fdiv><div class=\"card-body\">{{ curPreview }}<\u002Fdiv><\u002Fdiv>\n            <p style=\"margin-top:24px\">Meanwhile, the drills for Sessions 1 to 3 are the best use of the time — most of what comes later is built on the asset and liability definitions and on accrual timing.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    \n\n  <sc-if value=\"{{ showGloss }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">Reference<\u002Fdiv>\n      <h1 style=\"font-size:38px; margin:8px 0 12px\">Glossary &amp; formulas<\u002Fh1>\n      <p style=\"max-width:64ch; font-size:16px\">Every term the site explains, with its formula where it has one. Search it, or print the page as a one-sheet before an exam.<\u002Fp>\n      <div style=\"display:flex; gap:12px; align-items:flex-end; margin-top:20px; flex-wrap:wrap\">\n        <div class=\"field\" style=\"flex:1; min-width:220px\">\n          <label>Search<\u002Flabel>\n          <input class=\"input\" type=\"text\" value=\"{{ glossQ }}\" sc-camel-on-change=\"{{ onGlossQ }}\" placeholder=\"e.g. NOPAT, turnover, accrual\">\n        <\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ clearGloss }}\">Clear<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ printGloss }}\">Print<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; margin-top:10px; opacity:0.75\">{{ glossCount }}<\u002Fdiv>\n      <hr class=\"hr\">\n      <div>\n        <sc-for list=\"{{ glossRows }}\" as=\"g\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex; gap:20px; padding:12px 0; border-bottom:1px solid var(--color-divider)\">\n            <span style=\"width:30%; min-width:150px; font-family:var(--font-heading); font-weight:600; font-size:15px\">{{ g.term }}<\u002Fspan>\n            <span style=\"flex:1; font-size:15px\">{{ g.def }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showPractice }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">{{ courseName }}<\u002Fdiv>\n        <h1 style=\"font-size:38px; margin:8px 0 12px\">Practice exercises<\u002Fh1>\n        <p style=\"max-width:64ch; font-size:16px\">{{ practiceIntro }}<\u002Fp>\n        <div style=\"display:flex; margin-top:20px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ pickGenTab }}\" style=\"{{ genTabStyle }}\">Endless practice<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ pickSetTab }}\" style=\"{{ setTabStyle }}\">Set exercises<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"max-width:64ch; font-size:14px; margin-top:14px; opacity:0.8\">{{ tabNote }}<\u002Fp>\n        <hr class=\"hr\">\n\n        <sc-if value=\"{{ showGenTab }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <button type=\"button\" sc-camel-on-click=\"{{ openAllGen }}\" style=\"appearance:none; -webkit-appearance:none; text-align:left; font:inherit; width:100%; cursor:pointer; padding:20px; margin-bottom:8px; background:var(--color-surface); color:var(--color-text); border:1px solid var(--color-divider); border-left:3px solid var(--color-accent)\">\n              <span class=\"tag tag-accent\">Everything at once<\u002Fspan>\n              <span style=\"display:block; font-family:var(--font-heading); font-weight:700; font-size:19px; margin-top:12px\">Every randomised exercise, back to back<\u002Fspan>\n              <span style=\"display:block; font-size:14px; margin-top:6px; opacity:0.8\">All of the below in one run, on fresh figures. New num cle>\n                      <circle cx=\"94\" cy=\"76\" r=\"4.6\" fill=\"#6fae8b\"><\u002Fcircle>\n                      <circle cx=\"114\" cy=\"70\" r=\"4.2\" fill=\"#6fae8b\"><\u002Fcircle>\n                    <\u002Fg>\n                  <\u002Fsvg>\n                  <div style=\"font-family:var(--font-heading); font-weight:700; font-size:15px; letter-spacing:0.04em; text-transform:uppercase; color:#eaf6ef; padding-bottom:12px\">{{ commiserateWord }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-family:var(--font-heading); font-weight:700; font-size:16px; color:{{ verdictColor }}\">{{ verdict }}<\u002Fdiv>\n              <p style=\"margin:6px 0 0\">{{ qExplain }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showNext }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:28px; display:flex; gap:12px\">\n              <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ next }}\">{{ nextLabel }}<\u002Fbutton>\n              <span style=\"font-size:12px; align-self:center; color:color-mix(in srgb, var(--color-text) 60%, transparent)\">or press Enter · press 1–4 to answer<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showSkip }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:20px\">\n              <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ skip }}\">Skip this one<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:20px; border-top:1px solid var(--color-divider); padding-top:16px\">\n              <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ back }}\">← Previous question<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showResults }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width:74ch\">\n        <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">{{ quizLabel }}<\u002Fdiv>\n        <h1 style=\"font-size:44px; margin:8px 0 4px\">{{ resultScore }}<\u002Fh1>\n        <p style=\"font-size:17px; max-width:52ch\">{{ resultNote }}<\u002Fp>\n        <div style=\"display:flex; gap:12px; margin:20px 0 36px\">\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ retry }}\">Run it again<\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exitQuiz }}\">Back to the lesson<\u002Fbutton>\n        <\u002Fdiv>\n        <hr class=\"hr\">\n        <h2 style=\"font-size:22px\">Review<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:0; margin-top:8px\">\n          <sc-for list=\"{{ reviewRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid var(--color-divider); padding:16px 0\">\n              <div style=\"display:flex; gap:12px; align-items:baseline\">\n                <span style=\"font-size:13px; color:{{ r.color }}; font-weight:700; min-width:64px\">{{ r.tag }}<\u002Fspan>\n                <div style=\"flex:1\">\n                  <div style=\"font-family:var(--font-heading); font-weight:600\">{{ r.prompt }}<\u002Fdiv>\n                  <div style=\"font-size:14px; margin-top:4px\">Correct answer: {{ r.correct }}<\u002Fdiv>\n                  <div style=\"font-size:14px; margin-top:2px; opacity:0.75\">You said: {{ r.given }}<\u002Fdiv>\n                  <p style=\"font-size:14px; margin:8px 0 0\">{{ r.explain }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultLevel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;beg&quot;,&quot;std&quot;],&quot;default&quot;:&quot;beg&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lessons&quot;},&quot;revealMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;immediate&quot;,&quot;end&quot;],&quot;default&quot;:&quot;immediate&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Drill behaviour&quot;},&quot;drillSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:4,&quot;max&quot;:24,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Drill behaviour&quot;},&quot;reviewAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Drill behaviour&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: 'home', course: 'fa', level: null, qi: 0, answers: {}, numInput: '', order: null, best: {}, loaded: false };\n\n  built = { s1: 1, s2: 1, s3: 1, f1: 1, f2: 1, f3: 1, f4: 1, f5: 1, f6: 1, f7: 1, f8: 1, f9: 1, f10: 1 };\n\n  courseSessions(c) { return (c || this.state.course) === 'fra' ? this.fraSessions : this.sessions; }\n\n  allSessions() { return this.sessions.concat(this.fraSessions); }\n\n  courseMeta = {\n    fa: { label: 'Financial Accounting', sub: 'Sessions 01–15' },\n    fra: { label: 'Financial Reporting & Analysis', sub: 'Chapters 1–12' }\n  };\n\n  fraSessions = [\n    { key: 'f1', num: 'Ch 1–2', title: 'Introducing Financial Accounting' },\n    { key: 'f2', num: 'Ch 2–3', title: 'Accruals, Journal Entries & the Cycle' },\n    { key: 'f3', num: 'Ch 4', title: 'Revenues, Receivables & Operating Income' },\n    { key: 'f4', num: 'Ch 5', title: 'Inventory & Cost of Goods Sold' },\n    { key: 'f5', num: 'Ch 6', title: 'Long-Term Assets' },\n    { key: 'f6', num: 'Ch 7', title: 'Liabilities & Provisions' },\n    { key: 'f7', num: 'Ch 9', title: 'Equity' },\n    { key: 'f8', num: 'Ch 10', title: 'Financial Investments' },\n    { key: 'f9', num: 'Ch 11', title: 'Statement of Cash Flows' },\n    { key: 'f10', num: 'Ch 12', title: 'Ratio Analysis' }\n  ];\n\n  sessions = [\n    { key: 's1', num: '01', title: 'Introduction to Financial Statements' },\n    { key: 's2', num: '02', title: 'Balance Sheet' },\n    { key: 's3', num: '03', title: 'Income Statement' },\n    { key: 's4', num: '04', title: 'Earnings Quality', preview: 'How much of reported profit is real: accruals versus cash, estimates that flatter earnings, and the warning signs. The AstraZeneca case is the prep for this one.' },\n    { key: 's5', num: '05', title: 'Revenue Recognition', preview: 'When a sale becomes revenue — performance obligations, long-term contracts, gross versus net.' },\n    { key: 's6', num: '06', title: 'Statement of Cash Flows I', preview: 'Operating, investing and financing cash flows, and reconciling profit to cash.' },\n    { key: 's7', num: '07', title: 'Statement of Cash Flows II', preview: 'Building the indirect method from two balance sheets, and reading free cash flow.' },\n    { key: 's8', num: '08', title: 'Financial Statement Analysis & Accounts Receivable', preview: 'Core ratios, plus allowances for doubtful accounts and what days-sales-outstanding reveals.' },\n    { key: 's9', num: '09', title: 'Inventory I', preview: 'Cost flow assumptions — FIFO, weighted average, LIFO — and their effect on profit.' },\n    { key: 's10', num: '10', title: 'Inventory II & Long-Lived Assets I', preview: 'Lower of cost and net realisable value; capitalisation and depreciation of tangible assets.' },\n    { key: 's11', num: '11', title: 'Long-Lived Assets II & Financial Liabilities', preview: 'Impairment, disposals, intangibles and goodwill; loans and bonds on the balance sheet.' },\n    { key: 's12', num: '12', title: 'Provisional Liabilities', preview: 'Provisions, contingencies and warranty estimates — recognition versus disclosure.' },\n    { key: 's13', num: '13', title: 'Investments I', preview: 'Passive stakes, significant influence and control, and how each is accounted for.' },\n    { key: 's14', num: '14', title: 'Investments II', preview: 'Equity method and consolidation, and what they do to reported assets and margins.' },\n    { key: 's15', num: '15', title: 'Course Review', preview: 'Pulling the statements back together, plus exam mechanics.' }\n  ];\n\n  bank = {\n    s1: [\n      { t: 'mcq', k: 'Concept', p: 'Which statement is a snapshot at a single point in time rather than a record of a period?', o: ['Income statement', 'Balance sheet', 'Statement of cash flows', 'Earnings announcement'], a: 1, e: 'The balance sheet reports assets, liabilities and equity as of one date. The other two statements cover a span of time.' },\n      { t: 'mcq', k: 'Linkage', p: 'Net income from the income statement shows up in which two other places?', o: ['Cash and inventory', 'Retained earnings and the operating section of the cash flow statement', 'Contributed capital and dividends', 'Revenue and gross profit'], a: 1, e: 'Profit not paid out accumulates in retained earnings, and net income is the starting line of the indirect cash flow statement.' },\n      { t: 'num', k: 'Linkage', p: 'Beginning cash was 100. The cash flow statement shows a net decrease in cash of 18. What is ending cash on the balance sheet?', a: 82, e: 'Beginning cash plus the net change in cash must equal ending cash. 100 − 18 = 82.' },\n      { t: 'mcq', k: 'Governance', p: 'Who elects the board of directors, and what is the board there to do?', o: ['Management elects it, to approve its own plans', 'Shareholders elect it, to select, advise and monitor management', 'Auditors elect it, to sign the statements', 'Regulators appoint it, to enforce the accounting rules'], a: 1, e: 'Management prepares the statements, so shareholders elect a board to monitor them on the owners\\u2019 behalf.' },\n      { t: 'mcq', k: 'Governance', p: 'What does an external auditor actually provide?', o: ['A guarantee that the company is financially healthy', 'An opinion on whether the statements fairly present the firm\\u2019s position under the rules', 'The preparation of the financial statements', 'A valuation of the company\\u2019s shares'], a: 1, e: 'Auditors give an opinion on fair presentation. They do not prepare the accounts and say nothing about whether the business is a good one. Wirecard is the reminder that the opinion can be wrong.' },\n      { t: 'mcq', k: 'Judgment', p: 'Are accounting numbers objective?', o: ['Yes — the rules leave no room for choice', 'No — the rules are rigorous but flexible, and require estimates managers have incentives about', 'Only for public companies', 'Only under IFRS'], a: 1, e: 'Accounting is not a science. Useful lives, bad-debt rates and provisions are estimates. The right question is what choices management made, and why.' },\n      { t: 'mcq', k: 'Regulation', p: 'Which rulebook applies where?', o: ['IFRS in the US, US GAAP in the EU', 'IFRS in the EU, Australia, India and most of the G20; US GAAP in the United States', 'IFRS everywhere since 2005', 'Each company picks freely'], a: 1, e: 'Both are built on accrual accounting; the technical differences run to hundreds of pages and are not worth memorising.' },\n      { t: 'mcq', k: 'Timeline', p: 'Put the three dates in order.', o: ['Financial report → fiscal period end → earnings announcement', 'Fiscal period end → earnings announcement → release of the full financial report', 'Earnings announcement → fiscal period end → financial report', 'They all happen on the same day'], a: 1, e: 'The period ends, the earnings press release and call come weeks later and move the share price, and the full report with the notes follows days after that.' },\n      { t: 'mcq', k: 'Concept', p: 'The accounting equation is:', o: ['Assets + Liabilities = Equity', 'Assets = Liabilities + Shareholders\\u2019 equity', 'Assets = Revenue − Expenses', 'Equity = Assets + Liabilities'], a: 1, e: 'Resources on the left; claims on those resources on the right, with equity as the residual claim.' },\n      { t: 'mcq', k: 'Concept', p: 'Why are the three statements so heavily aggregated?', o: ['To hide bad news from investors', 'Because detail is not collected', 'Because unaggregated statements would be unreadable — at the cost of losing detail you often want', 'Because regulators cap the number of line items'], a: 2, e: 'Masses of transactions compress into a few dozen lines. The lost detail is usually in the notes, which is why analysts read them.' },\n      { t: 'mcq', k: 'Users', p: 'Beyond investors and lenders, who else uses financial statements?', o: ['Only tax authorities', 'Nobody — the statements are written for capital providers alone', 'Employees, competitors, clients, suppliers, media, regulators and NGOs', 'Only the company\\u2019s own management'], a: 2, e: 'The report is public, so anyone with a stake in the firm reads it — including people the company would rather not inform.' },\n      { t: 'mcq', k: 'Concept', p: 'A private company with no shares traded anywhere still prepares accrual financial statements. Why?', o: ['There is no reason; it is a legal formality', 'For bank financing, internal management and a possible future IPO', 'Because cash accounting is illegal', 'Only to compute tax'], a: 1, e: 'Any reasonably sized company follows accrual accounting — lenders demand it, managers need it, and a future financing round will require it.' }\n    ],\n    s2: [\n      { t: 'mcq', k: 'Definition', p: 'An item is recognised as an asset only if the future benefit is:', o: ['Certain, owned and material', 'Probable, owned or controlled, and measurable', 'Probable, insured and depreciable', 'Legally owned and paid for in cash'], a: 1, e: 'All three conditions. Every asset gives future benefits, but not every future benefit qualifies as an asset.' },\n      { t: 'mcq', k: 'Asset or not?', p: 'A software firm acquires land for $75m using a bank mortgage. Asset?', o: ['Yes, and it is depreciated over its useful life', 'Yes, and it is not depreciated', 'No — it was not paid for in cash', 'No — land is not an operating asset'], a: 1, e: 'Probable, controlled and measurable, so yes. Land is not depreciated because it has no finite useful life.' },\n      { t: 'mcq', k: 'Asset or not?', p: 'The same company spends $2m on an advertising campaign. Asset?', o: ['Yes — advertising creates brand value', 'No — the future benefit is not controllable and not reliably measurable', 'Yes, capitalised and amortised over three years', 'Only under IFRS'], a: 1, e: 'The benefit may well be real, but the firm cannot control or reliably measure it, so it is expensed as a period cost.' },\n      { t: 'mcq', k: 'Asset or not?', p: 'A soft drink company spends $10m researching a new beverage. Asset?', o: ['Yes — research creates future products', 'No — the future benefit is too uncertain', 'Yes, if the project has a budget approved by the board', 'Yes under both IFRS and US GAAP'], a: 1, e: 'Research fails the probable test and is expensed. Under IFRS, development costs may be capitalised once technical feasibility is established — that is a later stage, not research.' },\n      { t: 'mcq', k: 'Asset or not?', p: 'A firm pays an insurer $1m for coverage over the coming year. Asset?', o: ['No — insurance is an expense', 'Yes — prepaid insurance: future benefit, past transaction, cost reliably measured', 'No — the benefit is not controllable', 'Only the unused half'], a: 1, e: 'It becomes an expense as the coverage is consumed; on the day it is paid, the whole year of coverage is an asset.' },\n      { t: 'mcq', k: 'Intangibles', p: 'Why is a famously valuable brand often missing from its owner\\u2019s balance sheet?', o: ['Brands are never assets under any rulebook', 'Internally generated intangibles cannot be recognised; purchased ones can', 'Brands are recorded off balance sheet in the notes only', 'Because brand value changes every year'], a: 1, e: 'A purchase price is objective evidence of value; self-built brand value is not. Narrow exceptions exist for software development and, under IFRS, development costs after feasibility.' },\n      { t: 'num', k: 'Capitalise or expense', p: 'A machine costs 100 in cash and will be used for 10 years, straight-line, no salvage. If the cost is capitalised, what is the annual depreciation expense?', a: 10, e: '100 spread over 10 years is 10 a year. Expensing the whole 100 immediately would hit year 1 by 100 instead.' },\n      { t: 'mcq', k: 'Capitalise or expense', p: 'Compared with expensing that same 100 machine immediately, capitalising it in year 1:', o: ['Raises reported profit and reports higher assets', 'Lowers reported profit and reports lower assets', 'Raises profit but leaves assets unchanged', 'Changes nothing — cash is the same'], a: 0, e: 'Cash is identical and the ten-year total expense is identical. Capitalising only delays the cost, which flatters year 1 on both statements — a favourite place to manage earnings.' },\n      { t: 'mcq', k: 'Liability or not?', p: 'A newspaper publisher receives $2m cash for subscriptions to be delivered next year. Liability?', o: ['No — the cash is already in the bank', 'Yes — an obligation to perform, settled in goods rather than cash', 'No — it is revenue on receipt', 'Only the portion relating to next quarter'], a: 1, e: 'Unearned revenue. The obligation is to deliver newspapers; revenue is recognised as they are delivered.' },\n      { t: 'mcq', k: 'Liability or not?', p: 'An ad agency ran the publisher\\u2019s $1m campaign last month, but the invoice has not arrived. Liability?', o: ['No — no invoice, no liability', 'Yes — the service was consumed, so the past event has happened; the missing invoice is irrelevant', 'Only if the amount is confirmed in writing', 'No — it is a contingent liability, so disclose only'], a: 1, e: 'Recognition follows the economic event, not the paperwork. This is an accrued expense.' },\n      { t: 'mcq', k: 'Liability or not?', p: 'An orchestra signs a three-year contract with a flutist at $150k a year. Liability?', o: ['Yes — $450k', 'Yes — $150k, the first year', 'No — the contract is executory: neither side has performed', 'Yes, discounted to present value'], a: 2, e: 'A mutual promise with no performance yet creates no liability. It accrues as the flutist plays.' },\n      { t: 'mcq', k: 'Liability or not?', p: 'A healthcare company is sued for $10m. Its lawyers expect it will probably lose about $8m. Treatment?', o: ['Recognise a provision of about $8m', 'Recognise $10m', 'Disclose in the notes, recognise nothing', 'Nothing at all until judgment'], a: 0, e: 'Probable and reliably estimable means recognise, at the best estimate. Had the claim been judged without merit, the answer would be nothing.' },\n      { t: 'mcq', k: 'Provisions', p: 'When the 737 MAX was grounded in March 2019, Boeing recorded nothing for customer compensation. Why?', o: ['It had no obligation at that point', 'The obligation existed but no reliable estimate was possible, so it disclosed only', 'Compensation to customers is never a liability', 'It was waiting for the DOJ settlement'], a: 1, e: 'Recognition needs both a present obligation and a measurable amount. The first reliable estimate, $6.1bn, was expensed in Q2 2019 and later revised to $8.8bn and $9.3bn.' },\n      { t: 'mcq', k: 'Measurement', p: 'Historical cost versus fair value — which pairing is right?', o: ['Fair value is more reliable; historical cost is more relevant', 'Historical cost is more reliable and more stable; fair value is more relevant and more volatile', 'Both are equally reliable', 'Historical cost creates more fluctuation in reported numbers'], a: 1, e: 'Cost is verifiable and stale; fair value is current and moves with markets. Operating assets are generally carried at cost less depreciation, written down but not up — conservatism.' },\n      { t: 'mcq', k: 'Measurement', p: 'What did the 2008 reclassification episode show about fair value?', o: ['Fair value always produces the right number', 'In frozen markets the only observable prices are fire-sale prices, so marking to market can force write-downs and more selling', 'Banks were required to switch to fair value', 'Fair value is banned for financial assets'], a: 1, e: 'The IASB let banks reclassify trading assets to amortised cost within days and the FASB followed weeks later. The losses were real; the change mainly delayed their appearance.' },\n      { t: 'num', k: 'TSMC', p: 'TSMC reported total assets of 1,886,455 in 2016, of which financial assets totalled 121,366 (NT$m). What are total operating assets?', a: 1765089, tol: 1, e: 'Subtracting financial assets from total assets is the fast route, because financial assets are usually the shorter list. 1,886,455 − 121,366 = 1,765,089.' },\n      { t: 'num', k: 'TSMC', p: 'Operating liabilities were 238,478 (NT$m). What are TSMC\\u2019s net operating assets for 2016?', a: 1526611, tol: 1, e: 'NOA = operating assets − operating liabilities = 1,765,089 − 238,478 = 1,526,611. It equals invested capital computed from the funding side.' },\n      { t: 'mcq', k: 'Analysis', p: 'Invested capital is:', o: ['Total assets − total liabilities', 'Equity + financial liabilities − financial assets', 'Equity + total liabilities', 'Operating assets + financial assets'], a: 1, e: 'NOA reads the resources off the left side of the balance sheet; IC reads the funding off the right side. Same money, same number.' },\n      { t: 'mcq', k: 'Analysis', p: 'Why split assets and liabilities into operating and financial before analysing them?', o: ['Regulators require the split on the face of the balance sheet', 'Because value is created in operations, while financing is how those operations are funded', 'To reduce total assets', 'Because financial items are always immaterial'], a: 1, e: 'Operating is where value is created; investing and financing are the supporting cast. Some calls — excess cash, pension obligations — are subjective, so state your assumption and stay consistent.' }\n    ],\n    s3: [\n      { t: 'mcq', k: 'Linkage', p: 'Retained earnings changes over a period for which two reasons?', o: ['Revenues and expenses only', 'Net income and dividends', 'Share issues and buybacks', 'Net income and share issues'], a: 1, e: 'Opening retained earnings + net income − dividends = closing retained earnings. Net income itself is revenues minus expenses.' },\n      { t: 'mcq', k: 'Trap', p: 'Where do dividends appear?', o: ['As an expense on the income statement', 'As a reduction of retained earnings — never as an expense', 'As revenue to shareholders', 'As a liability only'], a: 1, e: 'Dividends are a distribution of profit to owners, not a cost of earning it.' },\n      { t: 'num', k: 'Linkage', p: 'Opening retained earnings 500, net income 120, dividends declared and paid 30. What is closing retained earnings?', a: 590, e: '500 + 120 − 30 = 590. Dividends reduce retained earnings without ever touching net income.' },\n      { t: 'mcq', k: 'Definition', p: 'Under accrual accounting, revenue is recognised when:', o: ['Cash is received', 'The order is signed', 'Goods or services are delivered, collection is reasonably assured, and the amount is measurable', 'The invoice is issued'], a: 2, e: 'Earned, collectible and measurable. Cash timing is a separate question.' },\n      { t: 'num', k: 'Worked example', p: 'Ailawadi Corporation, January. Using the cash basis, what is net income? (Negative numbers with a minus sign.)', c: 'Cash in: 75,000 owner investment; 40,000 six-month bank loan at 6%; 1,200 customer advance for February delivery; 60,000 cash sales. Cash out: 6,000 rent (two months at 3,000); 36,000 display equipment (three-year life); 1,200 insurance for twelve months; 750 utilities; 3,500 salaries; 44,800 merchandise.', a: -31050, tol: 1, e: 'Cash revenue is 60,000 + 1,200 = 61,200; cash expenses are 92,250. The investment and the loan are financing, not income. Net: −31,050 — a profitable-looking month reported as a large loss because a three-year machine and a year of insurance were paid for up front.' },\n      { t: 'num', k: 'Worked example', p: 'Same month, accrual basis. What is net income?', c: 'Also: customers owe 9,500 from January sales; suppliers are owed 3,900; unpaid utilities 260 and unpaid salaries 1,260; inventory on hand 5,500. Rent is 3,000 a month; equipment has a three-year life and no salvage; insurance covers Jan–Dec; the loan carries 6% a year.', a: 16230, tol: 1, e: 'Revenue 69,500 (cash sales plus receivables; the 1,200 advance is a liability). Expenses 53,270: COGS 43,200, salaries 4,760, rent 3,000, insurance 100, utilities 1,010, depreciation 1,000, interest 200. Net income 16,230.' },\n      { t: 'mcq', k: 'Worked example', p: 'How is the 1,200 customer advance for February delivery treated on the accrual basis?', o: ['January revenue', 'A liability — nothing has been delivered yet', 'A gain', 'Contributed capital'], a: 1, e: 'Unearned revenue. It becomes revenue in February when the merchandise ships.' },\n      { t: 'num', k: 'Worked example', p: 'Insurance of 1,200 was paid on 1 January for twelve months of coverage. What is January\\u2019s insurance expense?', a: 100, e: '1,200 / 12 = 100. The remaining 1,100 sits on the balance sheet as prepaid insurance.' },\n      { t: 'num', k: 'Worked example', p: 'Display equipment cost 36,000 with a three-year life and no salvage value. What is one month of straight-line depreciation?', a: 1000, e: '36,000 / 3 = 12,000 a year, so 1,000 a month. The cash basis charged the whole 36,000 in January.' },\n      { t: 'mcq', k: 'Matching', p: 'Which of these is a product cost rather than a period cost?', o: ['The CEO\\u2019s salary', 'Raw materials used in production', 'Advertising', 'R&D'], a: 1, e: 'Product costs attach to a unit and wait in inventory until it sells — materials, factory labour, factory overhead including the lights on the factory floor. Period costs cannot be attached to a unit, so they hit the period.' },\n      { t: 'mcq', k: 'Matching', p: 'Matching is often violated for period costs. Why does that matter when reading an R&D-heavy company?', o: ['It does not — the totals are the same', 'Its spending hits profit now while the benefits, if any, arrive later, so it can look unprofitable while building something valuable', 'Period costs are optional disclosures', 'R&D is always capitalised'], a: 1, e: 'The cost is recognised immediately and the asset never appears, so reported profit understates what is being built — the mirror image of the missing-brand problem.' },\n      { t: 'mcq', k: 'Concept', p: 'Over the entire life of a firm, cash income and accrual income are:', o: ['Different — accrual income is always higher', 'The same; accrual accounting shifts when cash flows are reported, not the total', 'Different — cash income is always higher', 'Unrelated'], a: 1, e: 'Accruals are a timing device. That is also why aggressive accruals eventually reverse.' },\n      { t: 'mcq', k: 'Gains and losses', p: 'Equipment bought for 10,000 is sold weeks later for 9,500. On the income statement this is:', o: ['Revenue of 9,500', 'A loss of 500', 'An expense of 10,000', 'No effect — it is a balance sheet transaction'], a: 1, e: 'Outside normal operations, so it is a gain or loss on the net change, not revenue and expense. Here, a 500 loss.' },\n      { t: 'mcq', k: 'Profit measures', p: 'EBITDA differs from operating profit (EBIT) in that it:', o: ['Excludes tax only', 'Also adds back depreciation and amortisation', 'Includes interest income', 'Is defined by IFRS'], a: 1, e: 'Buffett\\u2019s objection: interest and taxes are real costs, and capital expenditure is not paid for by the tooth fairy. \"Community-adjusted EBITDA\" and \"EBITDAC\" show how far the adjusting can go.' },\n      { t: 'num', k: 'Profit measures', p: 'EBIT is 1,000 and the tax rate is 20%. What is NOPAT under the quick-and-dirty approach?', a: 800, e: 'EBIT × (1 − tax rate) = 1,000 × 0.8 = 800.' },\n      { t: 'mcq', k: 'Profit measures', p: 'Why use NOPAT rather than net income?', o: ['It is always larger', 'It is after tax and financing-neutral, so two identical businesses with different leverage are comparable', 'It excludes taxes, which are not operating', 'It is required by IFRS'], a: 1, e: 'Net income mixes operating, non-operating and financing outcomes. NOPAT is the after-tax profit from operations as if fully equity-financed — the numerator of ROIC.' }\n    ],\n    f1: [\n      { t: 'mcq', k: 'Definition', p: 'Financial accounting is best described as the process of:', o: ['Setting prices for products', 'Recording, summarising, reporting and analysing financial transactions', 'Preparing budgets for internal managers only', 'Computing tax owed'], a: 1, e: 'Financial accounting reports to external users. Managerial accounting serves internal decisions and follows no external rulebook.' },\n      { t: 'mcq', k: 'Business activities', p: 'A company buys a new factory. Which activity is that?', o: ['Operating', 'Investing', 'Financing', 'Planning'], a: 1, e: 'Investing means acquiring and disposing of the resources a business uses. Financing is how those resources are funded; operating is using them to produce and sell.' },\n      { t: 'mcq', k: 'Business activities', p: 'Issuing shares and borrowing from a bank are both:', o: ['Investing activities', 'Financing activities — owner financing and creditor financing respectively', 'Operating activities', 'Planning activities'], a: 1, e: 'Creditor financing is a legal obligation to repay; owner financing carries no repayment obligation but dilutes ownership.' },\n      { t: 'num', k: 'Balance sheet', p: 'A company reports owner financing of 8,055 and creditor financing of 23,287 ($m). What are total assets?', a: 31342, tol: 1, e: 'Assets = liabilities + equity = 23,287 + 8,055 = 31,342. The right side always tells you how the left side was funded.' },\n      { t: 'mcq', k: 'Statements', p: 'Which statement reports the results of operating activities over a period?', o: ['Balance sheet', 'Income statement', 'Statement of stockholders\\u2019 equity', 'Statement of cash flows'], a: 1, e: 'Net income = revenues − expenses, measured over a period. The balance sheet is a position at one date.' },\n      { t: 'mcq', k: 'Disclosure', p: 'What is the trade-off in disclosing more financial information?', o: ['There is no cost to disclosure', 'Better disclosure can lower the cost of capital, but reveals information to competitors and costs money to produce', 'Disclosure only benefits management', 'Disclosure is required to be identical for all companies'], a: 1, e: 'Investors pay more for a firm they can see into; competitors also read the same filing. That tension explains a lot of vague disclosure.' },\n      { t: 'mcq', k: 'Users', p: 'Why do creditors read financial statements differently from shareholders?', o: ['They do not — both want maximum profit', 'Creditors focus on whether cash will be there to repay a fixed claim; shareholders hold the residual claim and care about upside', 'Creditors only read the income statement', 'Shareholders only read the cash flow statement'], a: 1, e: 'A lender\\u2019s upside is capped at interest and principal, so downside protection — liquidity, solvency, covenants — dominates their reading.' },\n      { t: 'mcq', k: 'Periods', p: 'A fiscal year is:', o: ['Always the calendar year', 'Any one-year reporting period a company adopts', 'Always ending 31 December for listed companies', 'A tax concept only'], a: 1, e: 'Microsoft closes on 30 June, Nike on 31 May, Facebook on 31 December. Retailers often close in late January, after the holiday season and its returns.' },\n      { t: 'bucket', k: 'Drag & drop · Activities', p: 'Sort each event into the business activity it belongs to.', buckets: ['Investing', 'Financing', 'Operating'], items: [{ label: 'Buys a warehouse', b: 0 }, { label: 'Issues common stock', b: 1 }, { label: 'Pays employee wages', b: 2 }, { label: 'Borrows from a bank', b: 1 }, { label: 'Sells obsolete machinery', b: 0 }, { label: 'Buys inventory for resale', b: 2 }, { label: 'Pays a dividend', b: 1 }, { label: 'Advertises the product', b: 2 }], e: 'Investing acquires and disposes of the resources the firm uses. Financing raises and returns the money for them. Operating uses them to produce, promote and sell.' },\n      { t: 'bucket', k: 'Drag & drop · Balance sheet', p: 'Place each item where it appears on the balance sheet.', buckets: ['Current asset', 'Noncurrent asset', 'Current liability', 'Noncurrent liability'], items: [{ label: 'Inventory', b: 0 }, { label: 'Goodwill', b: 1 }, { label: 'Accounts payable', b: 2 }, { label: 'Long-term debt', b: 3 }, { label: 'Prepaid insurance', b: 0 }, { label: 'Property, plant and equipment', b: 1 }, { label: 'Deferred (unearned) revenue', b: 2 }, { label: 'Current maturities of long-term debt', b: 2 }, { label: 'Marketable securities', b: 0 }, { label: 'Deferred compensation liability', b: 3 }], e: 'The dividing line is one year (or one operating cycle). Note the trap: current maturities of long-term debt are a current liability, however long the original loan was.' },\n      { t: 'mcq', k: 'Recognition', p: 'A liability is recorded when three conditions are met. Which is NOT one of them?', o: ['The obligation is probable', 'The amount is known or reasonably estimable', 'The transaction causing the obligation has occurred', 'A cash payment date has been agreed'], a: 3, e: 'Settlement can be in cash or in goods and services, and the date can be unknown. What matters is a probable, measurable obligation from a past event.' },\n      { t: 'mcq', k: 'Assets', p: 'For an asset to be capitalised, the company must:', o: ['Hold legal title in every case', 'Own or control it — legal title or an unrestricted right to use it — with measurable expected future benefits', 'Have paid cash for it', 'Expect to sell it within a year'], a: 1, e: 'Control is the test, not title, and a monetary value must be assignable to the benefit.' },\n      { t: 'mcq', k: 'Measurement', p: 'Assets a company intends to use are generally reported at:', o: ['Fair value, remeasured each period', 'Historical cost — reliable, but often significantly undervalued', 'Replacement cost', 'Net realisable value'], a: 1, e: 'Marketable securities are the common exception: reported at fair value from real-time quotes, which is both reliable and current.' },\n      { t: 'mcq', k: 'Statements', p: 'The statement of stockholders\\u2019 equity exists to:', o: ['List the shareholders', 'Reconcile the beginning and ending balances of each equity account over the period', 'Report the market value of the shares', 'Replace the income statement'], a: 1, e: 'It shows contributed capital raised, net income added, dividends paid, and other equity movements — the bridge between two balance sheets.' },\n      { t: 'num', k: 'Articulation', p: 'A company begins the year with retained earnings of 3,000, earns net income of 2,539 and pays dividends of 1,491. What is closing retained earnings?', a: 4048, tol: 1, e: '3,000 + 2,539 − 1,491 = 4,048. This is the link that ties the income statement to the balance sheet, via the statement of stockholders\\u2019 equity.' },\n      { t: 'num', k: 'Ratios', p: 'Total liabilities are 23,287 and total stockholders\\u2019 equity is 8,055. What is the debt-to-equity ratio, to one decimal place?', a: 2.9, tol: 0.05, e: '23,287 / 8,055 = 2.9. A solvency measure: how much creditor financing sits behind every unit of owner financing. Rising debt-to-equity means rising credit risk.' },\n      { t: 'mcq', k: 'Beyond the statements', p: 'Which of these is NOT one of the four primary financial statements?', o: ['Statement of cash flows', 'Management Discussion and Analysis', 'Statement of stockholders\\u2019 equity', 'Income statement'], a: 1, e: 'MD&A, the auditor\\u2019s report, the footnotes and regulatory filings surround the statements and often carry the most revealing detail — but they are not statements.' }\n    ],\n    f2: [\n      { t: 'mcq', k: 'Accrual rule', p: 'Under accrual accounting, expenses are recorded when:', o: ['Cash is paid', 'They are incurred, matched against the related revenue', 'The invoice arrives', 'The budget is approved'], a: 1, e: 'Revenue when earned, expenses when incurred and matched. Required by both IFRS and US GAAP.' },\n      { t: 'mcq', k: 'Debits & credits', p: 'Double-entry accounting requires that:', o: ['Every transaction increases assets', 'Debits equal credits for every transaction', 'Each account is used only once', 'Cash is always involved'], a: 1, e: 'Debits sit on the left of a T-account, credits on the right, and they must balance — which is what keeps A = L + E true.' },\n      { t: 'mcq', k: 'Debits & credits', p: 'Which combination is correct?', o: ['Assets increase with credits; revenues increase with debits', 'Assets increase with debits; revenues increase with credits', 'Liabilities increase with debits; expenses increase with credits', 'Equity increases with debits'], a: 1, e: 'Debits increase assets and expenses. Credits increase liabilities, equity and revenues.' },\n      { t: 'mcq', k: 'Journal entry', p: 'Investors contribute 10,000 cash to start a juice company. The entry is:', o: ['Debit cash 10,000; credit common stock 10,000', 'Debit common stock 10,000; credit cash 10,000', 'Debit cash 10,000; credit revenue 10,000', 'Debit cash 10,000; credit notes payable 10,000'], a: 0, e: 'Cash comes in (debit) and contributed capital goes up (credit). Share issues are never revenue.' },\n      { t: 'mcq', k: 'Journal entry', p: 'The company pays 1,800 for a rental agreement covering the coming months. On payment, the entry is:', o: ['Debit rent expense 1,800; credit cash 1,800', 'Debit prepaid rent 1,800; credit cash 1,800', 'Debit cash 1,800; credit prepaid rent 1,800', 'No entry until the space is used'], a: 1, e: 'Paying ahead buys an asset. Rent expense is recognised month by month as the space is used.' },\n      { t: 'mcq', k: 'Journal entry', p: 'The company sells drinks that cost 600 to customers for 2,400 cash. How many entries?', o: ['One: debit cash 2,400, credit sales 2,400', 'Two: the sale (cash 2,400 / sales 2,400) and the cost (COGS 600 / inventory 600)', 'One: debit cash 1,800, credit sales 1,800', 'Two: sales and a gain of 1,800'], a: 1, e: 'Revenue and the matched cost are recorded separately. Gross profit of 1,800 is the result, not an entry.' },\n      { t: 'mcq', k: 'Journal entry', p: 'The company sells 300 of gift cards. What is recorded?', o: ['Revenue of 300', 'Cash 300 and a liability (deferred revenue) of 300', 'Cash 300 and equity of 300', 'Nothing until redemption'], a: 1, e: 'Cash arrived but nothing has been delivered, so the obligation to honour the cards is a liability until it is redeemed or expires.' },\n      { t: 'mcq', k: 'Adjustments', p: 'Why are adjusting entries needed at period end?', o: ['To correct bookkeeping mistakes', 'Because some revenues are earned and expenses incurred without any cash transaction to trigger an entry', 'To restate prior years', 'To reconcile the bank account'], a: 1, e: 'Depreciation, accrued wages, expired prepayments and earned deferred revenue have no cash event, so they are recorded by adjustment.' },\n      { t: 'mcq', k: 'Cycle', p: 'The correct order of the accounting cycle is:', o: ['Post → journalise → trial balance → statements', 'Journalise → post to the ledger → adjust → prepare statements → close', 'Adjust → journalise → close → post', 'Statements → journalise → post → adjust'], a: 1, e: 'Transactions are journalised chronologically, posted to accounts, adjusted at period end, then reported and closed.' },\n      { t: 'order', k: 'Drag & drop · Cycle', p: 'Put the steps of the accounting cycle in order.', items: ['Analyse the transaction — which accounts, which direction', 'Journalise it in the general journal', 'Post the entry to the ledger accounts', 'Record period-end adjusting entries', 'Prepare the financial statements', 'Close the temporary accounts into retained earnings'], e: 'Analysis comes before journalising: you cannot record what you have not identified. Closing is last, and it resets revenues, expenses and dividends to zero for the new period.' },\n      { t: 'bucket', k: 'Drag & drop · Debits and credits', p: 'Sort each account by what a DEBIT does to it.', buckets: ['Debit increases it', 'Debit decreases it'], items: [{ label: 'Cash', b: 0 }, { label: 'Inventory', b: 0 }, { label: 'Wage expense', b: 0 }, { label: 'Accounts payable', b: 1 }, { label: 'Sales revenue', b: 1 }, { label: 'Common stock', b: 1 }, { label: 'Notes payable', b: 1 }, { label: 'Prepaid insurance', b: 0 }], e: 'Debits increase assets and expenses; credits increase liabilities, equity and revenues. Accounts that increase on the debit side are said to have a normal debit balance.' },\n      { t: 'bucket', k: 'Drag & drop · Transactions', p: 'A juice startup\\u2019s first month. Sort each transaction by whether it touches the income statement.', buckets: ['Hits net income', 'Balance sheet only'], items: [{ label: 'Paid 900 for advertising', b: 0 }, { label: 'Issued stock for 10,000 cash', b: 1 }, { label: 'Bought 2,000 inventory on account', b: 1 }, { label: 'Sold drinks costing 600 for 2,400', b: 0 }, { label: 'Paid 1,500 owed to suppliers', b: 1 }, { label: 'Paid 400 of dividends', b: 1 }, { label: 'Sold 300 of gift cards', b: 1 }, { label: 'Paid 40 of interest', b: 0 }], e: 'Financing events, collections, payments of existing payables and dividends never touch income. Dividends reduce retained earnings directly; gift cards create a liability.' },\n      { t: 'mcq', k: 'Journal entry', p: 'The company pays 1,800 as a security deposit on its store lease. The entry is:', o: ['Debit rent expense 1,800; credit cash 1,800', 'Debit security deposit 1,800; credit cash 1,800', 'Debit cash 1,800; credit security deposit 1,800', 'No entry required'], a: 1, e: 'A refundable deposit is an asset — a future benefit the company controls — not a cost of occupying the space.' },\n      { t: 'mcq', k: 'Journal entry', p: 'Dividends of 400 are paid to shareholders. The debit goes to:', o: ['Dividend expense', 'Retained earnings', 'Common stock', 'Cash'], a: 1, e: 'Cash is credited; retained earnings is debited. Dividends are a distribution, so they never reach the income statement.' },\n      { t: 'mcq', k: 'Journal entry', p: 'A 4,000 note is repaid together with 40 of interest. The entry is:', o: ['Debit notes payable 4,040; credit cash 4,040', 'Debit notes payable 4,000, debit interest expense 40; credit cash 4,040', 'Debit interest expense 4,040; credit cash 4,040', 'Debit cash 4,040; credit notes payable 4,040'], a: 1, e: 'Principal settles the liability; interest is the cost of having used the money. Only the 40 hits income.' },\n      { t: 'num', k: 'Worked example', p: 'Sales revenue 5,300; cost of goods sold 1,300; wages 1,300; rent 700; advertising 900; interest 40. What is net income?', a: 1060, tol: 1, e: 'Gross profit 4,000, operating income 1,100 after 2,900 of operating expenses, then 40 of interest: net income 1,060. Interest sits below operating income because financing is not operations.' },\n      { t: 'num', k: 'Worked example', p: 'Retained earnings began the month at zero. Net income was 1,060 and dividends of 400 were paid. What is the closing retained earnings balance?', a: 660, tol: 1, e: '0 + 1,060 − 400 = 660. Contributed capital of 10,000 plus earned capital of 660 gives total equity of 10,660.' },\n      { t: 'mcq', k: 'Adjustments', p: 'A three-month online membership is sold for 600 in June, covering July to September. At 30 June the correct treatment is:', o: ['Revenue 600', 'A liability of 600 — unearned revenue', 'Revenue 200, liability 400', 'No entry'], a: 1, e: 'Nothing has been delivered by 30 June. Revenue of 200 a month is recognised from July as the service is provided.' }\n    ],\n    f3: [\n      { t: 'mcq', k: 'IFRS 15 / ASC 606', p: 'The five-step revenue model begins with:', o: ['Determining the transaction price', 'Identifying the contract with the customer', 'Recognising revenue', 'Allocating the price'], a: 1, e: 'Contract → performance obligations → transaction price → allocate → recognise as each obligation is satisfied.' },\n      { t: 'mcq', k: 'IFRS 15 / ASC 606', p: 'A phone is sold with 24 months of service for one lump sum. What does the standard require?', o: ['Recognise everything at the point of sale', 'Identify the distinct performance obligations and allocate the price between them by stand-alone selling price', 'Recognise everything over 24 months', 'Recognise only the cash received each month'], a: 1, e: 'Bundled sales are split: the handset is delivered now, the service over time, so the timing of revenue differs by component.' },\n      { t: 'num', k: 'Long-term contracts', p: 'An 8,000,000 construction contract has estimated total costs of 6,000,000. Costs of 2,400,000 are incurred in year 1. Under percentage-of-completion, what revenue is recognised in year 1?', a: 3200000, tol: 1, e: '2,400,000 / 6,000,000 = 40% complete, so 40% × 8,000,000 = 3,200,000 of revenue, against 2,400,000 of cost — gross profit 800,000.' },\n      { t: 'mcq', k: 'Long-term contracts', p: 'Compared with percentage-of-completion, the completed-contract method:', o: ['Reports more total profit', 'Reports the same total revenue and profit, but recognises it later', 'Is required under IFRS', 'Reports revenue earlier'], a: 1, e: 'Timing again, not totals. Percentage-of-completion requires a signed contract and reliable estimates of cost to complete.' },\n      { t: 'mcq', k: 'Receivables', p: 'Accounts receivable are reported on the balance sheet at:', o: ['Gross invoiced amount', 'Net realisable value — gross receivables less the allowance for uncollectible accounts', 'Fair value', 'Cash collected to date'], a: 1, e: 'The allowance is a contra asset representing the amount the company expects customers will not pay.' },\n      { t: 'mcq', k: 'Receivables', p: 'Recording bad debt expense through the allowance method:', o: ['Reduces net income and reduces net receivables', 'Reduces net income but leaves assets unchanged', 'Reduces assets but not income', 'Has no effect until the account is written off'], a: 0, e: 'Expense up, allowance up, net assets down. The later write-off of a specific account then hits only the gross receivable and the allowance — no further income effect.' },\n      { t: 'num', k: 'Receivables', p: 'Gross receivables are 12,000 and the allowance for uncollectible accounts is 900. What is reported as net accounts receivable?', a: 11100, tol: 1, e: '12,000 − 900 = 11,100 — the net realisable value.' },\n      { t: 'mcq', k: 'Earnings management', p: 'Why is the allowance a favourite tool for managing earnings?', o: ['It is audited more lightly than cash', 'It is an estimate: under-providing raises income now, over-providing builds a cushion for later', 'It never affects the income statement', 'It is disclosed only in the notes'], a: 1, e: 'Watch the allowance as a percentage of gross receivables over time. Sudden softening while receivables grow is a warning sign.' },\n      { t: 'mcq', k: 'Operating income', p: 'Why separate operating from non-operating income?', o: ['Regulators forbid combining them', 'Operating income comes from the primary, repeatable activities and is the better basis for predicting future performance', 'Non-operating income is never taxable', 'Operating income excludes wages'], a: 1, e: 'One-off gains and financing items do not repeat, so they are poor predictors — which is why analysts rebuild the income statement before forecasting.' }\n    ],\n    f4: [\n      { t: 'mcq', k: 'Matching', p: 'Inventory cost sits on the balance sheet until the goods are sold. That is an example of:', o: ['Immediate recognition', 'Direct association of cost with revenue', 'Systematic allocation', 'Conservatism'], a: 1, e: 'COGS is matched directly against the sale. Depreciation is systematic allocation; advertising is immediate recognition.' },\n      { t: 'mcq', k: 'Cost of inventory', p: 'Which of these is included in the cost of retail inventory?', o: ['Only the invoice price from the supplier', 'The purchase price plus freight-in and costs of preparing goods for sale', 'The purchase price plus the sales commission on the eventual sale', 'The expected selling price'], a: 1, e: 'All costs to acquire and get the goods ready to sell are capitalised. Selling costs are period expenses.' },\n      { t: 'num', k: 'FIFO', p: 'Opening inventory 100 units at 4.00. Purchase 100 units at 4.80. 160 units are sold; 40 remain. Under FIFO, what is ending inventory?', c: 'Total cost available = 100 × 4.00 + 100 × 4.80 = 880.', a: 192, tol: 1, e: 'FIFO sells the oldest first, so the 40 units left are the newest: 40 × 4.80 = 192. COGS is therefore 880 − 192 = 688.' },\n      { t: 'num', k: 'LIFO', p: 'Same facts. Under LIFO, what is cost of goods sold?', c: 'Opening 100 at 4.00; purchase 100 at 4.80; 160 units sold.', a: 720, tol: 1, e: 'LIFO sells the newest first: 100 × 4.80 + 60 × 4.00 = 720, leaving 40 × 4.00 = 160 in inventory. LIFO is not permitted under IFRS.' },\n      { t: 'num', k: 'Average cost', p: 'Same facts. Under weighted average cost, what is ending inventory?', a: 176, tol: 1, e: 'Average cost = 880 / 200 = 4.40 per unit, so 40 × 4.40 = 176 and COGS is 704 — between the FIFO and LIFO answers.' },\n      { t: 'mcq', k: 'Comparison', p: 'When costs are rising, FIFO compared with LIFO reports:', o: ['Lower profit and lower inventory', 'Higher profit and higher inventory', 'Higher profit and lower inventory', 'Identical profit'], a: 1, e: 'FIFO charges the old, cheap units to COGS and leaves the expensive ones on the balance sheet. LIFO does the reverse, which is why it was popular for tax purposes in the US.' },\n      { t: 'mcq', k: 'Write-downs', p: 'Inventory carried at 500 has a net realisable value of 380. What happens?', o: ['Nothing until it is sold', 'Write it down to 380, reducing assets and income now', 'Write it up when NRV recovers above cost', 'Disclose in the notes only'], a: 1, e: 'Lower of cost and net realisable value. Under IFRS a later recovery can reverse the write-down up to original cost; it can never go above cost.' },\n      { t: 'mcq', k: 'Analysis', p: 'Inventory turnover falls sharply while inventory grows faster than sales. The most likely concern is:', o: ['The company is about to raise prices', 'Goods are not selling — a write-down may be coming', 'COGS is understated by definition', 'Suppliers have cut prices'], a: 1, e: 'Building inventory ahead of demand ties up cash and often ends in a markdown, which hits gross margin in a later period.' }\n    ],\n    f5: [\n      { t: 'mcq', k: 'Capitalisation', p: 'Which cost is capitalised as part of a machine\\u2019s cost?', o: ['A routine annual service', 'Installation, shipping and calibration costs needed to get it ready for use', 'Staff training on unrelated systems', 'Insurance for the following year'], a: 1, e: 'Capitalise everything necessary to acquire the asset and prepare it for its intended use. Routine repairs and maintenance are expensed.' },\n      { t: 'mcq', k: 'Capitalisation', p: 'A company incurs interest on debt raised specifically to construct its own warehouse. Under IFRS:', o: ['All interest is expensed', 'Interest during construction is capitalised into the asset\\u2019s cost', 'Interest is deducted from equity', 'Interest is disclosed only'], a: 1, e: 'Self-constructed assets absorb direct materials, direct labour, a reasonable share of ove
