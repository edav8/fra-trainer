 <li><strong>Investing<\u002Fstrong> — buying the things the business runs on.<\u002Fli>\n              <li><strong>Operating<\u002Fstrong> — making, marketing and selling.<\u002Fli>\n            <\u002Fol>\n            <p>Four reports describe it. The balance sheet lists what the company has and who financed it, on one date. The income statement shows profit over a period. The statement of stockholders’ equity shows how the owners’ slice changed. The cash flow statement shows where money actually moved.<\u002Fp>\n            <p>Here is the join that matters most. Profit does not disappear: it gets added to <strong>retained earnings<\u002Fstrong>, the pile of profit the company has kept. Start with 3,000 kept, earn 2,539, pay owners 1,491, and you end with 4,048. That single line links the income statement to the balance sheet.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Word<\u002Fsc-raw-th><sc-raw-th>What it means when you read a report<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Current<\u002Fsc-raw-td><sc-raw-td>Within a year<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Noncurrent<\u002Fsc-raw-td><sc-raw-td>Longer than a year<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Creditor financing<\u002Fsc-raw-td><sc-raw-td>Borrowed — must be repaid<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Owner financing<\u002Fsc-raw-td><sc-raw-td>Invested by shareholders — no repayment date<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Assets = liabilities + equity. If a company reports 8,055 of owner money and 23,287 of borrowed money, it must have 31,342 of assets.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">What accounting is for<\u002Fh2>\n            <p>Accounting is the process of recording, summarising, reporting and analysing a business's financial transactions. Split it in two by audience: financial accounting reports to outsiders under a common rulebook, managerial accounting serves managers inside the firm and follows no external rules at all.<\u002Fp>\n            <p>The outsiders are not one group. Shareholders own the residual claim and care about upside. Creditors and suppliers hold fixed claims and care mainly about whether the cash will be there. Employees, competitors, regulators and journalists read the same document for their own reasons.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">The disclosure trade-off<\u002Fdiv><div class=\"card-body\">More disclosure tends to lower a firm's cost of capital, because investors pay more for what they can see. It also hands information to competitors and costs money to produce. That tension explains a great deal of deliberately vague reporting.<\u002Fdiv><\u002Fdiv>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Four kinds of activity<\u002Fh2>\n            <p>Every business plans, then finances, then invests, then operates.<\u002Fp>\n            <ul style=\"padding-left:20px\">\n              <li><strong>Planning<\u002Fstrong> — the strategy: what the firm will sell, to whom, and how it will win.<\u002Fli>\n              <li><strong>Financing<\u002Fstrong> — raising the money. Creditor financing must be repaid; owner financing does not, but it dilutes ownership.<\u002Fli>\n              <li><strong>Investing<\u002Fstrong> — acquiring and disposing of the resources the business runs on.<\u002Fli>\n              <li><strong>Operating<\u002Fstrong> — using those resources to produce, promote and sell.<\u002Fli>\n            <\u002Ful>\n            <p>The statements are organised along exactly these lines, which is why the classification of a cash flow as operating, investing or financing tells you something real.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Reporting periods<\u002Fh2>\n            <p>Annual, semiannual, quarterly or monthly. A fiscal year is any twelve-month reporting period the company adopts, and it need not end in December: Microsoft closes on 30 June, Nike on 31 May, Facebook on 31 December. Retailers commonly close in late January, once the holiday season and its returns are through.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">The four statements<\u002Fh2>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Statement<\u002Fsc-raw-th><sc-raw-th>Question it answers<\u002Fsc-raw-th><sc-raw-th>Period or date<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Balance sheet<\u002Fsc-raw-td><sc-raw-td>What do we control, and who financed it? Assets = Liabilities + Equity<\u002Fsc-raw-td><sc-raw-td>A date<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Income statement<\u002Fsc-raw-td><sc-raw-td>Did we make money? Net income = Revenues − Expenses<\u002Fsc-raw-td><sc-raw-td>A period<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Statement of stockholders' equity<\u002Fsc-raw-td><sc-raw-td>How did owners' claims change — capital raised, income earned, dividends paid?<\u002Fsc-raw-td><sc-raw-td>A period<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Statement of cash flows<\u002Fsc-raw-td><sc-raw-td>Where did cash come from and go, across operating, investing and financing?<\u002Fsc-raw-td><sc-raw-td>A period<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Each statement carries several names in practice. The balance sheet is also the statement of financial position; the income statement is also the statement of earnings, of operations, or of profit and loss. The names differ, the content does not.<\u002Fp>\n            <p>A worked read: if a company reports owner financing of 8,055 and creditor financing of 23,287, total assets must be 31,342. The right side is not a footnote to the left side; it is the same money counted from the other end.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Articulation: how the four connect<\u002Fh2>\n            <p>The central feature of a set of statements is that they explain each other. Three questions, three places to look:<\u002Fp>\n            <ul style=\"padding-left:20px\">\n              <li>How did cash on the balance sheet change? The statement of cash flows.<\u002Fli>\n              <li>How did equity on the balance sheet change? The statement of stockholders' equity.<\u002Fli>\n              <li>How did performance affect equity? Net income, from the income statement, flows into retained earnings.<\u002Fli>\n            <\u002Ful>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">The retained earnings bridge<\u002Fdiv><div class=\"card-body\">Beginning retained earnings + net income (or − net loss) − dividends = ending retained earnings. This single line ties the income statement to the balance sheet, in every period, in every company.<\u002Fdiv><\u002Fdiv>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">What the balance sheet contains<\u002Fh2>\n            <p><strong>Assets<\u002Fstrong> are resources expected to provide future economic benefits. To be capitalised, the company must own or control the asset — legal title or an unrestricted right to use it — and the expected benefit must be measurable in money. Companies acquire assets to generate revenue, directly by selling inventory or indirectly by producing it; income above the cost of the funds used to acquire them is what creates shareholder value.<\u002Fp>\n            <p>Assets are split by whether they will be converted to cash or used up within a year.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Current assets<\u002Fsc-raw-th><sc-raw-th>Noncurrent assets<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Cash and cash equivalents<\u002Fsc-raw-td><sc-raw-td>Long-term financial investments<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Marketable securities<\u002Fsc-raw-td><sc-raw-td>Property, plant and equipment<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Accounts receivable<\u002Fsc-raw-td><sc-raw-td>Intangibles: patents, trademarks, franchise rights, goodwill<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Inventory<\u002Fsc-raw-td><sc-raw-td>Other long-term assets<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Prepaid expenses<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Assets intended for use are reported at historical cost: reliable, and often well below what they are worth. Marketable securities are the standard exception, carried at fair value from real-time market quotes.<\u002Fp>\n            <p><strong>Liabilities<\u002Fstrong> are recognised when three conditions hold together: the future sacrifice is probable, the amount is known or reasonably estimable, and the transaction that caused the obligation has already happened. Settlement may be cash or the delivery of goods and services.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Current liabilities<\u002Fsc-raw-th><sc-raw-th>Noncurrent liabilities<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Accounts payable<\u002Fsc-raw-td><sc-raw-td>Long-term debt<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Accrued liabilities<\u002Fsc-raw-td><sc-raw-td>Warranty and deferred compensation liabilities<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Short-term borrowings<\u002Fsc-raw-td><sc-raw-td>Long-term tax liabilities<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Deferred (unearned) revenue<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Current maturities of long-term debt<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Watch that last line. A twenty-year bond with a payment due next year has that payment sitting in current liabilities — which is where liquidity crises show up first.<\u002Fp>\n            <p><strong>Equity<\u002Fstrong> is what owners provided plus what the business has earned and kept. Contributed capital covers common stock, additional paid-in capital above par, and treasury stock as a deduction. Earned capital is retained earnings and accumulated other comprehensive income.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Two ratios to start with<\u002Fh2>\n            <p>Profitability asks whether the company can bring its product to market efficiently and whether the market values it. Return on equity — net income over average stockholders' equity — is the headline measure.<\u002Fp>\n            <p>Solvency asks whether the company can stay in business. The debt-to-equity ratio — total liabilities over total equity — is the standard risk measure: liabilities of 23,287 against equity of 8,055 gives 2.9, so nearly three units of creditor financing sit behind every unit of owner financing. Watch the direction of travel more than the level.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Beyond the statements<\u002Fh2>\n            <p>The four statements are the smallest part of an annual report. Management discussion and analysis, the independent auditor's report, the footnotes and other regulatory filings carry far more detail — and usually the answer to whatever the statements made you wonder about.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF2 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">Bookkeeping is one notebook with two columns. Every event gets written twice — once in each column — so the totals always agree, and any mistake shows up as a mismatch. \"Debit\" just means the left column and \"credit\" the right one. Neither is good or bad news.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Account<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>One line item's own running record — cash, or wages, or one supplier.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Journal<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The diary: every event in date order.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Ledger<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The filing cabinet: every event sorted by account.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Debit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>An entry in the left column.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Credit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>An entry in the right column.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Adjusting entry<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A period-end correction for something that happened without any money moving.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Closing<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Resetting the income accounts to zero so the next period starts clean.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>Bookkeeping looks intimidating and is mostly one trick: every event is written down twice, once in a left column and once in a right column, for the same amount. If the two columns ever disagree, something was recorded wrong. That is the whole point of the system.<\u002Fp>\n            <p>The left column is called <strong>debit<\u002Fstrong> and the right column <strong>credit<\u002Fstrong>. They are directions, not good and bad news. Learn this table and most entries write themselves:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Type of account<\u002Fsc-raw-th><sc-raw-th>Goes UP with<\u002Fsc-raw-th><sc-raw-th>Goes DOWN with<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Things you have (assets)<\u002Fsc-raw-td><sc-raw-td>Debit (left)<\u002Fsc-raw-td><sc-raw-td>Credit (right)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Costs (expenses)<\u002Fsc-raw-td><sc-raw-td>Debit (left)<\u002Fsc-raw-td><sc-raw-td>Credit (right)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Things you owe (liabilities)<\u002Fsc-raw-td><sc-raw-td>Credit (right)<\u002Fsc-raw-td><sc-raw-td>Debit (left)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Owners’ slice (equity)<\u002Fsc-raw-td><sc-raw-td>Credit (right)<\u002Fsc-raw-td><sc-raw-td>Debit (left)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Sales (revenue)<\u002Fsc-raw-td><sc-raw-td>Credit (right)<\u002Fsc-raw-td><sc-raw-td>Debit (left)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>Three examples, using a juice shop:<\u002Fp>\n            <ol style=\"padding-left:20px\">\n              <li>Owners put in 10,000 cash. Cash goes up, so debit cash 10,000. The owners’ slice goes up, so credit common stock 10,000.<\u002Fli>\n              <li>You pay 900 for advertising. A cost went up, so debit advertising expense 900. Cash went down, so credit cash 900.<\u002Fli>\n              <li>You sell drinks for 2,400 that cost you 600. Two entries: debit cash 2,400 and credit sales 2,400; then debit cost of goods sold 600 and credit inventory 600.<\u002Fli>\n            <\u002Fol>\n            <p>Notice the third one. A sale is always two entries, because the money coming in and the goods going out are two separate facts.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">At period end you also record things that happened without any money moving — a month of insurance used up, wages earned but unpaid, interest building on a loan. These are called adjusting entries.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">The rule<\u002Fh2>\n            <p>Accrual accounting, required by both IFRS and US GAAP: recognise revenue when it is earned, and match expenses against the revenue they helped produce. Cash timing is a separate question, answered by a separate statement.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Debits and credits<\u002Fh2>\n            <p>An account is a record of increases and decreases in one asset, liability, equity, revenue or expense item. Drawn as a T, debits sit on the left and credits on the right. Double-entry accounting requires debits to equal credits on every transaction, which is the mechanism that keeps the accounting equation true.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Account type<\u002Fsc-raw-th><sc-raw-th>Increased by<\u002Fsc-raw-th><sc-raw-th>Decreased by<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Assets<\u002Fsc-raw-td><sc-raw-td>Debit<\u002Fsc-raw-td><sc-raw-td>Credit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Liabilities<\u002Fsc-raw-td><sc-raw-td>Credit<\u002Fsc-raw-td><sc-raw-td>Debit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Equity<\u002Fsc-raw-td><sc-raw-td>Credit<\u002Fsc-raw-td><sc-raw-td>Debit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Revenues<\u002Fsc-raw-td><sc-raw-td>Credit<\u002Fsc-raw-td><sc-raw-td>Debit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Expenses<\u002Fsc-raw-td><sc-raw-td>Debit<\u002Fsc-raw-td><sc-raw-td>Credit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">\"Debit\" and \"credit\" carry no judgment. They are directions, not good news and bad news.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Accounts and the ledger<\u002Fh2>\n            <p>An account is a record of increases and decreases in one item. The chart of accounts lists every account title and code the company uses. Transaction analysis then asks two questions of every event: which accounts are affected — at least two, always — and in which direction, by how much.<\u002Fp>\n            <p>The general journal is the chronological record, in debit and credit form. Posting copies those entries into the ledger accounts, drawn as T-accounts, where each side accumulates and the difference is the balance. The expanded accounting equation shows what the equity side is really made of: common stock and revenues increase it; dividends and expenses decrease it.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">A full month of entries<\u002Fh2>\n            <p>A juice startup, May. Debits first, credits indented — the convention that makes an entry readable at a glance.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Transaction<\u002Fsc-raw-th><sc-raw-th>Debit<\u002Fsc-raw-th><sc-raw-th>Credit<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Investors contribute 10,000 for 500 shares<\u002Fsc-raw-td><sc-raw-td>Cash 10,000<\u002Fsc-raw-td><sc-raw-td>Common stock 10,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Borrows 4,000 on a one-month note, 40 of interest<\u002Fsc-raw-td><sc-raw-td>Cash 4,000<\u002Fsc-raw-td><sc-raw-td>Notes payable 4,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Pays a 1,800 security deposit on the store<\u002Fsc-raw-td><sc-raw-td>Security deposit 1,800<\u002Fsc-raw-td><sc-raw-td>Cash 1,800<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Buys 2,000 of inventory on account<\u002Fsc-raw-td><sc-raw-td>Inventory 2,000<\u002Fsc-raw-td><sc-raw-td>Accounts payable 2,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>Pays 900 for newspaper advertising<\u002Fsc-raw-td><sc-raw-td>Advertising expense 900<\u002Fsc-raw-td><sc-raw-td>Cash 900<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>Pays 1,500 of the supplier balance<\u002Fsc-raw-td><sc-raw-td>Accounts payable 1,500<\u002Fsc-raw-td><sc-raw-td>Cash 1,500<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>Sells drinks costing 600 for 2,400 cash<\u002Fsc-raw-td><sc-raw-td>Cash 2,400 · COGS 600<\u002Fsc-raw-td><sc-raw-td>Sales 2,400 · Inventory 600<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>Sells drinks costing 700 for 2,900 on account<\u002Fsc-raw-td><sc-raw-td>Receivable 2,900 · COGS 700<\u002Fsc-raw-td><sc-raw-td>Sales 2,900 · Inventory 700<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>Pays 1,300 of wages<\u002Fsc-raw-td><sc-raw-td>Wage expense 1,300<\u002Fsc-raw-td><sc-raw-td>Cash 1,300<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td>Sells 300 of gift cards<\u002Fsc-raw-td><sc-raw-td>Cash 300<\u002Fsc-raw-td><sc-raw-td>Unearned revenue 300<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td>Collects 1,200 from credit customers<\u002Fsc-raw-td><sc-raw-td>Cash 1,200<\u002Fsc-raw-td><sc-raw-td>Accounts receivable 1,200<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>12<\u002Fsc-raw-td><sc-raw-td>Repays the note with 40 of interest<\u002Fsc-raw-td><sc-raw-td>Notes payable 4,000 · Interest expense 40<\u002Fsc-raw-td><sc-raw-td>Cash 4,040<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>13<\u002Fsc-raw-td><sc-raw-td>Pays 800 for a one-year insurance policy<\u002Fsc-raw-td><sc-raw-td>Prepaid insurance 800<\u002Fsc-raw-td><sc-raw-td>Cash 800<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>14<\u002Fsc-raw-td><sc-raw-td>Pays 700 of rent for May<\u002Fsc-raw-td><sc-raw-td>Rent expense 700<\u002Fsc-raw-td><sc-raw-td>Cash 700<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>15<\u002Fsc-raw-td><sc-raw-td>Pays 400 of dividends<\u002Fsc-raw-td><sc-raw-td>Retained earnings 400<\u002Fsc-raw-td><sc-raw-td>Cash 400<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Five of these repay attention. A sale takes two entries (7, 8) — revenue and the matched cost — because gross profit is a result, not a transaction. A security deposit (3) is an asset, not rent. Gift cards (10) bring in cash with no revenue. A collection (11) moves value between two assets and touches neither revenue nor income. And dividends (15) are debited straight to retained earnings, never to an expense.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">What the month produced<\u002Fh2>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Income statement, month ended 31 May<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\"><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Sales revenue<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">5,300<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Cost of goods sold<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(1,300)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Gross profit<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">4,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Wages, rent, advertising<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(2,900)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Operating income<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">1,100<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Interest expense<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">(40)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Net income<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\"><strong>1,060<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Interest sits below operating income because financing is not operations. Equity then reconciles: nothing at 30 April, plus 10,000 of stock issued, plus 1,060 of income, less 400 of dividends — 10,000 of contributed capital and 660 of earned capital, so 10,660 in total. And the balance sheet balances at 11,460 of assets against 800 of liabilities and 10,660 of equity.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Why period end needs adjustments<\u002Fh2>\n            <p>Some revenue is earned and some expense incurred with no cash event to trigger an entry. Nobody sends an invoice for a month of depreciation. So the ledger balances have to be reviewed before the statements are prepared.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Adjustment<\u002Fsc-raw-th><sc-raw-th>Example from the month<\u002Fsc-raw-th><sc-raw-th>Entry<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Prepaid expense expiring<\u002Fsc-raw-td><sc-raw-td>One month of the 800 annual insurance policy<\u002Fsc-raw-td><sc-raw-td>Insurance expense 67 / Prepaid insurance 67<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Depreciation<\u002Fsc-raw-td><sc-raw-td>Fixtures and equipment of 10,200 in service<\u002Fsc-raw-td><sc-raw-td>Depreciation expense / Accumulated depreciation<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Accrued expense<\u002Fsc-raw-td><sc-raw-td>Interest owed on the 12,000 note at 12%<\u002Fsc-raw-td><sc-raw-td>Interest expense 120 / Interest payable 120<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Unearned revenue earned<\u002Fsc-raw-td><sc-raw-td>One month of a 600 three-month membership<\u002Fsc-raw-td><sc-raw-td>Unearned revenue 200 / Sales revenue 200<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">The full cycle, in order: analyse the transaction, journalise it, post it to the ledger, adjust at period end, prepare the statements, then close the temporary accounts — revenues, expenses and dividends — into retained earnings so the next period starts from zero.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF3 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">Suppose you are paid up front to walk a dog every day for a month. You have the cash, but you have not earned it yet — you earn it a day at a time. This chapter is about when a sale counts as a sale, and what to do about customers who are slow to pay or never pay at all.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Performance obligation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A specific thing you promised the customer.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Transaction price<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What you expect to be paid in total.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Receivable<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>An IOU from a customer who has not paid yet.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Allowance<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Your estimate of the IOUs that will never be collected.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Bad debt expense<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The cost of building that estimate.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Percentage-of-completion<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Counting revenue on a long project as the work gets done.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>Two questions in this chapter. When does a sale count as a sale? And what do you do about customers who have not paid yet?<\u002Fp>\n            <p>Imagine you are paid 300 up front to walk a dog every day for three months. On day one you have the cash, but you have earned nothing. You earn 100 a month as you do the work. Until then the 300 is something you <em>owe<\u002Fem> — a service you still have to provide.<\u002Fp>\n            <p>That is the whole revenue standard in one story. The formal version has five steps: find the contract, list what you promised, work out the total price, split that price across the promises, and count revenue as you deliver each promise.<\u002Fp>\n            <p>Now the customers who owe you money. Those IOUs are called <strong>receivables<\u002Fstrong> and they are an asset. But some never get paid, so you estimate that share up front rather than waiting to be surprised:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Line<\u002Fsc-raw-th><sc-raw-th>Amount<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Customers owe you<\u002Fsc-raw-td><sc-raw-td>12,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Your estimate of what will never arrive<\u002Fsc-raw-td><sc-raw-td>(900)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td><strong>Reported on the balance sheet<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>11,100<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>The 900 estimate is charged as a cost the moment you make it. When a specific customer is finally written off, profit is untouched — you already took the hit.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">That 900 is a guess made by management. If receivables keep growing while the guess shrinks as a percentage, be suspicious.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Why revenue is the number to worry about<\u002Fh2>\n            <p>Revenue is the market's verdict on the product, so it is also the most tempting line to recognise early. Both standard setters converged on a single five-step model — IFRS 15 and ASC 606 — precisely because premature recognition was the most common form of accounting fraud.<\u002Fp>\n            <ol style=\"padding-left:20px\">\n              <li>Identify the contract with the customer. A contract need not be a legal document, but enforceable rights must exist.<\u002Fli>\n              <li>Identify the distinct performance obligations — what has been promised, separately.<\u002Fli>\n              <li>Determine the transaction price the seller expects to be entitled to.<\u002Fli>\n              <li>Allocate that price across the obligations, by stand-alone selling price.<\u002Fli>\n              <li>Recognise revenue as each obligation is satisfied.<\u002Fli>\n            <\u002Fol>\n            <p>A phone sold with 24 months of service for one price is the standard illustration: the handset obligation is satisfied on delivery, the service obligation over two years, so one payment produces two very different revenue patterns.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Long-term contracts<\u002Fh2>\n            <p>When a project spans periods, waiting until completion tells the reader nothing for years. Percentage-of-completion recognises revenue as the work is done, using costs incurred against total estimated costs. It requires a signed contract and reliable estimates.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>8,000,000 contract, 6,000,000 estimated cost<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Year 1<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Costs incurred<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">2,400,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Percentage complete<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">40%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Revenue recognised<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">3,200,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Gross profit<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">800,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">The completed-contract method reports the same total revenue and profit, later. Timing, again — and the estimate of total cost is the soft spot, because it sets the percentage.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Receivables and the risk of not being paid<\u002Fh2>\n            <p>Selling on credit creates an asset and a risk. Receivables are reported at net realisable value: gross receivables less an allowance for the amounts the company expects not to collect. The allowance is a contra asset, built by charging bad debt expense.<\u002Fp>\n            <p>So gross receivables of 12,000 with an allowance of 900 are reported as 11,100. When a specific customer is written off later, gross receivables and the allowance both fall and income is untouched — the hit was taken when the allowance was set.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">Where to look<\u002Fdiv><div class=\"card-body\">The allowance is an estimate, so it is a lever: under-provide and income rises now; over-provide and you bank a cushion for a weaker year. Track the allowance as a percentage of gross receivables across periods. If receivables are growing while that percentage softens, ask why.<\u002Fdiv><\u002Fdiv>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Operating versus non-operating income<\u002Fh2>\n            <p>The income statement separates the primary, repeatable transactions from everything else. Only the first group is a reasonable basis for forecasting, which is why analysts rebuild the statement before they project it.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF4 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">A shop buys the same product several times at different prices, then sells some of it. Which price does it say the sold items cost? The answer is a choice, and it changes reported profit — so the rules limit which choices you may make.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Inventory<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Goods bought or made, waiting to be sold.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>COGS<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cost of goods sold: what the items you sold had cost you.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Gross profit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Sales minus COGS.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>FIFO<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Assume the oldest goods sold first.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>LIFO<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Assume the newest sold first. Banned under IFRS.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Weighted average<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Treat every unit as costing the average.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Net realisable value<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What you could still get for it, after selling costs.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Write-down<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cutting the recorded value when goods are worth less than they cost.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>A shop buys the same product at different prices over time, then sells some of it. Which cost does it report for the ones sold? You cannot tell the units apart, so the rules let you pick an assumption — and the assumption changes reported profit.<\u002Fp>\n            <p>Tiny example. You buy two units at 4 and then one at 6, so you have spent 14 in total. You sell one unit for 10.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Assumption<\u002Fsc-raw-th><sc-raw-th>Cost of the one sold<\u002Fsc-raw-th><sc-raw-th>Profit<\u002Fsc-raw-th><sc-raw-th>Value of the two left<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>FIFO — oldest sold first<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>10<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Average — everything costs 14/3 = 4.67<\u002Fsc-raw-td><sc-raw-td>4.67<\u002Fsc-raw-td><sc-raw-td>5.33<\u002Fsc-raw-td><sc-raw-td>9.33<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>LIFO — newest sold first (banned under IFRS)<\u002Fsc-raw-td><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>8<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>Look at the pattern: whatever you charge to cost of sales, the rest stays on the balance sheet. Profit and inventory always move in opposite directions, because the 14 has to go somewhere.<\u002Fp>\n            <p>One more rule. If goods are now worth less than you paid — out of fashion, past their date — you cut their recorded value immediately and take the loss now. You never write them up above what you paid.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">When prices are rising, FIFO reports the highest profit and the highest inventory. Same shop, same sales, different assumption.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Three ways a cost becomes an expense<\u002Fh2>\n            <ul style=\"padding-left:20px\">\n              <li><strong>Direct association<\u002Fstrong> — the cost attaches to a specific sale. Inventory sits on the balance sheet and becomes cost of goods sold in the period the goods sell.<\u002Fli>\n              <li><strong>Systematic allocation<\u002Fstrong> — the cost benefits several periods but no particular sale, so it is spread. Depreciation and amortisation.<\u002Fli>\n              <li><strong>Immediate recognition<\u002Fstrong> — the cost cannot be tied to any period's revenue, so it is expensed now. Advertising, research, most administration.<\u002Fli>\n            <\u002Ful>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">What goes into inventory cost<\u002Fh2>\n            <p>Everything spent to acquire the goods and get them ready to sell: purchase price, freight-in, import duties, preparation. Costs of selling and distributing are period expenses. For a manufacturer, inventory absorbs raw materials, direct labour and manufacturing overhead, and moves through raw materials to work in process to finished goods.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Cost flow assumptions<\u002Fh2>\n            <p>Physical units are usually interchangeable, so the rules let you assume a cost flow. Take 100 units at 4.00 in opening inventory, a purchase of 100 units at 4.80, and 160 units sold — 880 of cost to split between 40 units left and 160 units sold.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Method<\u002Fsc-raw-th><sc-raw-th>Assumption<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">COGS<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Ending inventory<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>FIFO<\u002Fsc-raw-td><sc-raw-td>Oldest units sold first<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">688<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">192<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Weighted average<\u002Fsc-raw-td><sc-raw-td>All units cost 4.40<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">704<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">176<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>LIFO<\u002Fsc-raw-td><sc-raw-td>Newest units sold first<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">720<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right\">160<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">With costs rising, FIFO charges the cheap old units to COGS and leaves the expensive ones on the balance sheet: higher profit, higher inventory. LIFO does the reverse — lower profit, and in the US, lower tax, which is why it survives there. <strong>LIFO is not permitted under IFRS.<\u002Fstrong> Note also that ending inventory and COGS always move in opposite directions: the total cost is fixed.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Writing inventory down<\u002Fh2>\n            <p>Inventory is carried at the lower of cost and net realisable value. If goods carried at 500 can now only fetch 380 net of selling costs, the 120 is recognised as a loss now — assets and income both fall. Under IFRS a later recovery may reverse the write-down, but never above original cost.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">Analysis<\u002Fdiv><div class=\"card-body\">Inventory growing faster than sales, with turnover falling, is one of the more reliable early warnings in financial statements. Unsold goods tie up cash and usually end in a markdown that hits gross margin one or two periods later.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF5 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">You buy a van you will use for five years of deliveries. Charging the whole price against this month would make this month look terrible and the next fifty-nine look great. So the cost goes on the list of things owned, and a slice of it is charged each period. That slice is depreciation.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Capital expenditure<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Money spent on something long-lasting.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Useful life<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>How long the company expects to get benefit from it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Residual value<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What it should be worth at the end.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Straight line<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The same charge every year.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Accelerated<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Bigger charges early, smaller later.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Book value<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Original cost minus everything charged so far.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Impairment<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>An extra cut when the asset turns out to be worth much less.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>You buy a van for 6,000 and expect to use it for three years. Charging the whole 6,000 against this month’s profit would be nonsense: the van will earn money for three years. So the van goes on the list of things you own, and each year you charge a slice of its cost. The slice is called <strong>depreciation<\u002Fstrong>.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Year<\u002Fsc-raw-th><sc-raw-th>Charged to profit<\u002Fsc-raw-th><sc-raw-th>Value still on the balance sheet<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>2,000<\u002Fsc-raw-td><sc-raw-td>4,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>2,000<\u002Fsc-raw-td><sc-raw-td>2,000<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>2,000<\u002Fsc-raw-td><sc-raw-td>0<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>Two judgments make that table: how long you will use it (useful life) and what it will be worth at the end (residual value). Both are estimates, and both can be revised later — but only going forward. You never rewrite last year.<\u002Fp>\n            <p>There is more than one way to spread the cost. Equal slices every year is the straight-line method. Bigger slices early and smaller later is an accelerated method. Charging by use — cost per mile driven — is the units-of-production method. All three charge the same total over the life of the asset; only the pattern differs.<\u002Fp>\n            <p>When you sell it, compare the price you get with the value still on your books. More means a gain, less means a loss. And if an asset suddenly turns out to be worth far less than its remaining book value, you cut it down now — an <strong>impairment<\u002Fstrong>.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Depreciation is not money leaving. The cash left when you bought the van. Depreciation just spreads that cost across the years that use it.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">What long-term operating assets have in common<\u002Fh2>\n            <p>They are acquired to produce and deliver the products that generate revenue, and they help produce it over several periods. Tangible assets have physical substance — land, buildings, machinery, equipment. Intangibles have none, and instead confer rights: patents, trademarks, copyrights.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">What gets capitalised<\u002Fh2>\n            <p>All costs necessary to acquire the asset and prepare it for its intended use: purchase price, shipping, installation, taxes, legal fees, setup and calibration, and asset retirement obligations. Two conditions govern the decision — future economic benefits must be probable, and cost must be measurable — and capitalised cost can never exceed the benefits expected.<\u002Fp>\n            <p>For assets a company builds for itself, capitalise direct materials and labour, a reasonable share of overhead, and interest on debt raised to finance the construction, during construction only.<\u002Fp>\n            <p>After the asset is in service the test is whether the spending extends its life or usefulness beyond the original expectation. Improvements are capitalised; routine repairs and maintenance are expensed as incurred.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Depreciation<\u002Fh2>\n            <p>Depreciation allocates cost systematically to expense over the periods the asset helps produce revenue — moving cost from the balance sheet to the income statement. It is not a valuation exercise and it is not a cash flow. Two estimates are required: useful life (economic, not physical) and residual value.<\u002Fp>\n            <p>Accumulated depreciation is a contra asset that grows over time; cost less accumulated depreciation is book value. A truck at 80,000 with 12,000 of accumulated depreciation is reported net at 68,000.<\u002Fp>\n            <p>Take a truck costing 80,000, five-year life, 8,000 residual, so a depreciable base of 72,000:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Method<\u002Fsc-raw-th><sc-raw-th>Year 1 charge<\u002Fsc-raw-th><sc-raw-th>Basis<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Straight line<\u002Fsc-raw-td><sc-raw-td>14,400<\u002Fsc-raw-td><sc-raw-td>72,000 × 1/5 — equal each year<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Double declining balance<\u002Fsc-raw-td><sc-raw-td>32,000<\u002Fsc-raw-td><sc-raw-td>Book value × 2 × 20%; accelerated, and residual is only a floor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Units of production<\u002Fsc-raw-td><sc-raw-td>16,200<\u002Fsc-raw-td><sc-raw-td>0.90 per mile × 18,000 miles driven<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Total depreciation over the asset's life is identical under all three; only the pattern differs. Accelerated methods lower early profit and raise later profit.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Changing an estimate<\u002Fh2>\n            <p>Estimates can be revised, and revisions apply prospectively — prior years are never restated. Extend the truck's life from five to seven years after four years of straight-line depreciation: book value is 80,000 − 57,600 = 22,400, remaining life is 5 − 4 + 2 = 3 years, so year 5 depreciation is (22,400 − 8,000) / 3 = 4,800.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Disposals and impairment<\u002Fh2>\n            <p>Sale proceeds above book value give a gain, below it a loss, reported within income from continuing operations but non-recurring in nature. Selling that truck for 25,000 against book value of 22,400 gives a 2,600 gain.<\u002Fp>\n            <p>When an asset's recoverable amount falls materially below book value, an impairment loss is recognised immediately. Note the second-order effect: a write-down reduces future depreciation, so it flatters the margins of the years that follow.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF6 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">Liabilities are the company's promises. Some are certain and precise — an invoice due in thirty days. Some are estimates — the repairs you will owe under warranty. Some are maybe — a lawsuit you might lose. The rules treat those three very differently, and this chapter is where the line sits.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Accounts payable<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Money owed to suppliers. Usually interest-free.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Accrued liability<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A cost already incurred but not yet paid, like unpaid wages.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Deferred revenue<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cash taken for something not yet delivered.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Provision<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>An estimated obligation you are more likely than not to pay.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Contingent liability<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A possible obligation. Mentioned in the notes, not counted.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>2/10, n/30<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Pay in 10 days for 2% off, otherwise pay in full within 30.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>Liabilities are promises the company has made. There are three kinds, and the difference between them is how sure you are:<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Kind of promise<\u002Fsc-raw-th><sc-raw-th>Example<\u002Fsc-raw-th><sc-raw-th>What you do<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Certain<\u002Fsc-raw-td><sc-raw-td>An invoice for 800, due in 30 days<\u002Fsc-raw-td><sc-raw-td>Record it as a liability<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Estimated<\u002Fsc-raw-td><sc-raw-td>Repairs you will owe under warranty<\u002Fsc-raw-td><sc-raw-td>Estimate it and record it now<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Possible<\u002Fsc-raw-td><sc-raw-td>A lawsuit you might lose<\u002Fsc-raw-td><sc-raw-td>Only mention it in the notes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>The test for recording is: do you probably owe something, from something that has already happened, and can you put a number on it? Fail any part and it stays out of the balance sheet.<\u002Fp>\n            <p>Warranties show the logic best. You sell bikes and expect 2,000 of future repairs. You record the 2,000 as a cost <em>now<\u002Fem>, in the same period as the sale that caused it, and set up a 2,000 liability. When you later spend 400 fixing bikes, that is not a new cost — it just draws the liability down to 1,600.<\u002Fp>\n            <p>Also learn one piece of jargon you will see everywhere: <strong>2/10, n/30<\u002Fstrong>. It means pay within 10 days and take 2% off, otherwise pay the full amount within 30 days. Skipping that discount is expensive borrowing, and the amount lost is recorded as interest, not as extra inventory.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Because estimates are involved, liabilities are where profit gets quietly shifted between years. Under-estimate today, and today’s profit looks better.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Sources and uses<\u002Fh2>\n            <p>Assets are the uses of funds — the investments management has made. Liabilities and equity are the sources. Financial leverage rises whenever assets are funded with liabilities rather than equity.<\u002Fp>\n            <p>Current liabilities fall due within a year and are often non-interest-bearing, so companies stretch them where they can. Long-term liabilities usually carry interest, and the sensible strategy is to match the life of the funding to the life of the asset it finances.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Trade payables and cash discounts<\u002Fh2>\n            <p>Payables arise from buying goods or services on credit. They are free financing: inventory arrives now and is paid for later, with no interest charge. Increasing payables improves operating cash flow and leaves profitability untouched, while reducing net working capital.<\u002Fp>\n            <p>Credit terms often include a discount. \"2/10, n/30\" means 2% off if paid within ten days, otherwise the full amount in thirty. Under the net-of-discount method a 160 purchase is capitalised at 156.80. Pay late and the extra 3.20 is recorded as interest expense — discounts lost — rather than as more inventory. Annualise that 2% for twenty days and it is expensive money.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Accrued liabilities<\u002Fh2>\n            <p>Expenses incurred but not yet paid: wages, vacation pay, interest, taxes, rent, utilities, warranties. Each creates a liability and an expense simultaneously.<\u002Fp>\n            <div class=\"card\" style=\"margin:16px 0\"><div class=\"card-kicker\">The lever<\u002Fdiv><div class=\"card-body\">Because accruals are estimates, management can shift income between periods with them. Underestimating accruals understates liabilities and expenses, which overstates income and retained earnings. The shortfall does not disappear; it lands in a later period.<\u002Fdiv><\u002Fdiv>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Provisions, warranties, contingencies<\u002Fh2>\n            <p>Not every obligation is certain. A provision is recognised when an outflow is probable — at least around a 50% chance — and the amount is reasonably estimable, measured at the most likely amount. Lawsuits, warranty claims and restructuring programmes are the usual cases.<\u002Fp>\n            <p>Warranties show the mechanics cleanly. Estimate 2,000 of warranty cost at the time of sale: expense 2,000, liability 2,000, matched against the revenue that created the obligation. Later repairs of 400 draw the liability down to 1,600 and are not an expense of that later period.<\u002Fp>\n            <p>A contingent liability — a potential obligation dependent on an uncertain future event, or a present obligation that is neither probable nor reliably measurable — is not recognised on the balance sheet. If material, it is disclosed in the notes.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Short-term debt<\u002Fh2>\n            <p>Typically a bank line of credit evidenced by an interest-bearing note, reported as a current liability. Borrowing itself has no effect on income or equity; interest accrues with time. Borrow 3,000 at 6% on 1 January and by 31 March you have accrued 3,000 × 6% × 3/12 = 45.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF7 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">Equity is the owners' slice of the business: the money they put in, plus the profit the company has kept rather than paid out. This chapter covers how that slice is issued, bought back and paid out — and why splitting shares changes nothing real, like cutting a pizza into more pieces.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Common stock<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Ordinary shares. They vote.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Par value<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A legal number printed on a share. Almost meaningless.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Paid-in capital<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What shareholders paid above par.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Treasury stock<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Shares the company bought back from investors.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Retained earnings<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Profits kept in the business over its whole life.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Preferred stock<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Shares paid first, usually without votes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Stock split<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>More shares, each worth proportionally less.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>Equity is the owners’ slice. It has exactly two sources: money the owners put in, and profit the company earned and kept.<\u002Fp>\n            <p>A lemonade stand: owners put in 100, it earns 30, it pays 10 back to them. Equity is 100 + 30 − 10 = 120. Split it the way accountants do — 100 of contributed capital, 20 of retained earnings.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Term you will see<\u002Fsc-raw-th><sc-raw-th>Plain meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Common stock<\u002Fsc-raw-td><sc-raw-td>Ordinary shares. They vote.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Par value<\u002Fsc-raw-td><sc-raw-td>A legal number printed on the share. Ignore it economically.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Additional paid-in capital<\u002Fsc-raw-td><sc-raw-td>Everything shareholders paid above that number.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Retained earnings<\u002Fsc-raw-td><sc-raw-td>Profit kept in the business over its whole life.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Treasury stock<\u002Fsc-raw-td><sc-raw-td>Shares the company bought back.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Preferred stock<\u002Fsc-raw-td><sc-raw-td>Shares paid before ordinary ones, usually with no vote.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>Issue 500 shares with a par value of 1 for 15 each: cash goes up 7,500, common stock 500, and the other 7,000 is additional paid-in capital. Issuing shares is never revenue — nothing was sold to a customer.<\u002Fp>\n            <p>Two things that look dramatic and change nothing real. A <strong>stock split<\u002Fstrong> gives everyone more shares, each worth proportionally less: the same pizza in more slices. A <strong>buyback<\u002Fstrong> uses cash to reduce the number of shares; the company can never report a profit from trading in itself.<\u002Fp>\n            <div class=\"card\" style=\"margin:20px 0\"><div class=\"card-kicker\">One thing to remember<\u002Fdiv><div class=\"card-body\">Dividends are not a cost. They come out of retained earnings, so they never touch profit.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showStd }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Two halves of equity<\u002Fh2>\n            <p>Contributed capital is the cumulative cash shareholders paid in for shares, less what has been paid back out to repurchase them. Earned capital is retained earnings — cumulative profits less dividends ever paid — plus accumulated other comprehensive income. If losses exceed cumulative profits, retained earnings becomes an accumulated deficit.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Counting shares<\u002Fh2>\n            <p>Authorised shares are the legal maximum. Issued shares are those actually sold. Outstanding shares are issued less treasury shares, and they are the ones that vote, receive dividends, and form the denominator of earnings per share.<\u002Fp>\n            <p>Par value is an arbitrary legal amount per share with essentially no economic meaning. Issue 500 shares of 1 par at 15: cash 7,500, common stock at par 500, additional paid-in capital 7,000. Share issues never create revenue.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Preferred stock<\u002Fh2>\n            <p>Preferred shares carry priority over common — usually a fixed dividend paid first, and a preference in liquidation — generally without voting rights. Cumulative preferred means unpaid dividends accumulate and must be settled before any common dividend; arrears are disclosed rather than recognised until declared. A call feature lets the issuer repurchase at a set price. Economically, preferred sits between debt and equity.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Buybacks<\u002Fh2>\n            <p>A company buying its own shares reduces cash, equity and share count. Treasury transactions never produce a gain or loss in income: any difference between repurchase cost and reissue proceeds is recorded within equity. A company cannot report a profit from trading in itself.<\u002Fp>\n\n            <h2 style=\"margin-top:32px; font-size:24px\">Distributions<\u002Fh2>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Event<\u002Fsc-raw-th><sc-raw-th>Effect<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>Cash dividend of 780 paid<\u002Fsc-raw-td><sc-raw-td>Retained earnings −780, cash −780. Never an expense.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Dividend declared, not yet paid<\u002Fsc-raw-td><sc-raw-td>Retained earnings −780, dividend payable +780.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Stock dividend<\u002Fsc-raw-td><sc-raw-td>Amount moved out of retained earnings into contributed capital. Total equity unchanged.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Two-for-one split<\u002Fsc-raw-td><sc-raw-td>Share count doubles, par halves. Nothing else changes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p style=\"margin-top:12px\">Splits and stock dividends hand shareholders more paper and no more value. The economics of a cash dividend and a buyback are closer than they look: both return cash, one to everyone and one to those who sell.<\u002Fp>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isF8 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:72ch\">\n            <div style=\"border:2px solid var(--color-divider); padding:18px 20px; margin-top:28px; background:var(--color-surface)\">\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--color-accent-700)\">In plain words<\u002Fdiv>\n              <p style=\"margin:8px 0 0; font-size:16px\">If you own a few shares in another company you are a passenger. If you own most of it, you are driving. The accounting changes with how much say you have — from simply marking your stake at market value, to reporting the other company's entire business as part of your own.<\u002Fp>\n              <div style=\"font-size:11px; letter-spacing:0.09em; text-transform:uppercase; margin-top:20px\">Words you will hear<\u002Fdiv>\n              <sc-raw-table class=\"table\" style=\"margin-top:6px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Passive stake<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A small holding with no influence.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Associate<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A company you influence but do not control. Roughly 20–50%.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Subsidiary<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A company you control. Usually more than 50%.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Equity method<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Report your share of the other company's profit.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Consolidation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Report all of the subsidiary's numbers as yours.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Non-controlling interest<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The part of a subsidiary you do not own.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"width:34%\"><strong>Fair value hierarchy<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>How trustworthy a valuation is: market price, similar price, or a model.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showBeg }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n            <h2 style=\"margin-top:32px; font-size:24px\">Start here<\u002Fh2>\n            <p>When a company owns shares in another company, the accounting depends on one thing only: how much say it has. Think of it as passenger, back-seat driver, or driver.<\u002Fp>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>How much you own<\u002Fsc-raw-th><sc-raw-th>Your role<\u002Fsc-raw-th><sc-raw-th>How you report it<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td>A few per cent<\u002Fsc-raw-td><sc-raw-td>Passenger<\u002Fsc-raw-td><sc-raw-td>Just show the stake at market value<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>Around 20–50%<\u002Fsc-raw-td><sc-raw-td>Back-seat driver (an associate)<\u002Fsc-raw-td><sc-raw-td>Add your share of their profit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td>More than half<\u002Fsc-raw-td><sc-raw-td>Driver (a subsidiary)<\u002Fsc-raw-td><sc-raw-td>Report all of their numbers as your own<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n            <p>The middle one, the <strong>equity method<\u002Fstrong>, in numbers. You own 30% of a company, and your stake sits on your books at 1,000. They earn 200, so you add your 30% — 60 — to both your profit and the value of your stake. They pay out 50 of dividends, so you receive 15 and reduce the stake by that much, because that value has now been handed to you. The stake ends at 1,045.<\u002Fp>\n            <p>The last one, <strong>consolidation<\u002Fstrong>, surprises people: you report 100% of the subsidiary’s sales and costs, then show the part you do not own as “non-controlling interest”. So two companies with identical economics can show very different revenue, purely because one owns 51% and the other 49%.<\
