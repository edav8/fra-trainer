ng ' + left + ' units.',\n          steps: [\n            { t: 'fill', p: 'Step 1. The pool of cost to divide up.', rows: [\n              { l: 'Cost of opening inventory', a: u1 * p1, tol: 1, w: u1 + ' × ' + c.money(p1) + '.' },\n              { l: 'Cost of purchases', a: u2 * p2, tol: 1, w: u2 + ' × ' + c.money(p2) + '.' },\n              { l: 'Total cost available for sale', a: total, tol: 1, w: 'Every method splits this same amount between cost of goods sold and closing inventory.' }\n            ], e: 'Because the pool is fixed, profit and closing inventory always move in opposite directions.' },\n            { t: 'fill', p: 'Step 2. FIFO and LIFO.', rows: [\n              { l: 'FIFO: ending inventory', a: fifoEnd, tol: 1, w: 'Oldest sold first, so the ' + left + ' units left are the newest.' },\n              { l: 'FIFO: cost of goods sold', a: total - fifoEnd, tol: 1, w: 'Total ' + c.money(total) + ' − closing ' + c.money(fifoEnd) + '.' },\n              { l: 'LIFO: ending inventory', a: lifoEnd, tol: 1, w: 'Newest sold first, so what is left is the oldest and cheapest.' },\n              { l: 'LIFO: cost of goods sold', a: total - lifoEnd, tol: 1, w: 'Total ' + c.money(total) + ' − closing ' + c.money(lifoEnd) + '. LIFO is not permitted under IFRS.' }\n            ], e: 'No unit physically moved differently. Only the assumed cost flow changed.' },\n            { t: 'fill', p: 'Step 3. Weighted average, and the effect on the bottom line.', rows: [\n              { l: 'Average cost per unit', a: avg, tol: 0.03, w: c.money(total) + ' ÷ ' + (u1 + u2) + ' units.' },\n              { l: 'Average: cost of goods sold', a: avg * sold, tol: 3, w: sold + ' units × the average cost. Always between the FIFO and LIFO answers.' },\n              { l: 'FIFO gross profit', a: sold * price - (total - fifoEnd), tol: 3, w: 'Revenue ' + c.money(sold * price) + ' − FIFO cost of sales.' },\n              { l: 'LIFO gross profit', a: sold * price - (total - lifoEnd), tol: 3, w: 'Same revenue, higher cost of sales, so less reported profit.' }\n            ], e: 'With costs rising, FIFO always reports the higher profit and the higher inventory.' }\n          ]\n        };\n      }\n    },\n    {\n      key: 'g-rec', course: 'fra', title: 'Receivables and the allowance', ses: 'Chapter 4 · Revenues & Receivables', sub: 'Roll the balance forward on new numbers',\n      build: function (c) {\n        const open = c.rnd(8, 20, 1) * 1000;\n        const openAll = c.rnd(3, 8, 1) * 100;\n        const sales = c.rnd(30, 90, 5) * 1000;\n        const wo = c.rnd(2, 7, 1) * 100;\n        const coll = Math.round((sales * c.rnd(85, 97, 1) / 100) / 100) * 100;\n        const pct = c.rnd(2, 6, 1);\n        const closeGross = open + sales - coll - wo;\n        const reqAll = closeGross * pct / 100;\n        const before = openAll - wo;\n        return {\n          brief: 'Opening gross receivables ' + c.money(open) + ' with an allowance for uncollectible accounts of ' + c.money(openAll) + '. Credit sales for the year ' + c.money(sales) + '; cash collected from customers ' + c.money(coll) + '. One customer balance of ' + c.money(wo) + ' was written off. The company estimates ' + pct + '% of closing gross receivables will never be collected.',\n          steps: [\n            { t: 'fill', p: 'Step 1. Roll the gross balance forward.', rows: [\n              { l: 'Closing gross receivables', a: closeGross, tol: 1, w: c.money(open) + ' + ' + c.money(sales) + ' − ' + c.money(coll) + ' − ' + c.money(wo) + '. Sales add, collections and write-offs remove.' }\n            ], e: 'A write-off removes the gross balance and the allowance together, so it never touches profit.' },\n            { t: 'fill', p: 'Step 2. The allowance, and the expense that gets you there.', rows: [\n              { l: 'Required closing allowance', a: reqAll, tol: 1, w: pct + '% × ' + c.money(closeGross) + '.' },\n              { l: 'Allowance before adjustment', a: before, tol: 1, w: 'Opening ' + c.money(openAll) + ' − ' + c.money(wo) + ' used on the write-off.' },\n              { l: 'Bad debt expense for the year', a: reqAll - before, tol: 1, w: 'Only the top-up is charged: ' + c.money(reqAll) + ' − ' + c.money(before) + '.' }\n            ], e: 'Bad debt expense is the plug that brings the allowance to where management thinks it should be.' },\n            { t: 'fill', p: 'Step 3. What gets reported, and how fast customers pay.', rows: [\n              { l: 'Net accounts receivable', a: closeGross - reqAll, tol: 1, w: 'Gross ' + c.money(closeGross) + ' − allowance ' + c.money(reqAll) + ' = net realisable value.' },\n              { l: 'Receivables turnover (times)', a: sales / (closeGross - reqAll), tol: 0.15, w: 'Sales ' + c.money(sales) + ' ÷ net receivables.' },\n              { l: 'Days sales outstanding', a: 365 / (sales / (closeGross - reqAll)), tol: 3, w: '365 ÷ turnover.' }\n            ], e: 'Read the days against the allowance percentage: slowing collection with a shrinking allowance is a warning sign.' }\n          ]\n        };\n      }\n    },\n    {\n      key: 'g-cf', course: 'fra', title: 'Indirect cash flow statement', ses: 'Chapter 11 · Statement of Cash Flows', sub: 'Rebuild it from new balances',\n      build: function (c) {\n        const ni = c.rnd(200, 900, 20), dep = c.rnd(60, 260, 10), gain = c.rnd(0, 60, 10);\n        const ar = c.rnd(-80, 120, 10), inv = c.rnd(-80, 100, 10), ap = c.rnd(-60, 100, 10);\n        const bv = c.rnd(40, 200, 10), proceeds = bv + gain;\n        const capex = c.rnd(120, 500, 20), debt = c.rnd(0, 300, 50), div = c.rnd(0, 150, 10);\n        const open = c.rnd(100, 500, 10);\n        const wc = -ar + inv + ap;\n        const cfo = ni + dep - gain + wc;\n        const cfi = proceeds - capex;\n        const cff = debt - div;\n        return {\n          brief: 'Net income ' + c.money(ni) + '. Depreciation ' + c.money(dep) + '. Gain on sale of equipment ' + c.money(gain) + '. Receivables changed by ' + c.money(ar) + ', inventory by ' + c.money(inv) + ', payables by ' + c.money(ap) + ' (positive means the balance increased). Equipment with a book value of ' + c.money(bv) + ' was sold for ' + c.money(proceeds) + '. New equipment cost ' + c.money(capex) + '. Debt of ' + c.money(debt) + ' was issued and dividends of ' + c.money(div) + ' paid. Opening cash ' + c.money(open) + '.',\n          steps: [\n            { t: 'fill', p: 'Step 1. Cash from operations, starting at net income.', rows: [\n              { l: 'Add back depreciation', a: dep, tol: 1, w: 'It reduced profit but no cash left this period.' },\n              { l: 'Adjustment for the gain (minus sign)', a: -gain, tol: 1, w: 'Removed here because the full proceeds of ' + c.money(proceeds) + ' belong in investing.' },\n              { l: 'Net working capital effect', a: wc, tol: 1, w: 'An asset increase consumes cash, a liability increase provides it: ' + c.money(-ar) + ' + ' + c.money(inv) + ' + ' + c.money(ap) + '.' },\n              { l: 'Cash from operations', a: cfo, tol: 1, w: c.money(ni) + ' + ' + c.money(dep) + ' − ' + c.money(gain) + ' + ' + c.money(wc) + '.' }\n            ], e: 'Each adjustment answers one question: did this change profit without cash, or cash without profit?' },\n            { t: 'fill', p: 'Step 2. Investing and financing.', rows: [\n              { l: 'Cash from investing (minus sign if negative)', a: cfi, tol: 1, w: 'Proceeds ' + c.money(proceeds) + ' − capital expenditure ' + c.money(capex) + '.' },\n              { l: 'Cash from financing', a: cff, tol: 1, w: 'Debt issued ' + c.money(debt) + ' − dividends ' + c.money(div) + '.' }\n            ], e: 'The whole proceeds appear in investing, not just the gain.' },\n            { t: 'fill', p: 'Step 3. Tie back to the balance sheet.', rows: [\n              { l: 'Net change in cash', a: cfo + cfi + cff, tol: 1, w: 'The three sections added together.' },\n              { l: 'Closing cash', a: open + cfo + cfi + cff, tol: 1, w: 'Opening ' + c.money(open) + ' + the net change. This must equal the closing balance sheet figure.' }\n            ], e: 'That tie is the statement\\u2019s own proof that nothing was classified twice or missed.' }\n          ]\n        };\n      }\n    },\n    {\n      key: 'g-ratio', course: 'fra', title: 'Ratio disaggregation', ses: 'Chapter 12 · Ratio Analysis', sub: 'Take a new company apart',\n      build: function (c) {\n        const sales = c.rnd(8, 40, 1) * 1000;\n        const gm = c.rnd(25, 60, 5);\n        const cogs = sales * (100 - gm) / 100;\n        const ni = Math.round(sales * c.rnd(3, 12, 1) / 100);\n        const assets = Math.round(sales / c.rnd(0.8, 2.5, 0.1));\n        const equity = Math.round(assets * c.rnd(30, 70, 5) / 100);\n        const invAvg = Math.round(cogs / c.rnd(3, 12, 1));\n        const recAvg = Math.round(sales / c.rnd(4, 14, 1));\n        return {\n          brief: 'Sales ' + c.money(sales) + '; cost of goods sold ' + c.money(cogs) + '; net income ' + c.money(ni) + '. Average total assets ' + c.money(assets) + '; average shareholders\\u2019 equity ' + c.money(equity) + '; average inventory ' + c.money(invAvg) + '; average receivables ' + c.money(recAvg) + '.',\n          steps: [\n            { t: 'fill', p: 'Step 1. The headline returns, in per cent.', rows: [\n              { l: 'ROE (%)', a: ni / equity * 100, tol: 0.4, w: 'Net income ' + c.money(ni) + ' ÷ average equity ' + c.money(equity) + '.' },\n              { l: 'ROA (%)', a: ni / assets * 100, tol: 0.4, w: 'Net income ÷ average total assets ' + c.money(assets) + '.' },\n              { l: 'Return on financial leverage (points)', a: (ni / equity - ni / assets) * 100, tol: 0.4, w: 'ROE − ROA. The part of the owners\\u2019 return that came from borrowing.' }\n            ], e: 'The wider the gap, the more of the return depends on debt — and the harder it bites when returns fall.' },\n            { t: 'fill', p: 'Step 2. Break ROA into its two levers.', rows: [\n              { l: 'Profit margin (%)', a: ni / sales * 100, tol: 0.3, w: 'Net income ÷ sales.' },\n              { l: 'Asset turnover (times)', a: sales / assets, tol: 0.1, w: 'Sales ÷ average total assets.' },\n              { l: 'Gross profit margin (%)', a: (sales - cogs) / sales * 100, tol: 0.5, w: '(Sales − cost of goods sold) ÷ sales.' }\n            ], e: 'Margin × turnover = ROA. Check that your two answers multiply back to step 1.' },\n            { t: 'fill', p: 'Step 3. The turnover ratios underneath.', rows: [\n              { l: 'Inventory turnover (times)', a: cogs / invAvg, tol: 0.2, w: 'Cost of goods sold ÷ average inventory — cost against cost.' },\n              { l: 'Days inventory held', a: 365 / (cogs / invAvg), tol: 4, w: '365 ÷ turnover.' },\n              { l: 'Receivables turnover (times)', a: sales / recAvg, tol: 0.2, w: 'Sales ÷ average receivables — both at selling prices.' },\n              { l: 'Days sales outstanding', a: 365 / (sales / recAvg), tol: 4, w: '365 ÷ turnover.' }\n            ], e: 'The two day counts together tell you how long cash is tied up in the working capital cycle.' }\n          ]\n        };\n      }\n    },\n    {\n      key: 'g-je', course: 'fra', title: 'Journal entries', ses: 'Chapters 2–3 · Journal Entries', sub: 'Same transactions, new amounts',\n      build: function (c) {\n        const cap = c.rnd(5, 30, 1) * 1000;\n        const inv = c.rnd(1, 6, 1) * 500;\n        const cost = c.rnd(2, 8, 1) * 100;\n        const price = cost * c.rnd(2, 4, 1);\n        const wage = c.rnd(4, 20, 1) * 100;\n        const note = c.rnd(2, 10, 1) * 1000;\n        const rate = c.rnd(4, 10, 1);\n        const interest = Math.round(note * rate / 100 / 12);\n        const div = c.rnd(1, 8, 1) * 100;\n        return {\n          accounts: ['Cash', 'Accounts receivable', 'Inventory', 'Accounts payable', 'Notes payable', 'Unearned revenue', 'Common stock', 'Retained earnings', 'Sales revenue', 'Cost of goods sold', 'Wage expense', 'Interest expense'],\n          brief: 'Record each transaction. Choose the side (Dr or Cr), the account and the amount for every line. Debits increase assets and expenses; credits increase liabilities, equity and revenue.',\n          steps: [\n            { t: 'entry', p: 'Investors contribute ' + c.money(cap) + ' cash for shares.', rows: [{ s: 'Dr', a: 'Cash', v: cap }, { s: 'Cr', a: 'Common stock', v: cap }], e: 'Cash in is a debit; the owners\\u2019 claim rises, which is a credit. Never revenue.' },\n            { t: 'entry', p: 'The company buys ' + c.money(inv) + ' of inventory on account.', rows: [{ s: 'Dr', a: 'Inventory', v: inv }, { s: 'Cr', a: 'Accounts payable', v: inv }], e: 'Asset up, liability up, no cash movement at all.' },\n            { t: 'entry', p: 'It sells goods costing ' + c.money(cost) + ' for ' + c.money(price) + ' on credit. All four lines.', rows: [{ s: 'Dr', a: 'Accounts receivable', v: price }, { s: 'Cr', a: 'Sales revenue', v: price }, { s: 'Dr', a: 'Cost of goods sold', v: cost }, { s: 'Cr', a: 'Inventory', v: cost }], e: 'Two facts, two entries. Gross profit of ' + c.money(price - cost) + ' is a result, not an entry.' },\n            { t: 'entry', p: 'It pays ' + c.money(wage) + ' of wages.', rows: [{ s: 'Dr', a: 'Wage expense', v: wage }, { s: 'Cr', a: 'Cash', v: wage }], e: 'A cost consumed in the period, so it hits the income statement immediately.' },\n            { t: 'entry', p: 'It repays a ' + c.money(note) + ' note with ' + c.money(interest) + ' of interest (one month at ' + rate + '% a year).', rows: [{ s: 'Dr', a: 'Notes payable', v: note }, { s: 'Dr', a: 'Interest expense', v: interest }, { s: 'Cr', a: 'Cash', v: note + interest }], e: 'Principal settles the liability; only the interest is a cost. Three lines, still balanced.' },\n            { t: 'entry', p: 'It pays ' + c.money(div) + ' of dividends.', rows: [{ s: 'Dr', a: 'Retained earnings', v: div }, { s: 'Cr', a: 'Cash', v: div }], e: 'A distribution of profit, straight out of retained earnings. There is no dividend expense account.' }\n          ]\n        };\n      }\n    },\n    {\n      key: 'g-nopat', course: 'fa', title: 'NOPAT and ROIC', ses: 'Session 03 · Income Statement', sub: 'Strip financing out of new figures',\n      build: function (c) {\n        const ebit = c.rnd(600, 3000, 50);\n        const tax = c.rnd(15, 30, 1);\n        const iexp = c.rnd(50, 400, 10);\n        const iinc = c.rnd(0, 150, 10);\n        const pbt = ebit - iexp + iinc;\n        const ni = Math.round(pbt * (100 - tax) / 100);\n        const ic = c.rnd(4, 20, 1) * 1000;\n        const nopat = ebit * (100 - tax) / 100;\n        return {\n          brief: 'A company reports operating profit (EBIT) of ' + c.money(ebit) + ', interest expense ' + c.money(iexp) + ', interest income ' + c.money(iinc) + ', profit before tax ' + c.money(pbt) + ' and net income ' + c.money(ni) + '. The tax rate is ' + tax + '%. Average invested capital is ' + c.money(ic) + '.',\n          steps: [\n            { t: 'fill', p: 'Step 1. The quick approach.', rows: [\n              { l: 'NOPAT (EBIT × (1 − tax rate))', a: nopat, tol: 2, w: c.money(ebit) + ' × ' + (100 - tax) + '%. EBIT is already before interest, so taxing it gives a debt-free operating profit.' }\n            ], e: 'Quick and dirty because it assumes operating profit was taxed at exactly the statutory rate.' },\n            { t: 'fill', p: 'Step 2. From the top down: net income less after-tax financing.', rows: [\n              { l: 'Net non-operating income before tax', a: iinc - iexp, tol: 1, w: 'Interest income ' + c.money(iinc) + ' − interest expense ' + c.money(iexp) + '.' },\n              { l: 'The same amount after tax', a: (iinc - iexp) * (100 - tax) / 100, tol: 2, w: 'Interest is tax-deductible, so remove it after tax.' },\n              { l: 'NOPAT', a: ni - (iinc - iexp) * (100 - tax) / 100, tol: 3, w: 'Net income ' + c.money(ni) + ' less that after-tax amount. It should land close to step 1.' }\n            ], e: 'Two routes to one number is the check that the financing has been removed consistently.' },\n            { t: 'fill', p: 'Step 3. The return that matters.', rows: [\n              { l: 'ROIC (%)', a: nopat / ic * 100, tol: 0.4, w: 'NOPAT ' + c.money(Math.round(nopat)) + ' ÷ invested capital ' + c.money(ic) + '.' }\n            ], e: 'Two identical businesses with different debt report different net income but the same ROIC.' }\n          ]\n        };\n      }\n    },\n    {\n      key: 'g-noa', course: 'fa', title: 'Operating split, NOA and invested capital', ses: 'Session 02 · Balance Sheet', sub: 'A different balance sheet each time',\n      build: function (c) {\n        const ta = c.rnd(800, 2400, 50) * 1000;\n        const fa1 = c.rnd(10, 90, 5) * 1000, fa2 = c.rnd(5, 70, 5) * 1000, fa3 = c.rnd(1, 30, 1) * 1000;\n        const fin = fa1 + fa2 + fa3;\n        const ol = c.rnd(80, 400, 10) * 1000;\n        const fl1 = c.rnd(20, 200, 10) * 1000, fl2 = c.rnd(30, 300, 10) * 1000;\n        const flTot = fl1 + fl2;\n        const eq = ta - ol - flTot;\n        return {\n          brief: 'Total assets ' + c.money(ta) + '. Financial assets: deposits ' + c.money(fa1) + ', held-to-maturity securities ' + c.money(fa2) + ', derivatives ' + c.money(fa3) + '. Operating liabilities total ' + c.money(ol) + '. Financial liabilities: short-term loans ' + c.money(fl1) + ', bonds payable ' + c.money(fl2) + '. Total equity ' + c.money(eq) + '.',\n          steps: [\n            { t: 'fill', p: 'Step 1. Strip out the financial assets.', rows: [\n              { l: 'Total financial assets', a: fin, tol: 1, w: c.money(fa1) + ' + ' + c.money(fa2) + ' + ' + c.money(fa3) + '. These earn interest rather than run the business.' },\n              { l: 'Total operating assets', a: ta - fin, tol: 1, w: 'Total assets ' + c.money(ta) + ' − financial assets. Subtracting is quicker than adding the operating lines.' }\n            ], e: 'Value is created in operations; financing is how operations are funded.' },\n            { t: 'fill', p: 'Step 2. Net operating assets.', rows: [\n              { l: 'Net operating assets (NOA)', a: ta - fin - ol, tol: 1, w: 'Operating assets ' + c.money(ta - fin) + ' − operating liabilities ' + c.money(ol) + '.' }\n            ], e: 'Everything operations use, less the free credit operations generate themselves.' },\n            { t: 'fill', p: 'Step 3. The same number from the funding side.', rows: [\n              { l: 'Total financial liabilities', a: flTot, tol: 1, w: c.money(fl1) + ' + ' + c.money(fl2) + '.' },\n              { l: 'Invested capital', a: eq + flTot - fin, tol: 1, w: 'Equity ' + c.money(eq) + ' + financial liabilities ' + c.money(flTot) + ' − financial assets ' + c.money(fin) + '.' }\n            ], e: 'Invested capital should equal NOA. If it does not, something has been classified inconsistently.' }\n          ]\n        };\n      }\n    },\n    {\n      key: 'g-accrual', course: 'fa', title: 'Cash basis versus accrual basis', ses: 'Session 03 · Income Statement', sub: 'A new month of transactions each run',\n      build: function (c) {\n        const cashSales = c.rnd(20, 80, 5) * 1000;\n        const credSales = c.rnd(3, 20, 1) * 1000;\n        const advance = c.rnd(5, 30, 1) * 100;\n        const rentMonth = c.rnd(1, 5, 1) * 1000;\n        const rentPaid = rentMonth * 2;\n        const equip = c.rnd(12, 60, 6) * 1000;\n        const years = c.rnd(3, 6, 1);\n        const ins = c.rnd(6, 24, 6) * 100;\n        const util = c.rnd(3, 12, 1) * 100;\n        const utilOwed = c.rnd(1, 6, 1) * 100;\n        const wages = c.rnd(2, 12, 1) * 500;\n        const wagesOwed = c.rnd(2, 12, 1) * 100;\n        const purch = c.rnd(20, 60, 5) * 1000;\n        const purchOwed = c.rnd(1, 8, 1) * 500;\n        const closing = c.rnd(2, 12, 1) * 500;\n        const loan = c.rnd(10, 60, 5) * 1000;\n        const rate = c.rnd(3, 9, 1);\n        const cashRev = cashSales + advance;\n        const cashExp = purch + rentPaid + equip + ins + util + wages;\n        const accRev = cashSales + credSales;\n        const cogs = purch + purchOwed - closing;\n        const dep = equip / years / 12;\n        const interest = loan * rate / 100 / 12;\n        const accExp = cogs + (wages + wagesOwed) + rentMonth + ins / 12 + (util + utilOwed) + dep + interest;\n        return {\n          brief: 'A shop\\u2019s first month. Money in: ' + c.money(cashSales) + ' of cash sales; ' + c.money(advance) + ' from a customer for goods to be delivered next month; a bank loan of ' + c.money(loan) + ' at ' + rate + '% a year, taken on day one. Money out: ' + c.money(rentPaid) + ' of rent (two months at ' + c.money(rentMonth) + '); ' + c.money(equip) + ' of equipment expected to last ' + years + ' years with no resale value; ' + c.money(ins) + ' of insurance covering the next twelve months; ' + c.money(util) + ' of utility bills; ' + c.money(wages) + ' of wages; ' + c.money(purch) + ' of merchandise. At month end: customers owe ' + c.money(credSales) + ' for goods delivered this month; suppliers are owed ' + c.money(purchOwed) + ' for merchandise received; unpaid utilities ' + c.money(utilOwed) + ' and unpaid wages ' + c.money(wagesOwed) + '; merchandise costing ' + c.money(closing) + ' is unsold.',\n          steps: [\n            { t: 'fill', p: 'Step 1. The cash basis: money in is revenue, money out is expense.', rows: [\n              { l: 'Cash basis revenue', a: cashRev, tol: 1, w: 'Cash sales ' + c.money(cashSales) + ' + the ' + c.money(advance) + ' advance. The loan is not income — it has to be repaid.' },\n              { l: 'Cash basis expenses', a: cashExp, tol: 1, w: 'Everything paid, in full: merchandise, both months of rent, the whole machine, a year of insurance, utilities and wages paid.' },\n              { l: 'Cash basis net income (minus sign if a loss)', a: cashRev - cashExp, tol: 1, w: c.money(cashRev) + ' − ' + c.money(cashExp) + '.' }\n            ], e: 'A machine lasting ' + years + ' years and a year of insurance both landed in one month. That is why this figure describes cash, not performance.' },\n            { t: 'fill', p: 'Step 2. Accrual revenue and cost of goods sold.', rows: [\n              { l: 'Revenue earned', a: accRev, tol: 1, w: 'Delivered goods count: ' + c.money(cashSales) + ' + ' + c.money(credSales) + '. The advance is a liability — nothing delivered yet.' },\n              { l: 'Total merchandise purchased', a: purch + purchOwed, tol: 1, w: 'Paid ' + c.money(purch) + ' + still owed ' + c.money(purchOwed) + '. Both were bought this month.' },\n              { l: 'Cost of goods sold', a: cogs, tol: 1, w: 'Purchases ' + c.money(purch + purchOwed) + ' − unsold stock ' + c.money(closing) + '. Only what left the shelves is an expense.' }\n            ], e: 'Matching: the cost of the goods sold sits against the revenue from selling them.' },\n            { t: 'fill', p: 'Step 3. The remaining costs — only this month\\u2019s share of each.', rows: [\n              { l: 'Wage expense', a: wages + wagesOwed, tol: 1, w: 'Paid ' + c.money(wages) + ' + earned but unpaid ' + c.money(wagesOwed) + '. The work happened this month.' },\n              { l: 'Rent expense', a: rentMonth, tol: 1, w: 'One of the two months paid. The other is prepaid rent, an asset.' },\n              { l: 'Insurance expense', a: ins / 12, tol: 1, w: c.money(ins) + ' ÷ 12 months.' },\n              { l: 'Utilities expense', a: util + utilOwed, tol: 1, w: 'Consumed is what counts: ' + c.money(util) + ' + ' + c.money(utilOwed) + '.' },\n              { l: 'Depreciation expense', a: dep, tol: 1, w: c.money(equip) + ' ÷ ' + years + ' years ÷ 12 months.' },\n              { l: 'Interest expense', a: interest, tol: 1, w: c.money(loan) + ' × ' + rate + '% × 1/12. It accrues with time, unpaid or not.' }\n            ], e: 'Every line answers the same question: how much of this cost was used up this month?' },\n            { t: 'fill', p: 'Step 4. Finish and compare.
